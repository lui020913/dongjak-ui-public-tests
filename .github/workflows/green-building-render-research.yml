name: Research - Green building app rendering comparison
on:
  push:
    branches: [diagnostic/green-building-render-20261126]
permissions:
  contents: read
  actions: read
concurrency:
  group: green-building-render-research
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ceacc5985f88a1dfb1bffb95015d6dbedf930d5e
          path: actual
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instrument the exact production candidate only inside this runner
        run: |
          test "$(git -C actual rev-parse HEAD)" = ceacc5985f88a1dfb1bffb95015d6dbedf930d5e
          node --input-type=module -e "import fs from 'node:fs';const p='actual/app/src/main.js',s=fs.readFileSync(p,'utf8'),needle='installSolidMapLines(map);';if(s.split(needle).length!==2)throw Error('unexpected map entry');fs.writeFileSync(p,s.replace(needle,'globalThis.__qaMap=map;'+needle));"
          cp app/tests/green-building-render-research.mjs actual/app/tests/green-building-render-research.mjs
      - working-directory: actual/app
        run: npm ci
      - working-directory: actual/app
        run: npm run build
      - name: Compare actual app 2D and 3D rendering
        working-directory: actual
        run: node app/tests/green-building-render-research.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: green-building-render-comparison
          path: actual/audit-render-output/
          if-no-files-found: warn
          retention-days: 14
