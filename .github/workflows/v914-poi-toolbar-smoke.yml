name: v8.9.14 POI toolbar mobile/tablet browser smoke
on:
  push:
    branches: [main]
    paths: ['release/poi-toolbar-smoke-request.json']
permissions:
  contents: read
concurrency:
  group: v914-poi-toolbar-smoke
  cancel-in-progress: false
jobs:
  toolbar:
    if: github.repository == 'lui020913/dongjak-ui-public-tests' && github.ref == 'refs/heads/main' && github.actor == 'lui020913'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        viewport: [mobile375, mobile390]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Read exact Preview request
        run: |
          node --input-type=module - <<'JS'
          import {readFileSync,appendFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('release/poi-toolbar-smoke-request.json','utf8'));
          if(!/^[a-f0-9]{40}$/.test(r.source_sha)||!Number.isSafeInteger(r.build_run)||r.build_run<1||r.target_url!=='https://ui-v911-motion-preview.dongjak-walk-safety-preview.pages.dev/')throw Error('Invalid exact Preview request');
          appendFileSync(process.env.GITHUB_ENV,'DONGJAK_EXPECTED_SOURCE_SHA='+r.source_sha+'\nDONGJAK_EXPECTED_BUILD_RUN='+r.build_run+'\nDONGJAK_TARGET_URL='+r.target_url+'\n');
          JS
      - run: node scripts/verify-release-source.mjs
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: playwright-npm-noble-${{ hashFiles('package.json') }}
      - name: Install pinned test package
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-audit --no-fund
      - name: Run only new toolbar browser regression
        run: npx playwright test --config=playwright.v911-remote.config.mjs --project=${{ matrix.viewport }} --grep "POI filters share the existing top toolbar"
      - name: Verify exact Preview did not change
        if: always()
        run: node scripts/verify-release-source.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v914-toolbar-${{ matrix.viewport }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
