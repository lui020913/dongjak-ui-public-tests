name: Dispatch approved full-app Preview validation
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  dispatch:
    if: github.event.issue.number == 15 && github.event.comment.user.login == 'lui020913' && !github.event.issue.pull_request
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify owner approval matches actual candidate
        env:
          APPROVAL: ${{ github.event.comment.body }}
          PRIVATE_PREVIEW_DISPATCH_TOKEN: ${{ secrets.PRIVATE_PREVIEW_DISPATCH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPROVAL" =~ ^승인\ [a-f0-9]{40}\ [a-f0-9]{64}$ ]] || exit 0
          read -r command pub css <<< "$APPROVAL"
          curl -fsSL --max-time 20 'https://public-ui-rc.dongjak-walk-safety-preview.pages.dev/release-source.json' |
            jq -e --arg pub "$pub" --arg css "$css" '.public_ui_source_commit==$pub and .public_ui_overlay_sha256==$css and .release_status=="CANDIDATE_PREVIEW_NOT_PRODUCTION"'
          test -n "$PRIVATE_PREVIEW_DISPATCH_TOKEN"
          curl -fsS --max-time 25 --request POST -H "Authorization: Bearer $PRIVATE_PREVIEW_DISPATCH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/lui020913/dongjak-safety-map/actions/workflows/dongjak-public-ui-prod-gate.yml/dispatches' --data '{"ref":"main"}'
