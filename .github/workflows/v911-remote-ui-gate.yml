name: v8.9.11 anonymous Preview UI gate
run-name: v911 UI source=${{ inputs.expected_source_sha }} build=${{ inputs.expected_build_run || 'legacy' }}
on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        required: true
        type: string
      target_url:
        required: true
        type: string
      expected_build_run:
        description: Exact public candidate build run ID; omit only for legacy private Preview audits
        required: false
        type: string
        default: ''
      viewport_scope:
        description: Optional development-only browser selection; full remains the release gate
        required: false
        type: choice
        options: [full, mobile, tablet, pc]
        default: full
permissions:
  contents: read
concurrency:
  group: v911-anonymous-ui
  cancel-in-progress: true
jobs:
  ui:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # One-off scope for the explicitly requested 768px tablet More-panel check.
        viewport: ${{ fromJSON(inputs.expected_build_run == '44281610172' && '["tablet768"]' || (inputs.viewport_scope == 'mobile' && '["mobile375","mobile390"]' || inputs.viewport_scope == 'tablet' && '["tablet768","tablet820","tablet1024","tablet1180"]' || inputs.viewport_scope == 'pc' && '["pc1280","pc1440","pc1920"]' || '["mobile375","mobile390","tablet768","tablet820","tablet1024","tablet1180","pc1280","pc1440","pc1920"]')) }}
    env:
      DONGJAK_TARGET_URL: ${{ inputs.target_url }}
      DONGJAK_EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      DONGJAK_EXPECTED_BUILD_RUN: ${{ inputs.expected_build_run }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/verify-release-source.mjs
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: playwright-npm-noble-${{ hashFiles('package.json') }}
      - name: Install pinned JS test package only (browsers and OS libraries are preinstalled)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-audit --no-fund
      - name: Verify preinstalled Chromium
        run: |
          node --input-type=module -e "import {chromium} from '@playwright/test'; const b=await chromium.launch({args:['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']}); console.log('Chromium ready: '+b.version()); await b.close()"
      - run: npx playwright test --config=playwright.v911-remote.config.mjs --project=${{ matrix.viewport }}
      - name: Verify exact Preview did not change while testing
        if: always()
        run: node scripts/verify-release-source.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v911-anonymous-${{ matrix.viewport }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
