name: Public frontend PR validation
on:
  pull_request:
    branches:
      - public/frontend-foundation-20261117
    paths:
      - 'frontend/**'
      - '.github/workflows/public-frontend-pr.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: UI check (${{ matrix.device }})
    strategy:
      fail-fast: false
      matrix:
        device: [mobile, tablet, desktop, shared]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Static and safety checks
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright regression suite
        env:
          DEVICE_GROUP: ${{ matrix.device }}
        run: |
          case "$DEVICE_GROUP" in
            mobile)  npx playwright test --grep 'mobile' ;;
            tablet)  npx playwright test --grep 'tablet' ;;
            desktop) npx playwright test --grep 'desktop|pc-' ;;
            shared)  npx playwright test --grep-invert 'mobile|tablet|desktop|pc-' ;;
            *) exit 1 ;;
          esac
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-ui-playwright-${{ github.run_id }}-${{ matrix.device }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/visual-artifacts/
          if-no-files-found: ignore
          retention-days: 7
