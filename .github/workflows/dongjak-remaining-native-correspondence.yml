name: Dongjak remaining native road correspondence
on:
  push:
    branches: [audit/remaining-native-road-correspondence-20261126]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install shapely==2.1.2 pyproj==3.7.2 mapbox-vector-tile==2.2.0
      - uses: actions/download-artifact@v4
        with:
          name: dongjak-reaudited-road-display-assets
          path: assets
          run-id: 45786891095
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: dongjak-exact-free-space-review
          path: reviewed
          run-id: 45768516164
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: dongjak-residual-source-evidence
          path: residual
          run-id: 45786890876
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: dongjak-green-building-audit
          path: green
          run-id: 45745321396
          github-token: ${{ github.token }}
      - run: |
          python scripts/research/dongjak_remaining_native_correspondence.py assets reviewed/exact-review residual green output
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dongjak-remaining-native-correspondence
          path: output/
          retention-days: 14
          if-no-files-found: error
