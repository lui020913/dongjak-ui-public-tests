name: Dongjak road layer alignment review
on:
  pull_request:
    paths:
      - 'scripts/research/dongjak_road_layer_alignment.py'
      - '.github/workflows/dongjak-road-layer-alignment.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install shapely==2.1.2 pyproj==3.7.2
      - uses: actions/download-artifact@v4
        with:
          name: dongjak-district-refined-review
          path: dongjak-refined-review
          run-id: 45756265086
          github-token: ${{ github.token }}
      - run: python scripts/research/dongjak_road_layer_alignment.py --test
      - run: python scripts/research/dongjak_road_layer_alignment.py dongjak-refined-review dongjak-layer-alignment
      - uses: actions/upload-artifact@v4
        with:
          name: dongjak-road-layer-alignment-review
          path: dongjak-layer-alignment/
          if-no-files-found: error
          retention-days: 14
