name: Current building footprint comparison
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/research/audit_current_building_footprints.py'
      - '.github/workflows/current-building-footprint-comparison.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'shapely==2.1.2' 'pyproj==3.7.2'
      - run: python scripts/research/audit_current_building_footprints.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-building-footprint-review
          path: audit-redevelopment-output/
          retention-days: 14
