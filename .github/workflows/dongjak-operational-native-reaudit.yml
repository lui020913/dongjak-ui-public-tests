name: Dongjak operational native replacement re-audit
on:
  pull_request:
    paths:
      - 'scripts/research/dongjak_operational_native_reaudit.py'
      - '.github/workflows/dongjak-operational-native-reaudit.yml'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'preview/road-surface-geometry-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install shapely==2.1.2 pyproj==3.7.2 mapbox-vector-tile==2.2.0
      - uses: actions/download-artifact@v4
        with:
          name: dongjak-operational-road-display-assets
          path: assets
          run-id: 45782401894
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: dongjak-hybrid-road-display-review
          path: hybrid
          run-id: 45771682292
          github-token: ${{ github.token }}
      - run: python scripts/research/dongjak_operational_native_reaudit.py assets hybrid reaudited
      - uses: actions/upload-artifact@v4
        with:
          name: dongjak-reaudited-road-display-assets
          path: reaudited/road-display-review/
          retention-days: 30
          if-no-files-found: error
