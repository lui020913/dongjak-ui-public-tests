name: Gemini UI improvement after approved Production

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: ai-ui-preview
  cancel-in-progress: false

jobs:
  improve:
    if: >-
      github.repository == 'lui020913/dongjak-ui-public-tests' &&
      github.actor == 'lui020913' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.issue.number == 15 && !github.event.issue.pull_request &&
        github.event.comment.user.login == 'lui020913' &&
        startsWith(github.event.comment.body, '승인 ')))
    runs-on: ubuntu-24.04
    timeout-minutes: 145
    permissions:
      contents: write
      issues: write
    env:
      PRODUCTION_URL: https://dongjak-walk-safety-preview.pages.dev
      PREVIEW_URL: https://public-ui-rc.dongjak-walk-safety-preview.pages.dev
      SOURCE_BRANCH: automation/gemini-production-baseline
      OVERLAY: frontend/production/dongjak-production-overlay.css
      GEMINI_MODEL: gemini-3.5-flash-lite
      POLICY_BLOB: cc05ed6c2331add4b04c38f334385a446f573ad9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0
          path: ui
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Notify progress - 운영 배포 확인 대기 (최대 약 100분)
        if: ${{ success() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          message="운영 배포 확인 대기 (최대 약 100분) · [실행 상세]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) · attempt $GITHUB_RUN_ATTEMPT"
          gh issue comment 15 --repo "$GITHUB_REPOSITORY" --body "$message" || echo "::warning::GitHub progress comment failed"
          if [[ -n "$SMTP_USER" && -n "$SMTP_APP_PASSWORD" && -n "$NOTIFY_EMAIL" ]]; then
            MESSAGE="$message" python3 - <<'PY' || echo "::warning::Email delivery failed"
          import os, smtplib, ssl
          from email.message import EmailMessage
          msg = EmailMessage()
          msg["From"] = os.environ["SMTP_USER"]
          msg["To"] = os.environ["NOTIFY_EMAIL"]
          msg["Subject"] = "동작구 안전지도 개발 알림"
          msg.set_content(os.environ["MESSAGE"])
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=15, context=ssl.create_default_context()) as smtp:
              smtp.login(os.environ["SMTP_USER"], os.environ["SMTP_APP_PASSWORD"])
              smtp.send_message(msg)
          PY
          fi
      - name: Verify approval and live release before generating a change
        env:
          APPROVAL: ${{ github.event.comment.body }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.PRIVATE_PREVIEW_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY" || { echo "::error::Configure the GEMINI_API_KEY Actions secret."; exit 1; }
          test -n "$GH_TOKEN" || { echo "::error::Missing existing Preview dispatch secret."; exit 1; }
          nonce() { date +%s; }
          if [[ "$GITHUB_EVENT_NAME" == issue_comment ]]; then
            [[ "$APPROVAL" =~ ^승인\ [a-f0-9]{40}\ [a-f0-9]{64}$ ]]
            read -r _ approved_source approved_css <<< "$APPROVAL"
            curl -fsS --max-time 15 "$PREVIEW_URL/release-source.json?run=$GITHUB_RUN_ID" |
              jq -e --arg sha "$approved_source" --arg css "$approved_css" \
                '.release_status=="CANDIDATE_PREVIEW_NOT_PRODUCTION" and .public_ui_source_commit==$sha and .public_ui_overlay_sha256==$css' >/dev/null
          fi
          # Wait only in response to an owner approval. A manual bootstrap checks once.
          attempts=1
          [[ "$GITHUB_EVENT_NAME" != issue_comment ]] || attempts=82
          for ((i=1; i<=attempts; i++)); do
            if curl -fsS --max-time 12 "$PRODUCTION_URL/release-source.json?t=$(nonce)" -o "$RUNNER_TEMP/ui-live.json" &&
               jq -e --arg css "${approved_css:-}" --arg sha "${approved_source:-}" \
                 '.release_status=="DEPLOYED_PRODUCTION" and ($css=="" or .public_ui_overlay_sha256==$css) and
                  (.build_run|tostring|test("^[0-9]+$")) and
                  ($sha=="" or .public_ui_source_commit==$sha)' "$RUNNER_TEMP/ui-live.json" >/dev/null &&
               run="$(jq -r .build_run "$RUNNER_TEMP/ui-live.json")" &&
               gh api "repos/lui020913/dongjak-safety-map/actions/runs/$run/jobs" |
                 jq -e 'any(.jobs[]; .name=="Guarded Production promotion and automatic rollback" and .conclusion=="success")' >/dev/null; then
              source="$(jq -er '.public_ui_source_commit | select(test("^[a-f0-9]{40}$"))' "$RUNNER_TEMP/ui-live.json")"
              git -C ui fetch origin "$source"
              git -C ui checkout --detach "$source"
              test "$(sha256sum "ui/$OVERLAY" | cut -d' ' -f1)" = "$(jq -r .public_ui_overlay_sha256 "$RUNNER_TEMP/ui-live.json")"
              exit 0
            fi
            if ((i < attempts)); then sleep 60; fi
          done
          echo "::error::Production has not deployed the exact current overlay. Keep the existing candidate."
          exit 1
      - name: Notify progress - Gemini CSS 개선 및 검증 (최대 요청 3회)
        if: ${{ success() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          message="Gemini CSS 개선 및 검증 (최대 요청 3회) · [실행 상세]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) · attempt $GITHUB_RUN_ATTEMPT"
          gh issue comment 15 --repo "$GITHUB_REPOSITORY" --body "$message" || echo "::warning::GitHub progress comment failed"
          if [[ -n "$SMTP_USER" && -n "$SMTP_APP_PASSWORD" && -n "$NOTIFY_EMAIL" ]]; then
            MESSAGE="$message" python3 - <<'PY' || echo "::warning::Email delivery failed"
          import os, smtplib, ssl
          from email.message import EmailMessage
          msg = EmailMessage()
          msg["From"] = os.environ["SMTP_USER"]
          msg["To"] = os.environ["NOTIFY_EMAIL"]
          msg["Subject"] = "동작구 안전지도 개발 알림"
          msg.set_content(os.environ["MESSAGE"])
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=15, context=ssl.create_default_context()) as smtp:
              smtp.login(os.environ["SMTP_USER"], os.environ["SMTP_APP_PASSWORD"])
              smtp.send_message(msg)
          PY
          fi
      - name: Generate one design-preserving CSS adjustment
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test "$(git -C ui hash-object frontend/scripts/check-production-overlay.mjs)" = "$POLICY_BLOB"
          node scripts/ai-ui-overlay.mjs
          node ui/frontend/scripts/check-production-overlay.mjs
          git -C ui diff --check
          test "$(git -C ui diff --name-only)" = "$OVERLAY"
      - name: Notify progress - 공개 프런트엔드 빌드 및 테스트
        if: ${{ success() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          message="공개 프런트엔드 빌드 및 테스트 · [실행 상세]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) · attempt $GITHUB_RUN_ATTEMPT"
          gh issue comment 15 --repo "$GITHUB_REPOSITORY" --body "$message" || echo "::warning::GitHub progress comment failed"
          if [[ -n "$SMTP_USER" && -n "$SMTP_APP_PASSWORD" && -n "$NOTIFY_EMAIL" ]]; then
            MESSAGE="$message" python3 - <<'PY' || echo "::warning::Email delivery failed"
          import os, smtplib, ssl
          from email.message import EmailMessage
          msg = EmailMessage()
          msg["From"] = os.environ["SMTP_USER"]
          msg["To"] = os.environ["NOTIFY_EMAIL"]
          msg["Subject"] = "동작구 안전지도 개발 알림"
          msg.set_content(os.environ["MESSAGE"])
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=15, context=ssl.create_default_context()) as smtp:
              smtp.login(os.environ["SMTP_USER"], os.environ["SMTP_APP_PASSWORD"])
              smtp.send_message(msg)
          PY
          fi
      - name: Build and test the public frontend
        working-directory: ui/frontend
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Notify progress - 검증된 후보 커밋 저장
        if: ${{ success() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          message="검증된 후보 커밋 저장 · [실행 상세]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) · attempt $GITHUB_RUN_ATTEMPT"
          gh issue comment 15 --repo "$GITHUB_REPOSITORY" --body "$message" || echo "::warning::GitHub progress comment failed"
          if [[ -n "$SMTP_USER" && -n "$SMTP_APP_PASSWORD" && -n "$NOTIFY_EMAIL" ]]; then
            MESSAGE="$message" python3 - <<'PY' || echo "::warning::Email delivery failed"
          import os, smtplib, ssl
          from email.message import EmailMessage
          msg = EmailMessage()
          msg["From"] = os.environ["SMTP_USER"]
          msg["To"] = os.environ["NOTIFY_EMAIL"]
          msg["Subject"] = "동작구 안전지도 개발 알림"
          msg.set_content(os.environ["MESSAGE"])
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=15, context=ssl.create_default_context()) as smtp:
              smtp.login(os.environ["SMTP_USER"], os.environ["SMTP_APP_PASSWORD"])
              smtp.send_message(msg)
          PY
          fi
      - name: Recheck Production and push tested CSS
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 "$PRODUCTION_URL/release-source.json?recheck=$GITHUB_RUN_ID" |
            jq -e --slurpfile prior "$RUNNER_TEMP/ui-live.json" \
              '.release_status=="DEPLOYED_PRODUCTION" and .build_run==$prior[0].build_run and
               .public_ui_overlay_sha256==$prior[0].public_ui_overlay_sha256' >/dev/null
          git -C ui diff --check
          test "$(git -C ui diff --name-only)" = "$OVERLAY"
          node ui/frontend/scripts/check-production-overlay.mjs
          git -C ui config user.name 'github-actions[bot]'
          git -C ui config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C ui add -- "$OVERLAY"
          git -C ui commit -m 'Improve one public UI CSS detail'
          gh auth setup-git
          candidate_branch="$SOURCE_BRANCH-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git -C ui push origin "HEAD:refs/heads/$candidate_branch"
          echo "source=$(git -C ui rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "css=$(sha256sum "ui/$OVERLAY" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          printf 'Public CSS commit: `%s`\n\n' "$(git -C ui rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Notify progress - 전체 앱 Preview 배포 요청
        if: ${{ success() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          message="전체 앱 Preview 배포 요청 · [실행 상세]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) · attempt $GITHUB_RUN_ATTEMPT"
          gh issue comment 15 --repo "$GITHUB_REPOSITORY" --body "$message" || echo "::warning::GitHub progress comment failed"
          if [[ -n "$SMTP_USER" && -n "$SMTP_APP_PASSWORD" && -n "$NOTIFY_EMAIL" ]]; then
            MESSAGE="$message" python3 - <<'PY' || echo "::warning::Email delivery failed"
          import os, smtplib, ssl
          from email.message import EmailMessage
          msg = EmailMessage()
          msg["From"] = os.environ["SMTP_USER"]
          msg["To"] = os.environ["NOTIFY_EMAIL"]
          msg["Subject"] = "동작구 안전지도 개발 알림"
          msg.set_content(os.environ["MESSAGE"])
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=15, context=ssl.create_default_context()) as smtp:
              smtp.login(os.environ["SMTP_USER"], os.environ["SMTP_APP_PASSWORD"])
              smtp.send_message(msg)
          PY
          fi
      - name: Dispatch existing full-app gate for Preview
        env:
          EXPECTED_SOURCE: ${{ steps.publish.outputs.source }}
          GH_TOKEN: ${{ secrets.PRIVATE_PREVIEW_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method POST \
            repos/lui020913/dongjak-safety-map/actions/workflows/dongjak-public-ui-prod-gate.yml/dispatches \
            -f ref=main -f "inputs[candidate_source]=$EXPECTED_SOURCE"
          echo 'Full-app build, regression testing and Preview requested. Review the resulting exact candidate in issue #15.' >> "$GITHUB_STEP_SUMMARY"
      - name: Notify progress - Preview 검증 대기 (최대 약 45분)
        if: ${{ success() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          message="Preview 검증 대기 (최대 약 45분) · [실행 상세]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) · attempt $GITHUB_RUN_ATTEMPT"
          gh issue comment 15 --repo "$GITHUB_REPOSITORY" --body "$message" || echo "::warning::GitHub progress comment failed"
          if [[ -n "$SMTP_USER" && -n "$SMTP_APP_PASSWORD" && -n "$NOTIFY_EMAIL" ]]; then
            MESSAGE="$message" python3 - <<'PY' || echo "::warning::Email delivery failed"
          import os, smtplib, ssl
          from email.message import EmailMessage
          msg = EmailMessage()
          msg["From"] = os.environ["SMTP_USER"]
          msg["To"] = os.environ["NOTIFY_EMAIL"]
          msg["Subject"] = "동작구 안전지도 개발 알림"
          msg.set_content(os.environ["MESSAGE"])
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=15, context=ssl.create_default_context()) as smtp:
              smtp.login(os.environ["SMTP_USER"], os.environ["SMTP_APP_PASSWORD"])
              smtp.send_message(msg)
          PY
          fi
      - name: Verify the exact deployed full-app Preview
        env:
          EXPECTED_SOURCE: ${{ steps.publish.outputs.source }}
          EXPECTED_CSS: ${{ steps.publish.outputs.css }}
          GH_TOKEN: ${{ secrets.PRIVATE_PREVIEW_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          for ((i=1; i<=38; i++)); do
            if curl -fsS --max-time 12 "$PREVIEW_URL/release-source.json?run=$GITHUB_RUN_ID-$i" -o "$RUNNER_TEMP/ui-candidate.json" &&
               jq -e --arg sha "$EXPECTED_SOURCE" --arg css "$EXPECTED_CSS" \
                  '.release_status=="CANDIDATE_PREVIEW_NOT_PRODUCTION" and .public_ui_source_commit==$sha and
                  .public_ui_overlay_sha256==$css and (.build_run|tostring|test("^[0-9]+$"))' "$RUNNER_TEMP/ui-candidate.json" >/dev/null &&
               run="$(jq -r .build_run "$RUNNER_TEMP/ui-candidate.json")" &&
               gh api "repos/lui020913/dongjak-safety-map/actions/runs/$run/jobs" |
                 jq -e 'any(.jobs[]; .name=="Test composite app at isolated full-app Preview and snapshot Production" and .conclusion=="success")' >/dev/null; then
              {
                echo "Preview: $PREVIEW_URL"
                echo "Approval: https://github.com/lui020913/dongjak-ui-public-tests/issues/15"
                echo
                echo "\`승인 $EXPECTED_SOURCE $EXPECTED_CSS\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if ((i < 38)); then sleep 60; fi
          done
          echo "::error::The exact tested Preview did not deploy before the verification timeout."
          exit 1
      - name: Notify progress - 작업 완료 - Preview 확인 및 승인 대기
        if: ${{ success() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          message="작업 완료 - Preview 확인 및 승인 대기 · [실행 상세]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) · attempt $GITHUB_RUN_ATTEMPT"
          gh issue comment 15 --repo "$GITHUB_REPOSITORY" --body "$message" || echo "::warning::GitHub progress comment failed"
          if [[ -n "$SMTP_USER" && -n "$SMTP_APP_PASSWORD" && -n "$NOTIFY_EMAIL" ]]; then
            MESSAGE="$message" python3 - <<'PY' || echo "::warning::Email delivery failed"
          import os, smtplib, ssl
          from email.message import EmailMessage
          msg = EmailMessage()
          msg["From"] = os.environ["SMTP_USER"]
          msg["To"] = os.environ["NOTIFY_EMAIL"]
          msg["Subject"] = "동작구 안전지도 개발 알림"
          msg.set_content(os.environ["MESSAGE"])
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=15, context=ssl.create_default_context()) as smtp:
              smtp.login(os.environ["SMTP_USER"], os.environ["SMTP_APP_PASSWORD"])
              smtp.send_message(msg)
          PY
          fi
      - name: Notify progress - 작업 실패 - 실행 상세에서 실패 단계 확인
        if: ${{ failure() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          message="작업 실패 - 실행 상세에서 실패 단계 확인 · [실행 상세]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) · attempt $GITHUB_RUN_ATTEMPT"
          gh issue comment 15 --repo "$GITHUB_REPOSITORY" --body "$message" || echo "::warning::GitHub progress comment failed"
          if [[ -n "$SMTP_USER" && -n "$SMTP_APP_PASSWORD" && -n "$NOTIFY_EMAIL" ]]; then
            MESSAGE="$message" python3 - <<'PY' || echo "::warning::Email delivery failed"
          import os, smtplib, ssl
          from email.message import EmailMessage
          msg = EmailMessage()
          msg["From"] = os.environ["SMTP_USER"]
          msg["To"] = os.environ["NOTIFY_EMAIL"]
          msg["Subject"] = "동작구 안전지도 개발 알림"
          msg.set_content(os.environ["MESSAGE"])
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=15, context=ssl.create_default_context()) as smtp:
              smtp.login(os.environ["SMTP_USER"], os.environ["SMTP_APP_PASSWORD"])
              smtp.send_message(msg)
          PY
          fi
      - name: Notify progress - 작업 취소 - 실행 상세 확인
        if: ${{ cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          message="작업 취소 - 실행 상세 확인 · [실행 상세]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) · attempt $GITHUB_RUN_ATTEMPT"
          gh issue comment 15 --repo "$GITHUB_REPOSITORY" --body "$message" || echo "::warning::GitHub progress comment failed"
          if [[ -n "$SMTP_USER" && -n "$SMTP_APP_PASSWORD" && -n "$NOTIFY_EMAIL" ]]; then
            MESSAGE="$message" python3 - <<'PY' || echo "::warning::Email delivery failed"
          import os, smtplib, ssl
          from email.message import EmailMessage
          msg = EmailMessage()
          msg["From"] = os.environ["SMTP_USER"]
          msg["To"] = os.environ["NOTIFY_EMAIL"]
          msg["Subject"] = "동작구 안전지도 개발 알림"
          msg.set_content(os.environ["MESSAGE"])
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=15, context=ssl.create_default_context()) as smtp:
              smtp.login(os.environ["SMTP_USER"], os.environ["SMTP_APP_PASSWORD"])
              smtp.send_message(msg)
          PY
          fi
