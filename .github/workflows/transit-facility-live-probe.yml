name: Read-only transit and facility production diagnostic
on:
  push:
    branches: ['diagnostic/live-transit-facility-20261125']
    paths: ['.github/workflows/transit-facility-live-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Diagnose public timetable and bus history without secrets
        run: |
          node --input-type=module <<'JS'
          const root='https://dongjak-walk-safety-preview.pages.dev';
          async function get(path,params={}){
            try{
              const u=root+path+'?'+new URLSearchParams(params);
              const res=await fetch(u,{signal:AbortSignal.timeout(60000),cache:'no-store'});
              const j=await res.json().catch(()=>({}));
              console.log(JSON.stringify({path,params,http:res.status,status:j.status,code:j.code,notice:j.notice,items:j.items?.length,timetable:j.timetable?.length,arrivals:j.arrivals?.length,timetableKeyConfigured:j.timetableKeyConfigured}));
              return j;
            }catch(e){console.log(JSON.stringify({path,params,error:e.name}));return {};}
          }
          await get('/api/transport/status');
          await Promise.all([1,2,3].map(day=>get('/api/transport/service-hours',{kind:'subway',station:'상도',line:'7호선',day})));
          const r=await get('/api/transport/bus/route-path',{routeId:'100100112'});
          const s=r.stops?.find(s=>s.stationId&&s.name?.includes('상도'))||r.stops?.find(s=>s.stationId);
          if(s)await Promise.all(['20261015','20261118'].map(date=>get('/api/transport/bus-history',{routeId:'100100112',stationId:s.stationId,seq:s.seq,date})));
          const path='/apig/apiman-gateway/tapi/BisTbisClCaralcSttn/1.0';
          for(const protocol of ['https','http']){
            try{
              const u=protocol+'://t-data.seoul.go.kr'+path+'?startRow=1&rowCnt=10&stdrDe=20261015&routeId=100100112';
              const res=await fetch(u,{redirect:'manual',signal:AbortSignal.timeout(15000)});
              const loc=res.headers.get('location');
              let msg='';try{msg=(await res.text()).slice(0,350)}catch{}
              console.log(JSON.stringify({protocol,status:res.status,redirect:loc?new URL(loc,u).origin+new URL(loc,u).pathname:null,response:msg}));
            }catch(e){console.log(JSON.stringify({protocol,error:e.name,cause:e.cause?.code}));}
          }
          JS
