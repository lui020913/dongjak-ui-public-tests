name: Read-only transit and facility production diagnostic
on:
  push:
    branches: ['diagnostic/live-transit-facility-20261125']
    paths: ['.github/workflows/transit-facility-live-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check public response codes and coverage without credentials
        run: |
          node --input-type=module <<'JS'
          const root='https://dongjak-walk-safety-preview.pages.dev';
          async function get(path){
            try{
              const res=await fetch(root+path,{signal:AbortSignal.timeout(15000),cache:'no-store'});
              let j={};try{j=await res.json()}catch{}
              return {http:res.status,j};
            }catch(e){return {http:null,j:{code:e.name}}}
          }
          const log=(label,result,details)=>console.log(JSON.stringify({label,http:result.http,code:result.j.code??null,...details}));
          const status=await get('/api/transport/status');
          log('transport status',status,{bus:status.j.bus,subway:status.j.subway});
          const stations=[['노량진','1'],['대방','1'],['신림','2'],['신림','신림선'],['보라매','신림선']];
          for(const [name,line] of stations){
            for(const bulk of [false,true]){
              const p=new URLSearchParams({station:name,line,...(bulk?{mode:'bulk'}:{})});
              const r=await get('/api/transport/subway?'+p);
              log(name+' '+line+' '+(bulk?'bulk':'station'),r,{items:r.j.items?.length,sourceStatus:r.j.sourceStatus,sourceMode:r.j.sourceMode,sourceAgeSeconds:r.j.sourceAgeSeconds});
            }
          }
          const route=await get('/api/transport/bus/routes?arsId=20160');
          log('bus route discovery',route,{routes:route.j.routes?.length});
          const routeId=route.j.routes?.map(x=>String(x.routeId??x.busRouteId??'')).find(x=>/^\d{5,15}$/.test(x));
          const bus=await get('/api/transport/live-vehicles?'+new URLSearchParams({modes:'bus',...(routeId?{routeId}:{})}));
          log('bus location',bus,{routeSelected:!!routeId,vehicles:bus.j.bus?.length,availability:bus.j.availability,warnings:bus.j.warnings});
          const categories=['약국','동물약국','편의점','음식점','휴게음식점','카페'];
          for(const category of categories){
            const r=await get('/api/seoul-facilities?'+new URLSearchParams({category,limit:'2000'}));
            log('facility '+category,r,{rows:r.j.places?.length,more:r.j.hasMore,sync:r.j.sync?.map(s=>({source:s.source_id,stored:s.row_count,received:s.received_count,status:s.status,lastSuccess:s.last_success}))});
          }
          console.log('Empty data during overnight closure does not establish daytime feed failure. This is a read-only probe, not a deployment.');
          JS
