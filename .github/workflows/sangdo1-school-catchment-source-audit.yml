name: Research – Import official 2026 school catchment polygons
on:
  pull_request:
    paths:
      - '.github/workflows/sangdo1-school-catchment-source-audit.yml'
      - 'scripts/research/sangdo1_school_catchment_source_audit.py'
      - 'scripts/research/sangdo1_official_school_catchment_overlay.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research-only-import:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/sangdo1-protection-coverage-20261121'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned geospatial libraries
        run: python -m pip install --disable-pip-version-check --quiet pyshp==2.3.1 pyproj==3.7.2 shapely==2.1.2
      - name: Download exact official ZIP from schoolzone.emac.kr
        run: python scripts/research/sangdo1_school_catchment_source_audit.py
      - name: Validate official SHP and intersect 1686 road segments
        run: python scripts/research/sangdo1_official_school_catchment_overlay.py
      - name: Upload verified research outputs for audit
        uses: actions/upload-artifact@v4
        with:
          name: sangdo1-official-catchment-20260920
          path: |
            app/public/data/protection-zone/sangdo1_school_catchment_polygons_20260920.geojson
            app/public/data/protection-zone/sangdo1_road_catchment_overlay_20260920.csv
            app/public/data/protection-zone/sangdo1_road_catchment_overlay_20260920.json
            app/public/data/protection-zone/sangdo1_school_catchment_analysis_20260920_summary.json
          retention-days: 7
          if-no-files-found: error
      - name: Commit only validated research data to draft PR branch
        if: github.event_name == 'pull_request'
        env:
          BRANCH: research/sangdo1-protection-coverage-20261121
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          if [ "$(git rev-parse "origin/$BRANCH")" != "$(git rev-parse HEAD)" ]; then
            echo "Branch advanced during spatial analysis; refuse stale automatic push"
            exit 1
          fi
          git config user.name "research-ci[bot]"
          git config user.email "research-ci[bot]@users.noreply.github.com"
          git add app/public/data/protection-zone/sangdo1_school_catchment_polygons_20260920.geojson
          git add app/public/data/protection-zone/sangdo1_road_catchment_overlay_20260920.csv
          git add app/public/data/protection-zone/sangdo1_road_catchment_overlay_20260920.json
          git add app/public/data/protection-zone/sangdo1_school_catchment_analysis_20260920_summary.json
          if git diff --cached --quiet; then
            echo "Official 2026 study outputs already current"
          else
            git commit -m "research: import 2026 official school catchments and road intersections"
            git push origin "HEAD:$BRANCH"
          fi
