name: Research – Diagnose 2026 school catchment download
on:
  pull_request:
    paths:
      - '.github/workflows/sangdo1-school-catchment-source-audit.yml'
      - 'scripts/research/sangdo1_school_catchment_source_audit.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Test official public metadata and discover file link (read-only)
        run: python3 scripts/research/sangdo1_school_catchment_source_audit.py
