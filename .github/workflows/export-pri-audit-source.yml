name: Export public Sangdo1 PRI audit source
on:
  push:
    branches: [main]
    paths: ['reports/pri-audit-export-request.json']
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require approved public research source files
        run: |
          set -euo pipefail
          test -s app/public/data/pri/lighting_segments.json
          test -s app/public/data/pri/sangdo1_accidents_factor.json
          test -s app/public/data/pri/sangdo1_protection_gap_2factor_adminscope_factor.json
          test -s app/public/data/pri/sangdo1_crosswalk_rubric_factor.json
          test -s app/public/data/pri/sangdo1_shared_road_rubric_factor.json
          test -s app/public/data/road-speed/sangdo1_speed_links.geojson
          test -s app/public/data/pri/manifest.json
      - name: Archive exact tracked, already-public PRI data for detailed PDF audit
        uses: actions/upload-artifact@v4
        with:
          name: sangdo1-pri-audit-source-${{ github.sha }}
          path: |
            app/public/data/pri/lighting_segments.json
            app/public/data/pri/sangdo1_accidents_factor.json
            app/public/data/pri/sangdo1_protection_gap_2factor_adminscope_factor.json
            app/public/data/pri/sangdo1_crosswalk_rubric_factor.json
            app/public/data/pri/sangdo1_shared_road_rubric_factor.json
            app/public/data/pri/manifest.json
            app/public/data/road-speed/sangdo1_speed_links.geojson
          if-no-files-found: error
          retention-days: 3
