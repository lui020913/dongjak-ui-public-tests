name: Recovery smoke controller
on:
  workflow_run:
    workflows: ["Recovery smoke test"]
    types: [completed]
permissions:
  actions: write
  issues: write
jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.actor.login == 'lui020913' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - run: |
          gh issue comment 15 --repo "$GITHUB_REPOSITORY" --body "@lui020913 복구 테스트 · 의도적 실패 감지"
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/rerun"
