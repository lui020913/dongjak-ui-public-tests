name: Public app source CI
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/mobile-first-layout-contract.test.mjs'
      - 'playwright.mobile-first.config.mjs'
      - '.github/workflows/public-app-pr.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-app-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  app-build-and-tests:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore public app dependency downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm/_cacache
          key: ${{ runner.os }}-${{ runner.arch }}-app-npm-v1-${{ hashFiles('app/package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-app-npm-v1-
      - name: Install app dependencies
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Restore versioned security scanner archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gitleaks.tgz
          key: ${{ runner.os }}-${{ runner.arch }}-gitleaks-v8.24.2-archive-v1
      - name: Scan app source for accidentally committed secrets
        working-directory: .
        run: |
          set -euo pipefail
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.24.2
          archive=gitleaks_8.24.2_linux_x64.tar.gz
          curl -fsSL "$base/gitleaks_8.24.2_checksums.txt" -o "$RUNNER_TEMP/gitleaks-checksums.txt"
          expected="$(awk -v name="$archive" '$2==name || $2=="*"name {print $1}' "$RUNNER_TEMP/gitleaks-checksums.txt")"
          [[ "$expected" =~ ^[a-f0-9]{64}$ ]]
          if ! printf '%s  %s\n' "$expected" "$RUNNER_TEMP/gitleaks.tgz" | sha256sum --check --status; then
            curl -fsSL "$base/$archive" -o "$RUNNER_TEMP/gitleaks.tgz"
          fi
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/gitleaks.tgz" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" detect --source app --config app/.gitleaks.toml --no-git --redact --exit-code 23
      - name: Run full application regression suite
        run: npm test
      - name: Verify release metadata consistency
        run: npm run check:release
      - name: Build the exact public app source
        run: npm run build
      - name: Verify generated app entrypoint
        run: test -s dist/index.html
      - name: Restore pinned browser test package downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dongjak-browser-npm/_cacache
          key: ${{ runner.os }}-${{ runner.arch }}-browser-npm-v1-${{ hashFiles('package.json') }}
      - name: Install pinned root Playwright test dependencies
        working-directory: .
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          NPM_CONFIG_CACHE: ${{ runner.temp }}/dongjak-browser-npm
        run: npm install --no-audit --no-fund --prefer-offline
      - name: Verify preinstalled Chromium matches pinned Playwright
        working-directory: .
        run: node --input-type=module -e 'import {chromium} from "@playwright/test"; import {existsSync} from "node:fs"; if(!existsSync(chromium.executablePath())) throw new Error("Pinned Playwright Chromium is missing from the runner image")'
      - name: Verify the phone-only layout at three viewport sizes
        working-directory: .
        run: npx playwright test --config=playwright.mobile-first.config.mjs --project=mobile375 --project=mobile390 --project=mobile430
      - name: Upload viewport screenshots and measured layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-first-layout-${{ github.run_id }}
          path: |
            playwright-report-mobile-first/
            test-results-mobile-first/
          if-no-files-found: ignore
          retention-days: 14
      - name: Summarize exact source
        working-directory: .
        run: |
          {
            echo "### Public app source CI"
            echo "- Source commit: `$GITHUB_SHA`"
            echo "- App version: `$(node -p "require('./app/package.json').version")`"
            echo "- App files: `$(find app -type f | wc -l)`"
            echo "- Secret scan: passed"
            echo "- Unit tests and production build: passed"
          } >> "$GITHUB_STEP_SUMMARY"
