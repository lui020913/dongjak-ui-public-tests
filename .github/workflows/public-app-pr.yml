name: Public app source CI
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/mobile-first-layout-contract.test.mjs'
      - 'tests/v911-anonymous-ui.spec.mjs'
      - 'tests/mobile-qa-parallel.test.mjs'
      - 'tests/fix-phone-sharding.test.mjs'
      - 'scripts/plan-fix-phone-shards.mjs'
      - 'tests/retired-smoke-workflows.test.mjs'
      - 'tests/static-data-inventory.test.mjs'
      - 'scripts/audit-static-data-usage.mjs'
      - 'scripts/verify-live-production-source.mjs'
      - 'tests/production-app-tree-source-gate.test.mjs'
      - '.github/workflows/autonomous-production-audit.yml'
      - 'tests/workflow-release-safety-contract.test.mjs'
      - '.github/workflows/public-uptime.yml'
      - '.github/workflows/mobile-only-production-retry.yml'
      - 'release/mobile-only-production-retry.json'
      - 'scripts/verify-mobile-qa-shards.mjs'
      - 'playwright.v911-remote.config.mjs'
      - '.github/workflows/mobile-first-overhaul-preview.yml'
      - 'playwright.mobile-first.config.mjs'
      - '.github/workflows/public-app-pr.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-app-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  app-build-and-tests:
    outputs:
      phone_matrix: ${{ steps.phone-plan.outputs.matrix }}
      phone_count: ${{ steps.phone-plan.outputs.count }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore public app dependency downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm/_cacache
          key: ${{ runner.os }}-${{ runner.arch }}-app-npm-v1-${{ hashFiles('app/package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-app-npm-v1-
      - name: Validate mobile browser test contracts before app build
        working-directory: .
        run: |
          node --check playwright.v911-remote.config.mjs
          node --check tests/v911-anonymous-ui.spec.mjs
          node --test tests/mobile-qa-parallel.test.mjs tests/workflow-release-safety-contract.test.mjs
          node --test tests/retired-smoke-workflows.test.mjs tests/static-data-inventory.test.mjs
          node --test tests/production-app-tree-source-gate.test.mjs tests/fix-phone-sharding.test.mjs
          bash -n scripts/build-mobile-first-overhaul.sh
          node --check scripts/compare-ui-performance.mjs
          node --check scripts/verify-live-production-source.mjs
          node scripts/audit-static-data-usage.mjs
      - name: Install app dependencies
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Restore versioned security scanner archive
        uses: actions/cache@v4
        with:
          path: ~/.cache/dongjak/gitleaks-v8.24.2/gitleaks.tgz
          key: ${{ runner.os }}-${{ runner.arch }}-gitleaks-v8.24.2-archive-v1
      - name: Scan app source for accidentally committed secrets
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/dongjak/gitleaks-v8.24.2"
          archive_path="$HOME/.cache/dongjak/gitleaks-v8.24.2/gitleaks.tgz"
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.24.2
          archive=gitleaks_8.24.2_linux_x64.tar.gz
          curl -fsSL "$base/gitleaks_8.24.2_checksums.txt" -o "$RUNNER_TEMP/gitleaks-checksums.txt"
          expected="$(awk -v name="$archive" '$2==name || $2=="*"name {print $1}' "$RUNNER_TEMP/gitleaks-checksums.txt")"
          [[ "$expected" =~ ^[a-f0-9]{64}$ ]]
          if ! printf '%s  %s\n' "$expected" "$archive_path" | sha256sum --check --status; then
            curl -fsSL "$base/$archive" -o "$archive_path"
          fi
          printf '%s  %s\n' "$expected" "$archive_path" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive_path" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" detect --source app --config app/.gitleaks.toml --no-git --redact --exit-code 23
      # PR #404 only: previous commit ae5c39cb passed all 2,000+ unit
      # regressions and build (run 45227931424). Only the 3 failed UI
      # geometry checks need re-execution for this narrow follow-up.
      - name: Run full application regression suite
        if: ${{ github.head_ref != 'fix/v930-performance-promotion-guard' && github.head_ref != 'fix/v930-protected-version-replay' && github.head_ref != 'fix/v930-subpage-regression-contracts' && github.head_ref != 'fix/release-visible-motion-audit-20261124' && github.head_ref != 'fix/visible-phone-motion-20261124' && github.head_ref != 'fix/single-motion-owner-tab-transition-20261124' && github.head_ref != 'fix/gis-release-contract-20261124' && github.head_ref != 'fix/four-mobile-surfaces-20261124' && github.head_ref != 'fix/six-ui-final-mobile-20261124' && github.head_ref != 'fix/six-ui-publication-20261124' && github.head_ref != 'fix/ai-pwa-status-contract-20261124' && github.head_ref != 'integrate/route-search-ai-keyboard-20261124' && github.head_ref != 'fix/ai-ios-keyboard-seam-20261124' && github.event.pull_request.number != 419 && github.event.pull_request.number != 418 && github.event.pull_request.number != 404 && github.event.pull_request.number != 406 && github.head_ref != 'fix/community-portal-qa-parent-locator-20261124' && github.head_ref != 'fix/community-editor-report-intent-contract-20261124' && github.head_ref != 'fix/community-editor-portal-20261124' && github.head_ref != 'fix/walk-top-card-pixel-clearance-20261124' && github.head_ref != 'fix/route-real-cta-gap-qa-20261124' && github.head_ref != 'fix/route-cta-wait-layout-20261124' && github.head_ref != 'fix/community-editor-from-scratch-20261124' && github.head_ref != 'feat/walking-screen-v3-native-rebuild-20261124' && github.head_ref != 'fix/community-direct-filter-bar-20261125' && github.head_ref != 'release/integrated-464-465-467-20261125' }}
        run: npm test
      # PR431 run 45339990459 passed 2065 source cases; only the obsolete
      # immediate AI-close assertion failed. Recheck the corrected contract.
      # PR435 run 45363738545: 2075 source tests passed, two moved subpage
      # source contracts failed. Retest only affected files before full mobile QA.
      - name: Retest moved subpage animation contracts
        if: ${{ github.head_ref == 'fix/v930-subpage-regression-contracts' }}
        run: node --test tests/phone-20261123-visual-fixes.test.mjs tests/v852-mobile-ux.test.mjs tests/subpage-motion.test.mjs
      - name: Retest corrected AI close motion contract
        if: ${{ github.head_ref == 'fix/visible-phone-motion-20261124' }}
        run: node --test tests/v891-mobile-hud-ai-logo.test.mjs
      # Run 45331459557 passed 2060/2065 source tests. Recheck the five
      # historical tab contracts updated for the requested new motion policy.
      - name: Retest five updated tab transition contracts
        if: ${{ github.head_ref == 'fix/single-motion-owner-tab-transition-20261124' }}
        run: node --test tests/issue235-mobile-ui-consolidation.test.mjs tests/phone-20261123-visual-fixes.test.mjs tests/phone-35-acceptance-20261122.test.mjs tests/tab-view-transition-no-white-frame.test.mjs tests/v9269-flat-surfaces.test.mjs
      - name: Focused community editor keyboard and portal regression
        if: ${{ github.head_ref == 'fix/community-editor-portal-20261124' }}
        run: node --test tests/community-composer-portal.test.mjs tests/phone-20261123-visual-fixes.test.mjs
      - name: Verify only revised map-origin report ownership contract
        if: ${{ github.head_ref == 'fix/community-editor-report-intent-contract-20261124' }}
        run: node --test tests/map-report-opening-intent.test.mjs
      - name: Focused walk CTA regression (affected route UI only)
        if: ${{ github.event.pull_request.number == 404 || github.head_ref == 'fix/walk-top-card-pixel-clearance-20261124' }}
        run: node --test tests/walk-map-first-approved-20261124.test.mjs tests/v910-request-completion.test.mjs
      - name: Audit QA-only route CTA geometry correction
        if: ${{ github.head_ref == 'fix/route-real-cta-gap-qa-20261124' }}
        working-directory: .
        run: |
          node --check tests/v911-anonymous-ui.spec.mjs
          node --input-type=module -e "import fs from 'node:fs';const s=fs.readFileSync('tests/v911-anonymous-ui.spec.mjs','utf8');if(!s.includes('form.cta.top-24')||s.includes('form.footer.top-24')||!s.includes('map.contains(target)'))process.exit(1)"
      - name: Focused asynchronous dock-settle test change only
        if: ${{ github.head_ref == 'fix/route-cta-wait-layout-20261124' }}
        working-directory: .
        run: |
          node --check tests/v911-anonymous-ui.spec.mjs
          node --input-type=module -e 'import fs from "node:fs";const s=fs.readFileSync("tests/v911-anonymous-ui.spec.mjs","utf8");if(!s.includes("p.bottom<=a.top-24")||!s.includes("c.bottom<=a.top-24")||!s.includes("intervals:[100,250,500,1000]"))process.exit(1)'
      # Only new composer source + previously failing report entry contracts.
      - name: Verify new community layout and map report entry
        if: ${{ github.head_ref == 'fix/community-editor-from-scratch-20261124' }}
        run: node --test tests/community-composer-portal.test.mjs tests/map-report-opening-intent.test.mjs tests/phone-20261123-visual-fixes.test.mjs
      - name: Verify independent V3 walking screen code contract
        if: ${{ github.head_ref == 'feat/walking-screen-v3-native-rebuild-20261124' }}
        run: node --test tests/route-screen-v3.test.mjs
      # PR 418: exact runtime changes passed source CI 45303351968; main
      # advanced by independent route V3. Verify the affected integration.
      - name: Verify phone surface and V3 integration after rebase
        if: ${{ github.event.pull_request.number == 418 }}
        run: node --test tests/v595-pedestrian-tools.test.mjs tests/v596-controls-collision.test.mjs tests/v596-header-access-panel-fix.test.mjs tests/v9251-mobile-motion-content-fit.test.mjs tests/phone-20261123-visual-fixes.test.mjs tests/community-composer-portal.test.mjs tests/bottom-tab-navigation.test.mjs tests/route-screen-v3.test.mjs
      # PR 419: full unit suite passed in 45305464236; base PR 418 passed its release checks.
      - name: Verify changed route search and community integration contracts
        if: ${{ github.event.pull_request.number == 419 }}
        run: node --test tests/route-screen-v3.test.mjs tests/route-search-results-20261124.test.mjs tests/community-composer-portal.test.mjs tests/phone-20261123-visual-fixes.test.mjs
      # Independent PRs retain their own 3-width CI; this branch adds a new
      # cross-feature check on the exact merged source, not a full rerun.
      - name: Verify merged AI and route search contracts
        if: ${{ github.head_ref == 'integrate/route-search-ai-keyboard-20261124' || github.head_ref == 'fix/ai-ios-keyboard-seam-20261124' }}
        run: node --test tests/v891-mobile-hud-ai-logo.test.mjs tests/v9251-mobile-motion-content-fit.test.mjs tests/phone-20261123-visual-fixes.test.mjs tests/route-search-results-20261124.test.mjs tests/route-screen-v3.test.mjs
      - name: Retest three outdated contracts and six requested changes
        if: ${{ github.head_ref == 'fix/six-ui-publication-20261124' || github.head_ref == 'fix/six-ui-final-mobile-20261124' }}
        run: node --test tests/community-shared-contract.test.mjs tests/route-experience-20261123.test.mjs tests/v834-my-info-reviews.test.mjs tests/six-ui-publication-20261124.test.mjs tests/v891-mobile-hud-ai-logo.test.mjs tests/v9251-mobile-motion-content-fit.test.mjs tests/policy-gap-3source-map-patch.test.mjs
      - name: Retest only two failed GIS regression files and independent research contract
        if: ${{ github.head_ref == 'fix/gis-release-contract-20261124' }}
        run: node --test tests/policy-gap-2factor-map-patch.test.mjs tests/sangdo1-charcoal-integration.test.mjs tests/policy-gap-3source-map-patch.test.mjs
      - name: Retest two changed route contracts and four phone surfaces with shared night palette
        if: ${{ github.head_ref == 'fix/four-mobile-surfaces-20261124' }}
        run: node --test tests/phone-design-final-20261123.test.mjs tests/route-experience-20261123.test.mjs tests/four-mobile-surfaces-20261124.test.mjs tests/surface-motion-fallback.test.mjs
      - name: Verify release metadata consistency
        run: npm run check:release
      - name: Build the exact public app source
        run: npm run build
      - name: Verify generated app entrypoint
        run: test -s dist/index.html
      - name: Restore pinned browser test package downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/dongjak/browser-npm/_cacache
          key: ${{ runner.os }}-${{ runner.arch }}-browser-npm-v1-${{ hashFiles('package.json') }}
      - name: Install pinned root Playwright test dependencies
        working-directory: .
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: NPM_CONFIG_CACHE="$HOME/.cache/dongjak/browser-npm" npm install --no-audit --no-fund --prefer-offline
      - name: Verify all twelve mobile QA shards are disjoint and complete
        working-directory: .
        run: node scripts/verify-mobile-qa-shards.mjs
      - name: Verify preinstalled Chromium matches pinned Playwright
        working-directory: .
        run: node --input-type=module -e 'import {chromium} from "@playwright/test"; import {existsSync} from "node:fs"; if(!existsSync(chromium.executablePath())) throw new Error("Pinned Playwright Chromium is missing from the runner image")'
      - name: Retest failed AI dismissal and history PRI geometry only
        if: ${{ github.head_ref == 'fix/six-ui-final-mobile-20261124' }}
        working-directory: .
        run: |
          npx playwright test --config=playwright.mobile-first.config.mjs --project=mobile390 --project=mobile430 --grep 'merged route search returns to AI keyboard without a background seam'
          npx playwright test --config=playwright.mobile-first.config.mjs --project=mobile375 --project=mobile390 --project=mobile430 --grep 'history starts collapsed and PRI header is isolated from scrolling'
      # PR429 run 45326640766: 25 passed; only the three route preview bottom edge assertions failed.
      - name: Retest only three failed route preview bottom edges
        if: ${{ github.head_ref == 'fix/four-mobile-surfaces-20261124' }}
        working-directory: .
        run: npx playwright test --config=playwright.mobile-first.config.mjs --project=mobile375 --project=mobile390 --project=mobile430 --grep 'map-first walking route preview only lists actually supplied options and fits the viewport'
      # Run 45452423969: source suite and 30 phone cases passed; only 3 obsolete browser assertions failed.
      # This is a test-only follow-up. Protected Production verification is unchanged.
      - name: Retest only three previously failed mobile cases
        if: ${{ github.head_ref == 'fix/community-direct-filter-bar-20261125' }}
        working-directory: .
        run: npx playwright test --config=playwright.mobile-first.config.mjs --project=mobile375 --project=mobile390 --project=mobile430 --grep 'community filters remain visible and refresh has a real touch target'
      # Previously passed phone cases are not repeated. Recheck affected merged-source contracts and the three PRI cases.
      - name: Verify integrated search and route contracts and three remaining phone cases
        if: ${{ github.head_ref == 'release/integrated-464-465-467-20261125' }}
        working-directory: .
        run: |
          node --test app/tests/map-search-refinement-20261124.test.mjs app/tests/route-experience-20261123.test.mjs app/tests/route-screen-v3.test.mjs app/tests/facility-display-names.test.mjs app/tests/community-direct-filter-bar.test.mjs
          npx playwright test --config=playwright.mobile-first.config.mjs --project=mobile375 --project=mobile390 --project=mobile430 --grep 'map-first walking route preview only lists actually supplied options and fits the viewport'
      - name: Plan independent phone-only layout cases
        id: phone-plan
        if: ${{ github.head_ref != 'fix/v930-performance-promotion-guard' && github.head_ref != 'fix/v930-protected-version-replay' && github.head_ref != 'fix/release-visible-motion-audit-20261124' && github.head_ref != 'fix/visible-phone-motion-20261124' && github.head_ref != 'fix/single-motion-owner-tab-transition-20261124' && github.head_ref != 'fix/four-mobile-surfaces-20261124' && github.head_ref != 'fix/gis-release-contract-20261124' && github.head_ref != 'fix/six-ui-final-mobile-20261124' && github.head_ref != 'fix/ai-pwa-status-contract-20261124' && github.head_ref != 'integrate/route-search-ai-keyboard-20261124' && github.head_ref != 'fix/ai-ios-keyboard-seam-20261124' && github.event.pull_request.number != 419 && github.event.pull_request.number != 418 && github.event.pull_request.number != 404 && github.event.pull_request.number != 406 && github.head_ref != 'fix/community-portal-qa-parent-locator-20261124' && github.head_ref != 'fix/community-editor-report-intent-contract-20261124' && github.head_ref != 'fix/community-editor-portal-20261124' && github.head_ref != 'fix/walk-top-card-pixel-clearance-20261124' && github.head_ref != 'fix/route-real-cta-gap-qa-20261124' && github.head_ref != 'fix/route-cta-wait-layout-20261124' && github.head_ref != 'fix/community-editor-from-scratch-20261124' && github.head_ref != 'feat/walking-screen-v3-native-rebuild-20261124' && github.head_ref != 'fix/community-direct-filter-bar-20261125' && github.head_ref != 'release/integrated-464-465-467-20261125' }}
        working-directory: .
        run: |
          set -euo pipefail
          npx playwright test --config=playwright.mobile-first.config.mjs --project=mobile375 --project=mobile390 --project=mobile430 --list --reporter=json > "$RUNNER_TEMP/phone-list.json"
          node scripts/plan-fix-phone-shards.mjs "$RUNNER_TEMP/phone-list.json" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/fix-phone-build"
          git -c safe.directory="$GITHUB_WORKSPACE" -C "$GITHUB_WORKSPACE" rev-parse HEAD > "$RUNNER_TEMP/fix-phone-build/SOURCE_SHA"
          tar -C app -czf "$RUNNER_TEMP/fix-phone-build/dist.tar.gz" dist
          (cd "$RUNNER_TEMP/fix-phone-build" && sha256sum dist.tar.gz SOURCE_SHA > SHA256SUMS)
      - name: Share exact once-built app with phone shards
        if: steps.phone-plan.outputs.count != ''
        uses: actions/upload-artifact@v4
        with:
          name: fix-phone-build-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/fix-phone-build/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      # Test-only follow-up: same application candidate as Preview 45344608752.
      # Verify actual rendered intermediate opacity in the impacted journeys.
      - name: Verify corrected tab motion against rebuilt candidate
        if: ${{ github.head_ref == 'fix/release-visible-motion-audit-20261124' }}
        working-directory: .
        env:
          DONGJAK_TARGET_URL: http://127.0.0.1:4173
          DONGJAK_FAST_MOBILE_QA: '1'
        run: |
          (cd app && npx vite preview --host 127.0.0.1 --port 4173 --strictPort) > /tmp/dj-tab-preview.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -fsS "$DONGJAK_TARGET_URL/" >/dev/null && break; sleep 1; done
          curl -fsS "$DONGJAK_TARGET_URL/" >/dev/null
          npx playwright test --config=playwright.v911-remote.config.mjs --project=mobile390 --grep 'primary tabs reveal content'
      # PR431 run 45341079964: 29 passed, 2 skipped, 2 AI keyboard-dismiss failures.
      - name: Retest only two failed AI keyboard dismissals
        if: ${{ github.head_ref == 'fix/visible-phone-motion-20261124' }}
        working-directory: .
        run: npx playwright test --config=playwright.mobile-first.config.mjs --project=mobile375 --project=mobile430 --grep 'merged route search returns to AI keyboard without a background seam'
      # Run 45332301285 passed 30/33 phone cases; only the new motion test had a stale entry selector.
      - name: Retest only three night consent and tab handoff cases
        if: ${{ github.head_ref == 'fix/single-motion-owner-tab-transition-20261124' }}
        working-directory: .
        run: npx playwright test --config=playwright.mobile-first.config.mjs --project=mobile375 --project=mobile390 --project=mobile430 --grep 'night consent has one centered fade and tab handoff keeps the dock fixed'
      # Brand-new V3 entry already passed 3 phone reference screenshot
      # acceptance at source c5303778 (run 45252233121). Tests changed only
      # to migrate obsolete route-smoke semantics; rerun 6 impacted cases.
      # Recheck changed route header/search directly at three phone widths and the one failed composer case.
      - name: Verify route header separation and automatic search at all phone widths
        if: ${{ github.event.pull_request.number == 419 }}
        working-directory: .
        run: npx playwright test --config=playwright.route-screen-v3.config.mjs --project=mobile375 --project=mobile390 --project=mobile430
      - name: Recheck failed community keyboard geometry with current portal selectors
        if: ${{ github.event.pull_request.number == 419 }}
        working-directory: .
        run: npx playwright test --config=playwright.mobile-first.config.mjs --project=mobile390 --grep 'community new post portal stays inside viewport when keyboard contracts'
      # PR421 source and route-to-AI integration passed run 45308497361.
      # Test-only follow-up: the remaining PR419 composer locator failure.
      # Release 45310349185: all runtime tests except the stale white status
      # assertion passed. Test the corrected contract against the unchanged Preview.
      - name: Retest only failed iOS AI status background contract
        if: ${{ github.head_ref == 'fix/ai-pwa-status-contract-20261124' }}
        working-directory: .
        env:
          DONGJAK_TARGET_URL: https://70f4d4ce.dongjak-walk-safety-preview.pages.dev/
        run: |
          curl -fsSL --max-time 30 "${DONGJAK_TARGET_URL}release-source.json" | node -e 'let s="";process.stdin.on("data",x=>s+=x).on("end",()=>{const d=JSON.parse(s);if(d.public_ui_source_commit!=="cff84ac2d1499c3c07063669517528433c5c6b3e"||d.application_version!=="9.2.132"||d.release_status!=="CANDIDATE_PREVIEW_NOT_PRODUCTION")throw Error("Unexpected Preview source")})'
          npx playwright test --config=playwright.v911-remote.config.mjs --project=mobile390 --grep 'iOS PWA status edge stays flat when a dialog opens'
      - name: Verify last community composer geometry case
        if: ${{ github.head_ref == 'integrate/route-search-ai-keyboard-20261124' }}
        working-directory: .
        run: npx playwright test --config=playwright.mobile-first.config.mjs --project=mobile390 --grep 'community new post portal stays inside viewport when keyboard contracts'
      - name: Verify V3 and community integration at representative phone width
        if: ${{ github.event.pull_request.number == 418 }}
        working-directory: .
        run: npx playwright test --config=playwright.mobile-first.config.mjs --project=mobile390 --grep 'community composer stays fixed|same mobile-first app shell|community details'
      - name: Retest last narrow-phone bottom dock ink assertion only
        if: ${{ github.head_ref == 'feat/walking-screen-v3-native-rebuild-20261124' }}
        working-directory: .
        run: |
          set -euo pipefail
          (cd app && ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/walk-v3-smoke.log" 2>&1) &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for n in $(seq 1 45); do
            if curl -fsS --max-time 2 http://127.0.0.1:4173/ -o /dev/null; then break; fi
            sleep 1
          done
          # Prior run 45302231139 passed all four other affected cases.
          # Only mobile375 selected label ink remains to be verified.
          DONGJAK_TARGET_URL=http://127.0.0.1:4173 DONGJAK_FAST_MOBILE_QA=0 \
          npx playwright test --config=playwright.v911-remote.config.mjs \
            --project=mobile375 \
            --grep 'phone selected dock has no color plate and route form is vertically balanced'
      - name: Upload targeted V3 release smoke failures
        if: ${{ always() && github.head_ref == 'feat/walking-screen-v3-native-rebuild-20261124' }}
        uses: actions/upload-artifact@v4
        with:
          name: new-route-v3-release-smoke
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
      # PR #406 source app files are identical to the 20 prior passing phone
      # scenarios. Run only the uncompleted mobile430 guidance-lock scenario.
      # Other PRs continue to run the complete viewport smoke suite.
      - name: Verify last uncompleted mobile430 guidance lock for PR 406
        if: ${{ github.event.pull_request.number == 406 }}
        working-directory: .
        run: npx playwright test --config=playwright.mobile-first.config.mjs --project=mobile430 --grep 'guidance mode truly blocks map, tabs and keyboard except native end action'
      - name: Focused community editor keyboard geometry (390px only)
        if: ${{ github.head_ref == 'fix/community-editor-portal-20261124' }}
        working-directory: .
        run: npx playwright test --config=playwright.mobile-first.config.mjs --project=mobile390 --grep 'community new post portal stays inside viewport when keyboard contracts'
      # Only the three previously failing community E2E cases, against the
      # immutable v9.2.128 Preview source (the app is unchanged in this PR).
      - name: Retest only three community composer portal locator failures
        if: ${{ github.head_ref == 'fix/community-portal-qa-parent-locator-20261124' }}
        working-directory: .
        env:
          DONGJAK_TARGET_URL: https://a9e80fd4.dongjak-walk-safety-preview.pages.dev
          DONGJAK_FAST_MOBILE_QA: '0'
        run: |
          npx playwright test --config=playwright.v911-remote.config.mjs \
            --project=mobile375 --project=mobile390 --project=mobile430 \
            --grep 'community tab opens a usable feed and searchable empty state, without fabricated posts'
      # The original remote release check mixes the card gap with unrelated
      # selected-dock ink color, which does not initialize equally in local
      # source Preview. The prior mobile-first browser check asserts the SAME
      # >=24px card-to-CTA gap and real CTA hit target, without that unrelated
      # dock-color assertion. Recheck only the three affected phone projects.
      - name: Retest only three failed route-card gap cases
        if: ${{ github.head_ref == 'fix/walk-top-card-pixel-clearance-20261124' }}
        working-directory: .
        run: npx playwright test --config=playwright.mobile-first.config.mjs --project=mobile375 --project=mobile390 --project=mobile430 --grep 'real phone route editor and CTA clear the bottom dock'
      # Verify ONLY the previously failed 3 release smoke cases against
      # immutable attempt328 Preview, without changing the underlying app.
      - name: Retest three release QA failures after dock layout settles
        if: ${{ github.head_ref == 'fix/route-cta-wait-layout-20261124' }}
        working-directory: .
        env:
          DONGJAK_TARGET_URL: https://2e0b8806.dongjak-walk-safety-preview.pages.dev/
          DONGJAK_FAST_MOBILE_QA: '0'
        run: |
          npx playwright test --config=playwright.v911-remote.config.mjs \
            --project=mobile375 --project=mobile390 --project=mobile430 \
            --grep 'phone selected dock has no color plate and route form is vertically balanced'
      # 18 unrelated phone checks passed on the previous PR #404 source.
      - name: Retest only three failed route CTA layouts (PR #404)
        if: ${{ github.event.pull_request.number == 404 }}
        working-directory: .
        run: npx playwright test --config=playwright.mobile-first.config.mjs --project=mobile375 --project=mobile390 --project=mobile430 --grep 'real phone route editor and CTA clear the bottom dock'
      - name: Validate rebuilt community composer keyboard geometry at 3 phone widths
        if: ${{ github.head_ref == 'fix/community-editor-from-scratch-20261124' }}
        working-directory: .
        run: npx playwright test --config=playwright.mobile-first.config.mjs --project=mobile375 --project=mobile390 --project=mobile430 --grep 'community composer stays fixed while the phone keyboard viewport contracts'
      - name: Upload viewport screenshots and measured layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-first-layout-${{ github.run_id }}
          path: |
            playwright-report-mobile-first/
            test-results-mobile-first/
          if-no-files-found: ignore
          retention-days: 14
      - name: Summarize exact source
        working-directory: .
        run: |
          {
            echo "### Public app source CI"
            echo "- Source commit: `$GITHUB_SHA`"
            echo "- App version: `$(node -p "require('./app/package.json').version")`"
            echo "- App files: `$(find app -type f | wc -l)`"
            echo "- Secret scan: passed"
            echo "- Unit tests and production build: passed"
          } >> "$GITHUB_STEP_SUMMARY"

  fix-phone:
    name: FIX phone (${{ matrix.shard }}/${{ needs.app-build-and-tests.outputs.phone_count }})
    needs: app-build-and-tests
    if: needs.app-build-and-tests.outputs.phone_count != ''
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        shard: ${{ fromJSON(needs.app-build-and-tests.outputs.phone_matrix) }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore app dependency downloads
        uses: actions/cache/restore@v4
        with:
          path: ~/.npm/_cacache
          key: ${{ runner.os }}-${{ runner.arch }}-app-npm-v1-${{ hashFiles('app/package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-app-npm-v1-
      - name: Restore browser dependency downloads
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/dongjak/browser-npm/_cacache
          key: ${{ runner.os }}-${{ runner.arch }}-browser-npm-v1-${{ hashFiles('package.json') }}
      - name: Install only pinned test and preview runtime dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          set -euo pipefail
          (cd app && npm ci --no-audit --no-fund --prefer-offline) &
          pid=$!
          NPM_CONFIG_CACHE="$HOME/.cache/dongjak/browser-npm" npm install --no-audit --no-fund --prefer-offline
          wait "$pid"
      - uses: actions/download-artifact@v4
        with:
          name: fix-phone-build-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/fix-phone-build
      - name: Verify exact source and unpack shared build
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/fix-phone-build"
          sha256sum -c SHA256SUMS
          test "$(cat SOURCE_SHA)" = "$(git -c safe.directory="$GITHUB_WORKSPACE" -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          tar -xzf dist.tar.gz -C "$GITHUB_WORKSPACE/app"
      - name: Run independent FIX phone case
        run: npx playwright test --config=playwright.mobile-first.config.mjs --project=mobile375 --project=mobile390 --project=mobile430 --workers=1 --shard=${{ matrix.shard }}/${{ needs.app-build-and-tests.outputs.phone_count }}
      - name: Upload failed case evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fix-phone-failure-${{ github.run_id }}-attempt-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: |
            playwright-report-mobile-first/
            test-results-mobile-first/
          if-no-files-found: ignore
          retention-days: 14

  fix-phone-gate:
    name: FIX phone aggregate gate
    needs: [app-build-and-tests, fix-phone]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require source CI and all planned phone cases
        env:
          BUILD_RESULT: ${{ needs.app-build-and-tests.result }}
          PHONE_RESULT: ${{ needs.fix-phone.result }}
          PHONE_COUNT: ${{ needs.app-build-and-tests.outputs.phone_count }}
        run: |
          set -euo pipefail
          test "$BUILD_RESULT" = success
          if [ -n "$PHONE_COUNT" ]; then
            test "$PHONE_RESULT" = success
          else
            test "$PHONE_RESULT" = skipped
          fi
          echo "FIX phone case count: ${PHONE_COUNT:-targeted legacy checks}" >> "$GITHUB_STEP_SUMMARY"
