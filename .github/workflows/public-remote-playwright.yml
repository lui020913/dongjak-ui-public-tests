name: Public remote UI audit - no source or secrets
run-name: "Public UI source=${{ inputs.expected_source_sha || 'standalone' }}"

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Run only unresolved cases or full suite'
        type: choice
        options: [targeted, full]
        default: targeted
      expected_source_sha:
        description: 'Optional exact private Preview source SHA (40 hex, no secrets)'
        type: string
        required: false
        default: ''
      target_url:
        description: 'Public Cloudflare Pages URL on approved domain'
        type: string
        required: true
        default: 'https://v881-integrated-1116.dongjak-walk-safety-preview.pages.dev/'
  push:
    branches: [main]
    paths:
      - 'tests/remote-critical.spec.mjs'
  schedule:
    - cron: '30 18 * * *'

permissions:
  contents: read

concurrency:
  group: public-ui-audit-${{ github.event_name }}-${{ inputs.expected_source_sha || github.ref }}
  cancel-in-progress: true

jobs:
  chromium-remote-ui:
    name: Anonymous Cloudflare UI check
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      DONGJAK_TARGET_URL: ${{ inputs.target_url || vars.DONGJAK_TARGET_URL || 'https://v881-integrated-1116.dongjak-walk-safety-preview.pages.dev/' }}
      DONGJAK_EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax and approved target hostname
        run: |
          npm run check:syntax
          npm run check:target
          node --check scripts/verify-release-source.mjs
      - name: Check deployed Preview source fingerprint
        run: node scripts/verify-release-source.mjs
      - name: Install pinned Playwright dependency
        run: npm install --no-audit --no-fund
      - name: Install Chromium on standard GitHub runner
        run: npx playwright install --with-deps chromium
      - name: Check only unresolved cases (full only when explicitly requested)
        env:
          RUN_SCOPE: ${{ inputs.scope || 'targeted' }}
        shell: bash
        run: |
          if [ "$RUN_SCOPE" = full ]; then
            npm test
            exit $?
          fi
          mkdir -p playwright-json
          PLAYWRIGHT_JSON_OUTPUT_FILE=playwright-json/desktop-focus.json \
            npx playwright test tests/remote-critical.spec.mjs \
              --project=desktop --grep 'published map opens and renders' --reporter=list,json
      - name: Write run summary
        if: ${{ always() }}
        run: node scripts/summarize-results.mjs
      - name: Save anonymous-only UI report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: dongjak-public-ui-${{ github.run_number }}
          path: |
            playwright-report/
            playwright-json/
            test-results/
          if-no-files-found: warn
          retention-days: 2
