name: Dongjak selective road actual browser QA
on:
  pull_request:
    paths:
      - 'app/tests/road-selective-preview-browser.mjs'
      - '.github/workflows/dongjak-selective-road-browser.yml'
permissions:
  contents: read
  actions: read
jobs:
  browser:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'preview/road-surface-geometry-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: road-surface-visual-preview
          path: road-preview-dist
          run-id: 45778261534
          github-token: ${{ github.token }}
      - working-directory: app
        run: npm ci
      - working-directory: app
        run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8193 --bind 127.0.0.1 --directory road-preview-dist > /tmp/road-preview-http.log 2>&1 &
          for n in $(seq 1 30);do curl -fsS http://127.0.0.1:8193/manifest.json && break; sleep 1;done
          node app/tests/road-selective-preview-browser.mjs
