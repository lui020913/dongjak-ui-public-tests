name: Public deployed UI screen inventory (anonymous, NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/visual-screen-inventory.spec.mjs'
      - 'tests/anonymous-control-audit.spec.mjs'
      - '.github/workflows/public-screen-inventory.yml'
  push:
    branches: [main]
    paths:
      - 'tests/visual-screen-inventory.spec.mjs'
      - 'tests/anonymous-control-audit.spec.mjs'
      - 'scripts/build-screen-gallery.mjs'
      - 'scripts/compare-screen-inventories.mjs'
      - '.github/workflows/public-screen-inventory.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'
permissions:
  contents: read
concurrency:
  group: deployed-screen-inventory
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: production
            target: https://dongjak-walk-safety-preview.pages.dev/
          - label: candidate
            target: https://public-ui-rc.dongjak-walk-safety-preview.pages.dev/
    env:
      CI: 'true'
      DONGJAK_TARGET_URL: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate approved public target and scripts
        run: |
          npm run check:target
          node --check tests/visual-screen-inventory.spec.mjs
          node --check tests/anonymous-control-audit.spec.mjs
          node --check scripts/compare-screen-inventories.mjs
          node --check scripts/build-screen-gallery.mjs
      - name: Install Playwright
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Record exact release identity before capture
        run: |
          mkdir -p quality-report/screen-captures
          curl -fsS --max-time 20 "${DONGJAK_TARGET_URL}release-source.json" > quality-report/screen-captures/release-before.json
      - name: Gate obsolete candidate preview by exact source identity
        id: compatibility
        env:
          CANDIDATE_LABEL: ${{ matrix.label }}
        run: |
          if [ "$CANDIDATE_LABEL" != candidate ]; then
            echo "compatible=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -fsS --max-time 20 "https://dongjak-walk-safety-preview.pages.dev/release-source.json" > quality-report/screen-captures/production-source.json
          node --input-type=module -e '
            import fs from "node:fs";
            const p=JSON.parse(fs.readFileSync("quality-report/screen-captures/production-source.json","utf8"));
            const c=JSON.parse(fs.readFileSync("quality-report/screen-captures/release-before.json","utf8"));
            const ok=p.application_version===c.application_version &&
              p.source_commit===c.source_commit &&
              p.public_ui_source_commit===c.public_ui_source_commit;
            fs.appendFileSync(process.env.GITHUB_OUTPUT,"compatible="+ok+"\n");
            console.log(ok?"Candidate uses exact Production source; comparison allowed.":
              "Candidate version "+c.application_version+" differs from Production "+p.application_version+
              "; skip incompatible screenshot capture, do not call it a UI regression.");
          '
      - name: Capture anonymous real app screens and geometry
        if: steps.compatibility.outputs.compatible == 'true'
        run: npx playwright test tests/visual-screen-inventory.spec.mjs --project=mobile --fully-parallel --workers=2 --reporter=list
      - name: Confirm release did not change during capture
        if: always()
        run: |
          curl -fsS --max-time 20 "${DONGJAK_TARGET_URL}release-source.json" > quality-report/screen-captures/release-after.json
          cmp quality-report/screen-captures/release-before.json quality-report/screen-captures/release-after.json
      - name: Generate browsable visual gallery
        if: steps.compatibility.outputs.compatible == 'true'
        run: node scripts/build-screen-gallery.mjs
      - name: Upload per-screen screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-ui-screen-inventory-${{ matrix.label }}-${{ github.run_id }}
          path: |
            quality-report/screen-captures/
            test-results/
          if-no-files-found: warn
          retention-days: 7
  audit:
    name: Live UI touch — ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { id: map-navigation, tab: map, from: 8, to: 13 }
          - { id: map-tools, tab: map, from: 13, to: 19 }
          - { id: community-categories, tab: participate, from: 9, to: 12 }
          - { id: community-actions, tab: participate, from: 12, to: 15 }
          - { id: news-refresh, tab: news, from: 7, to: 8 }
          - { id: mine-history, tab: mine, from: 8, to: 10 }
    env:
      CI: 'true'
      DONGJAK_AUDIT_TAB: ${{ matrix.tab }}
      DONGJAK_AUDIT_FROM: ${{ matrix.from }}
      DONGJAK_AUDIT_TO: ${{ matrix.to }}
      DONGJAK_TARGET_URL: https://dongjak-walk-safety-preview.pages.dev/
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate independent tab audit
        run: node --check tests/anonymous-control-audit.spec.mjs
      - name: Install Playwright
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture live release source before
        run: |
          mkdir -p quality-report/screen-captures
          curl -fsS --max-time 20 "${DONGJAK_TARGET_URL}release-source.json" > quality-report/screen-captures/live-source-before.json
      - name: Touch buttons and submenus only on assigned tab
        run: npx playwright test tests/anonymous-control-audit.spec.mjs --project=mobile --workers=1 --reporter=list
      - name: Recheck same release source
        if: always()
        run: |
          curl -fsS --max-time 20 "${DONGJAK_TARGET_URL}release-source.json" > quality-report/screen-captures/live-source-after.json
          cmp quality-report/screen-captures/live-source-before.json quality-report/screen-captures/live-source-after.json
      - name: Save per-tab touch, 130ms and 480ms evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-touch-${{ matrix.id }}-${{ github.run_id }}
          path: |
            quality-report/screen-captures/
            test-results/
          if-no-files-found: warn
          retention-days: 7
  compare:
    needs: capture
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: deployed-ui-screen-inventory-production-${{ github.run_id }}
          path: raw-production
      - uses: actions/download-artifact@v4
        with:
          name: deployed-ui-screen-inventory-candidate-${{ github.run_id }}
          path: raw-candidate
      - name: Compare matched screenshots
        run: |
          mkdir -p comparison/production comparison/candidate
          for side in production candidate; do
            find "raw-$side" -path '*/screen-captures/*' -type f -exec cp {} "comparison/$side/" \;
          done
          node scripts/compare-screen-inventories.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-candidate-comparison-${{ github.run_id }}
          path: comparison/
          retention-days: 7
