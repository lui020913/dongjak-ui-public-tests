name: Public deployed UI screen inventory (anonymous, NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/visual-screen-inventory.spec.mjs'
      - '.github/workflows/public-screen-inventory.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'
permissions:
  contents: read
concurrency:
  group: deployed-screen-inventory
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      DONGJAK_TARGET_URL: ${{ vars.DONGJAK_TARGET_URL || 'https://dongjak-walk-safety-preview.pages.dev/' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate approved public target and scripts
        run: |
          npm run check:target
          node --check tests/visual-screen-inventory.spec.mjs
          node --check scripts/build-screen-gallery.mjs
      - name: Install Playwright
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture anonymous real app screens and geometry
        run: npx playwright test tests/visual-screen-inventory.spec.mjs --project=mobile --reporter=list
      - name: Generate browsable visual gallery
        if: always()
        run: node scripts/build-screen-gallery.mjs
      - name: Upload per-screen screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-ui-screen-inventory-${{ github.run_id }}
          path: |
            quality-report/screen-captures/
            test-results/
          if-no-files-found: warn
          retention-days: 7
