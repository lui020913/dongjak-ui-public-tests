name: Promote previously phone-tested mobile-only artifact to Production
run-name: Promote phone-QA run 44372494679 to Production
on:
  push:
    branches: [main]
    paths:
      - 'release/mobile-only-production-retry.json'
permissions:
  contents: read
  actions: read
concurrency:
  group: mobile-only-production-promotion
  cancel-in-progress: false
jobs:
  production:
    if: github.actor == 'lui020913' && github.repository == 'lui020913/dongjak-ui-public-tests' && github.ref == 'refs/heads/main'
    name: Promote exact 24-pass phone-tested artifact
    runs-on: ubuntu-24.04
    environment: public-cloudflare-production
    timeout-minutes: 35
    env:
      SOURCE_SHA: 0c4be7f51a4052b13315294229a044cc65d175d1
      PUBLIC_SHA: dc44e070b48b7192a267c3b65edc971b32773edd
      CSS_SHA: 4022b314c362731ced8c353987b503a4744499c42d9c2fe2bc3602465453f519
      APP_VERSION: 8.26.1
      BUILD_RUN: '44372494679'
      PAGES_PROJECT: dongjak-walk-safety-preview
      PRODUCTION_URL: https://dongjak-walk-safety-preview.pages.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RELEASE_BUNDLE_KEY: ${{ secrets.RELEASE_BUNDLE_KEY }}
      PRIVATE_SOURCE_READ_TOKEN: ${{ secrets.PRIVATE_SOURCE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download the exact artifact from the successful 24-test Preview run
        uses: actions/download-artifact@v4
        with:
          name: mobile-first-overhaul-sealed-0c4be7f51a4052b13315294229a044cc65d175d1
          path: ${{ runner.temp }}/encrypted
          repository: lui020913/dongjak-ui-public-tests
          run-id: 44372494679
          github-token: ${{ github.token }}
      - name: Decrypt and verify exact previously tested candidate
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/release"
          node scripts/seal-private-release.mjs open "$RUNNER_TEMP/encrypted/mobile-overhaul.sealed" "$RUNNER_TEMP/mobile-overhaul.tar.gz" "$SOURCE_SHA"
          tar -xzf "$RUNNER_TEMP/mobile-overhaul.tar.gz" -C "$RUNNER_TEMP/release"
          jq -e --arg source "$SOURCE_SHA" --arg public "$PUBLIC_SHA" --arg css "$CSS_SHA" --arg version "$APP_VERSION" --arg build "$BUILD_RUN" '.source_commit==$source and .public_ui_source_commit==$public and .public_ui_overlay_sha256==$css and .application_version==$version and (.build_run|tostring)==$build and .release_status=="CANDIDATE_PREVIEW_NOT_PRODUCTION"' "$RUNNER_TEMP/release/dist/release-source.json" >/dev/null
          source_ref="$(jq -er '.source_ref' release/mobile-first-overhaul-source.json)"
          actual="$(gh api "repos/lui020913/dongjak-safety-map/git/ref/heads/$source_ref" --jq .object.sha)"
          test "$actual" = "$SOURCE_SHA"
          echo "Exact artifact and archived private source SHA verified." >> "$GITHUB_STEP_SUMMARY"
      - name: Promote exact tested artifact with binding preservation and guarded rollback
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT"
          cf(){ curl -fsS --max-time 45 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$@"; }
          previous=""
          message="Mobile-only $APP_VERSION source=$SOURCE_SHA public=$PUBLIC_SHA tested-run=$BUILD_RUN promotion-run=$GITHUB_RUN_ID"
          stage="Cloudflare project preflight"
          rollback(){
            code=$?
            if [ "$code" -ne 0 ]; then
              echo "::error::Production promotion failed at stage: $stage"
              if [ -f "$RUNNER_TEMP/production-deploy.log" ]; then tail -n 100 "$RUNNER_TEMP/production-deploy.log"; fi
              if [ -n "$previous" ] && [ -n "$message" ]; then
                current_message="$(cf "$api/deployments?env=production&per_page=1" | jq -r '.result[0].deployment_trigger.metadata.commit_message//""' || true)"
                if [ "$current_message" = "$message" ]; then
                  cf -X POST "$api/deployments/$previous/rollback" | jq -e '.success==true' >/dev/null || echo '::error::Guarded rollback failed; manual Cloudflare inspection is required.'
                fi
              fi
            fi
            exit "$code"
          }
          trap rollback EXIT
          cf "$api" > "$RUNNER_TEMP/project-before.json"
          jq -e '.success==true and .result.production_branch=="main" and (.result.deployment_configs.production|type=="object")' "$RUNNER_TEMP/project-before.json" >/dev/null
          jq -S -c '.result.deployment_configs.production|{d1_databases,ai_bindings,env_vars:(.env_vars|with_entries(.value={type:.value.type}))}' "$RUNNER_TEMP/project-before.json" > "$RUNNER_TEMP/bindings-before"
          stage="previous Production deployment lookup"
          previous="$(cf "$api/deployments?env=production&per_page=1" | jq -er '.result[0].id')"
          test -n "$previous"
          stage="Production artifact marker preparation"
          jq '.release_status="DEPLOYED_PRODUCTION"' "$RUNNER_TEMP/release/dist/release-source.json" > "$RUNNER_TEMP/release-marker.json"
          cp "$RUNNER_TEMP/release-marker.json" "$RUNNER_TEMP/release/dist/release-source.json"
          stage="Wrangler Production deployment"
          cd "$RUNNER_TEMP/release"
          if ! npx --yes wrangler@4 pages deploy dist --project-name="$PAGES_PROJECT" --branch=main --commit-hash="$SOURCE_SHA" --commit-message="$message" > "$RUNNER_TEMP/production-deploy.log" 2>&1; then
            tail -n 100 "$RUNNER_TEMP/production-deploy.log"
            exit 1
          fi
          stage="Production release marker verification"
          verified=0
          for n in $(seq 1 15); do
            if curl -fsSL --max-time 25 "$PRODUCTION_URL/release-source.json?retry-after=$GITHUB_RUN_ID-$n" |
              jq -e --arg source "$SOURCE_SHA" --arg public "$PUBLIC_SHA" --arg css "$CSS_SHA" --arg version "$APP_VERSION" --arg build "$BUILD_RUN" '.source_commit==$source and .public_ui_source_commit==$public and .public_ui_overlay_sha256==$css and .application_version==$version and (.build_run|tostring)==$build and .release_status=="DEPLOYED_PRODUCTION"' >/dev/null; then
              verified=1
              break
            fi
            sleep 5
          done
          test "$verified" = 1
          stage="Production app health checks"
          curl -fsSL --max-time 30 "$PRODUCTION_URL/version.json" | jq -e --arg version "$APP_VERSION" '.version==$version' >/dev/null
          curl -fsSL --max-time 30 "$PRODUCTION_URL/api/transport/status" | jq -e '.bus==true and .subway==true' >/dev/null
          curl -fsSL --max-time 30 "$PRODUCTION_URL/api/seoul-facilities?limit=1" | jq -e '.ok==true and .configured==true and (.places|length)>0' >/dev/null
          stage="Production binding preservation verification"
          cf "$api" | jq -S -c '.result.deployment_configs.production|{d1_databases,ai_bindings,env_vars:(.env_vars|with_entries(.value={type:.value.type}))}' > "$RUNNER_TEMP/bindings-after"
          cmp -s "$RUNNER_TEMP/bindings-before" "$RUNNER_TEMP/bindings-after"
          trap - EXIT
          echo "Production promotion verified. Tested artifact source=$SOURCE_SHA, phone QA run=$BUILD_RUN." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove encrypted and decrypted artifacts and diagnostics
        if: always()
        run: rm -rf "$RUNNER_TEMP/encrypted" "$RUNNER_TEMP/release" "$RUNNER_TEMP/mobile-overhaul.tar.gz" "$RUNNER_TEMP/release-marker.json" "$RUNNER_TEMP/project-before.json" "$RUNNER_TEMP/bindings-before" "$RUNNER_TEMP/bindings-after" "$RUNNER_TEMP/production-deploy.log"
