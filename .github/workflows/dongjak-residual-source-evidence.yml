name: Dongjak residual road source evidence review
on:
  pull_request:
    paths:
      - 'scripts/research/dongjak_residual_source_evidence.py'
      - '.github/workflows/dongjak-residual-source-evidence.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: dongjak-residual-source-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'preview/road-surface-geometry-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install shapely==2.1.2 pyproj==3.7.2
      - uses: actions/download-artifact@v4
        with:
          name: dongjak-exact-free-space-review
          path: reviewed
          run-id: 45768516164
          github-token: ${{ github.token }}
      - run: python scripts/research/dongjak_residual_source_evidence.py reviewed/exact-review source-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: dongjak-residual-source-evidence
          path: source-evidence/
          retention-days: 14
          if-no-files-found: error
