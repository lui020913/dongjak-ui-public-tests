name: Deployment milestone notifications
on:
  workflow_run:
    workflows:
      - Public runner - private source build and Preview
      - Sangdo1 bocha reference - isolated Preview
      - Public runner - approved exact Production deployment
      - Promote previously phone-tested mobile-only artifact to Production
    types: [completed]
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: deployment-notify-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  notify:
    if: github.repository == 'lui020913/dongjak-ui-public-tests' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Announce only a verified deployment
        shell: bash
        run: |
          set -euo pipefail
          jobs="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" | jq -c '[.[].jobs[]]')"
          path="$(jq -r '.workflow_run.path' "$GITHUB_EVENT_PATH")"
          case "$path" in
            .github/workflows/public-private-source-preview.yml|.github/workflows/sangdo1-bocha-preview.yml)
              step='Deploy Preview without showing private build or API contents'
              stage=preview
              title='Preview 완성'
              ;;
            .github/workflows/public-exact-production.yml)
              step='Publish and verify; rollback only our own deployment on failure'
              stage=production
              title='Production 배포 완료'
              ;;
            .github/workflows/mobile-only-production-retry.yml)
              step=''
              stage=production
              title='Production 배포 완료'
              ;;
            *) exit 0 ;;
          esac
          if [[ -n "$step" ]]; then
            jq -e --arg step "$step" 'any(.[]; .conclusion=="success" and any(.steps[]?; .name==$step and .conclusion=="success"))' <<< "$jobs" >/dev/null || exit 0
          else
            jq -e 'any(.[]; .name=="Promote exact 24-pass phone-tested artifact" and .conclusion=="success")' <<< "$jobs" >/dev/null || exit 0
          fi
          marker="<!-- deployment-milestone:$RUN_ID:$stage -->"
          comments="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/15/comments" --jq '.[].body')"
          if grep -Fq "$marker" <<< "$comments"; then exit 0; fi
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
          gh issue comment 15 --repo "$GITHUB_REPOSITORY" --body "$(printf '@lui020913 %s\n\n[배포 상세 보기](%s)\n%s' "$title" "$url" "$marker")"
