name: Focused route CTA hit-test diagnostic (NO DEPLOY)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/route-cta-hit-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  route-hit:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 8
    env:
      TARGET_URL: https://a8bed9dd.dongjak-walk-safety-preview.pages.dev/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install pinned browser API only
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Inspect actual hit target at route calculate button
        run: |
          node --input-type=module <<'JS'
          import {chromium} from '@playwright/test';
          const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader']});
          const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:2,locale:'ko-KR',isMobile:true,hasTouch:true});
          page.on('console',msg=>{if(msg.type()==='error')console.log('BROWSER_ERROR',msg.text().slice(0,300));});
          await page.goto(process.env.TARGET_URL,{waitUntil:'domcontentloaded',timeout:45000});
          const menu=page.locator('#dj-install-menu');
          if(await menu.isVisible().catch(()=>false))await menu.getByRole('button',{name:'웹에서 바로 이용하기'}).click();
          const startup=page.locator('#map-startup-overlay');
          await page.locator('#map').waitFor({state:'visible',timeout:45000});
          const cont=page.locator('#map-startup-continue');
          if(await cont.isVisible().catch(()=>false))await cont.click();
          await startup.waitFor({state:'hidden',timeout:50000});
          const tour=page.locator('#dj860-onboarding');
          if(await tour.isVisible().catch(()=>false))await tour.locator('[data-dj860-action="skip"]').click();
          await page.locator('#bottom-nav .nav-tab[data-tab="route"]').click({timeout:10000});
          await page.locator('#route-panel').waitFor({state:'visible',timeout:10000});
          await page.locator('#dj910-route-footer').waitFor({state:'visible',timeout:10000});
          await page.waitForTimeout(900);
          const diagnostic=await page.evaluate(()=>{
            const ids=['app','route-panel','route-calc','dj910-route-footer','bottom-nav'];
            const read=id=>{
              const n=document.getElementById(id);if(!n)return null;
              const r=n.getBoundingClientRect(),s=getComputedStyle(n);
              return {id,r:{x:r.x,y:r.y,w:r.width,h:r.height,bottom:r.bottom},hidden:n.hidden,
                css:{position:s.position,top:s.top,bottom:s.bottom,left:s.left,right:s.right,display:s.display,
                  transform:s.transform,translate:s.translate,overflow:s.overflow,zIndex:s.zIndex,pointerEvents:s.pointerEvents,
                  margin:s.margin,padding:s.padding},style:n.getAttribute('style')};
            };
            const btn=document.getElementById('route-calc'),r=btn?.getBoundingClientRect(),x=r?.left+r?.width/2,y=r?.top+r?.height/2;
            const stack=r?[...document.elementsFromPoint(x,y)].slice(0,12).map(n=>({tag:n.tagName,id:n.id,className:typeof n.className==='string'?n.className:'svg',pointer:getComputedStyle(n).pointerEvents})):null;
            return {viewport:{width:innerWidth,height:innerHeight},variables:{dock:getComputedStyle(document.getElementById('app')).getPropertyValue('--dj910-dock-bottom'),raw:document.getElementById('app').style.getPropertyValue('--dj910-dock-bottom')},nodes:ids.map(read),hit:{x,y,stack}};
          });
          console.log('ROUTE_CTA_HIT_DIAGNOSTIC',JSON.stringify(diagnostic,null,2));
          await page.screenshot({path:'route-cta-hit.png',fullPage:false,animations:'disabled'});
          await browser.close();
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: route-cta-actual-hit-diagnostic
          path: route-cta-hit.png
          if-no-files-found: ignore
          retention-days: 2
