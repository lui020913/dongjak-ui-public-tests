name: Safety map notification test
on:
  workflow_dispatch:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
jobs:
  notify:
    if: github.actor == 'lui020913' && (github.event_name == 'workflow_dispatch' || (github.event.issue.number == 15 && github.event.comment.body == '알림 테스트'))
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Send test email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          python3 - <<'PY'
          import os, smtplib, ssl
          from email.message import EmailMessage
          from email.utils import formataddr
          msg = EmailMessage()
          msg["From"] = formataddr(("동작구 안전지도", os.environ["SMTP_USER"]))
          msg["To"] = os.environ["NOTIFY_EMAIL"]
          msg["Subject"] = "안전지도 개발 알림 테스트"
          msg.set_content("개발 알림 연결을 확인하는 테스트입니다. 실제 코드 수정이나 운영 배포는 진행하지 않았습니다.")
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=15, context=ssl.create_default_context()) as smtp:
              smtp.login(os.environ["SMTP_USER"], os.environ["SMTP_APP_PASSWORD"])
              smtp.send_message(msg)
          PY
      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: gh issue comment 15 --repo "$GITHUB_REPOSITORY" --body "@lui020913 이메일 알림 테스트 결과 - $RESULT"
