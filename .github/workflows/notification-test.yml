name: Safety map notification test
on:
  workflow_dispatch:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
jobs:
  notify:
    if: github.actor == 'lui020913' && (github.event_name == 'workflow_dispatch' || (github.event.issue.number == 15 && github.event.comment.body == '알림 테스트'))
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Send GitHub push test
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 15 --repo "$GITHUB_REPOSITORY" --body "@lui020913 알림 연결 완료. 개발 진행 알림 테스트입니다."
