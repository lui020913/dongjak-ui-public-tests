name: Integrate Sangdo1 protection gap into charcoal theme (one-shot)
on:
  push:
    branches: [feature/charcoal-theme-unified-20261122]
    paths: [.github/workflows/sangdo1-charcoal-integration.yml]
permissions:
  contents: write
jobs:
  integrate-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: true}
      - name: Merge exact inspected source (fail on conflicts, never overwrite theme)
        shell: bash
        env:
          RESEARCH_REF: research/sangdo1-map-3source-overlay-patch-20261122
          RESEARCH_SHA: 78032dcccabebb12644edb2b7ab721961346d3d5
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$RESEARCH_REF"
          test "$(git rev-parse FETCH_HEAD)" = "$RESEARCH_SHA"
          git merge --no-commit --no-ff "$RESEARCH_SHA"
          test -f app/src/policy-gap-3source-map-patch.js
          test -f app/public/data/protection-zone/sangdo1_policy_gap_3source_300m_20261122.geojson
          grep -Fq 'installPolicyGapThreeSourceMap({map,maplibregl,app,nightMode,protectionOverlay})' app/src/main.js
          grep -Fq 'theme-contract.js' app/index.html
      - name: Bind research controls to both theme palettes without changing map risk colors
        shell: bash
        run: |
          cat >> app/src/theme-contract.css <<'CSS'

          /* Institutional protection-gap research layer: neutral UI in both modes.
             Semantic 0..100 road-score gradient and gray NULL remain unchanged. */
          @layer request-completion {
            html body #app[data-theme="light"] #pza3-panel,
            html body #app[data-theme="dark"] #pza3-panel {
              background:var(--dj-theme-surface)!important;
              color:var(--dj-theme-ink)!important;
              border-color:var(--dj-theme-line)!important;
            }
            html body #app[data-theme="light"] #pza3-panel :is(p,#pza3-status,#pza3-ticks),
            html body #app[data-theme="dark"] #pza3-panel :is(p,#pza3-status,#pza3-ticks) {
              color:var(--dj-theme-muted)!important;
            }
            html body #app[data-theme="dark"] #pza3-panel :is(#pza3-toggle,#pza3-modes button){
              color:var(--dj-theme-ink)!important;
              background:var(--dj-theme-raised)!important;
              border:1px solid var(--dj-theme-line)!important;
            }
            html body #app[data-theme="dark"] #pza3-panel :is(#pza3-toggle,#pza3-modes button)[aria-pressed="true"]{
              color:#f2f4f7!important;
              background:var(--dj-theme-selected)!important;
              border-color:#677583!important;
            }
            html body #app[data-theme="dark"] #pza3-panel :is(#pza3-toggle,#pza3-modes button):focus-visible {
              outline:2px solid var(--dj-theme-accent)!important;
              outline-offset:2px!important;
            }
            html body #app[data-theme="dark"] .maplibregl-popup:has(.pza3-popup) .maplibregl-popup-content {
              background:var(--dj-theme-surface)!important;
              color:var(--dj-theme-ink)!important;
              border:1px solid var(--dj-theme-line)!important;
            }
            html body #app[data-theme="dark"] .maplibregl-popup:has(.pza3-popup) .maplibregl-popup-tip {
              border-top-color:var(--dj-theme-surface)!important;
            }
            html body #app[data-theme="dark"] .maplibregl-popup:has(.pza3-popup) .maplibregl-popup-close-button {
              color:var(--dj-theme-ink)!important;
            }
            html body #app[data-theme="dark"] .pza3-popup {
              color:var(--dj-theme-ink)!important;
            }
            html body #app[data-theme="dark"] .pza3-popup :is(dt,p){
              color:var(--dj-theme-muted)!important;
            }
          }
          CSS
          cat > app/tests/sangdo1-charcoal-integration.test.mjs <<'TEST'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const read=p=>readFileSync(new URL('../'+p,import.meta.url),'utf8');
          test('combined charcoal UI and 300m research map preserve independent overlay',()=>{
            const main=read('src/main.js'),html=read('index.html');
            assert.match(main,/installPolicyGapThreeSourceMap\(\{map,maplibregl,app,nightMode,protectionOverlay\}\)/);
            assert.match(main,/installNightVisibility/);
            assert.match(html,/theme-contract\.js/);
            assert.match(html,/id="protection-zone-controls"/);
          });
          test('dark research UI is neutral while risk gradient and gray NULL are semantic',()=>{
            const css=read('src/theme-contract.css'),js=read('src/policy-gap-3source-map-patch.js');
            assert.match(css,/#pza3-panel/);
            assert.match(css,/var\(--dj-theme-selected\)/);
            assert.match(css,/\.pza3-popup/);
            assert.match(js,/#D64550/);
            assert.match(js,/#A3AAB4/);
            assert.match(js,/policyGapTeamAverage/);
            assert.match(js,/indicatorCount:denominator/);
            assert.doesNotMatch(css,/pza3-score-lines/);
          });
          TEST
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Integrated app and policy-gap tests
        working-directory: app
        run: |
          node --test tests/theme-state-core.test.mjs tests/theme-unified-contract.test.mjs tests/policy-gap-3source-map-patch.test.mjs tests/sangdo1-policy-gap-3source.test.mjs tests/sangdo1-protection-gap-300m-only.test.mjs tests/sangdo1-independent-policy-gap-all-roads.test.mjs tests/sangdo1-charcoal-integration.test.mjs tests/protection-zone-integration.test.mjs
      - name: Existing theme/iOS and policy visibility regressions
        working-directory: app
        run: |
          node --test tests/v9259-ios-startup-seam.test.mjs tests/v9259-primary-page-theme-contract.test.mjs tests/v9269-flat-surfaces.test.mjs tests/protection-zone-visibility-recovery.test.mjs
      - name: Vite production build
        working-directory: app
        run: npm run build
      - name: Clean integration runner and commit tested combined branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A app docs/research scripts/research frontend/production patches .github/workflows/sangdo1-school-catchment-source-audit.yml
          git rm -f .github/workflows/sangdo1-charcoal-integration.yml
          git diff --cached --check
          git commit -m 'feat(map): integrate 300m Sangdo1 three-source policy-gap overlay with charcoal theme'
          git push origin HEAD:feature/charcoal-theme-unified-20261122
