name: Recovery smoke test
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  smoke:
    if: >-
      github.actor == 'lui020913' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.issue.number == 15 && github.event.comment.body == '복구 테스트'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Simulate transient failure
        run: |
          if [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]; then exit 1; fi
      - name: Notify recovered
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 15 --repo "$GITHUB_REPOSITORY" --body "@lui020913 복구 테스트 성공 · 자동 재실행 확인"
