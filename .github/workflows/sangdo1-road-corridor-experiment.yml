name: Sangdo1 variable-width road corridor experiment
on:
  pull_request:
    paths:
      - 'scripts/research/sangdo1_road_corridor_preview.py'
      - 'scripts/research/sangdo1_joint_corridor_preview.py'
      - '.github/workflows/sangdo1-road-corridor-experiment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  corridor-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install shapely==2.1.2 pyproj==3.7.2
      - run: python scripts/research/sangdo1_road_corridor_preview.py --test
      - run: python scripts/research/sangdo1_road_corridor_preview.py sangdo-corridor-review
      - uses: actions/upload-artifact@v4
        with:
          name: sangdo1-variable-width-corridor-review
          path: sangdo-corridor-review/
          if-no-files-found: error
          retention-days: 14

  joint-node-review:
    needs: corridor-audit
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install shapely==2.1.2 pyproj==3.7.2
      - uses: actions/download-artifact@v4
        with:
          name: sangdo1-variable-width-corridor-review
          path: sangdo-corridor-review
      - run: python scripts/research/sangdo1_joint_corridor_preview.py sangdo-corridor-review sangdo-joint-review
      - uses: actions/upload-artifact@v4
        with:
          name: sangdo1-joint-node-corridor-review
          path: sangdo-joint-review/
          if-no-files-found: error
          retention-days: 14
