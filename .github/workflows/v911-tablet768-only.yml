name: v911 tablet768-only More panel verification
run-name: tablet768 More panel only - ${{ github.event.head_commit.message }}
on:
  push:
    branches: [main]
    paths: [release/tablet768-audit-request.json]
permissions:
  contents: read
concurrency:
  group: v911-anonymous-ui
  cancel-in-progress: true
jobs:
  ui:
    name: ui (tablet768 only)
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load exact Preview target
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync,readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('release/tablet768-audit-request.json','utf8'));
          if(!/^[a-f0-9]{40}$/.test(r.source_sha||'')) throw new Error('Invalid source SHA');
          if(!Number.isSafeInteger(r.build_run)||r.build_run<1) throw new Error('Invalid build run');
          if(typeof r.target_url!=='string'||!r.target_url.startsWith('https://')) throw new Error('Invalid target URL');
          const nl=String.fromCharCode(10);
          appendFileSync(process.env.GITHUB_ENV,
            'DONGJAK_EXPECTED_SOURCE_SHA='+r.source_sha+nl+
            'DONGJAK_EXPECTED_BUILD_RUN='+r.build_run+nl+
            'DONGJAK_TARGET_URL='+r.target_url+nl);
          NODE
      - name: Verify exact Preview source before test
        run: node scripts/verify-release-source.mjs
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: playwright-npm-noble-${{ hashFiles('package.json') }}
      - name: Install pinned JS test package only
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-audit --no-fund
      - name: Verify preinstalled Chromium
        run: |
          node --input-type=module -e "import {chromium} from '@playwright/test'; const b=await chromium.launch({args:['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']}); console.log('Chromium ready: '+b.version()); await b.close()"
      - name: Run only the 768px tablet test
        run: npx playwright test --config=playwright.v911-remote.config.mjs --project=tablet768
      - name: Verify exact Preview did not change while testing
        if: always()
        run: node scripts/verify-release-source.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v911-tablet768-only-more-panel
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
