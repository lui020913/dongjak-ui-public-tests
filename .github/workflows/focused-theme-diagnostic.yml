name: Focused dark theme diagnostic (NO DEPLOY)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/focused-theme-diagnostic.yml', 'tests/focused-theme-diagnostic.spec.mjs']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      DONGJAK_TARGET_URL: https://public-ui-rc.dongjak-walk-safety-preview.pages.dev/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check:target
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/focused-theme-diagnostic.spec.mjs --project=mobile --reporter=list
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-theme-diagnostic
          path: test-results/
          retention-days: 3
