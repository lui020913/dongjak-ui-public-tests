name: Verify official rail geometry on deployed mobile map
on:
  push:
    branches:
      - diagnostics/official-rail-geometry-20261121
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-rail-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only check of production proxy and upstream line identifiers
        shell: bash
        env:
          PRODUCTION: https://dongjak-walk-safety-preview.pages.dev
        run: |
          node --input-type=module <<'NODE'
          const upstream=new URL('https://portal.esrikr.com/arcgis/rest/services/Hosted/MOIS_KR_Subway/FeatureServer/2/query');
          for(const [k,v] of Object.entries({
            where:'1=1',geometry:'126.855,37.438,127.055,37.562',
            geometryType:'esriGeometryEnvelope',inSR:'4326',
            spatialRel:'esriSpatialRelIntersects',outFields:'sub_nm',
            returnGeometry:'false',returnDistinctValues:'true',f:'json'
          }))upstream.searchParams.set(k,v);
          const check=async(label,url)=>{
            try {
              const response=await fetch(url,{signal:AbortSignal.timeout(22000),headers:{Accept:'application/json'}});
              const raw=await response.text();const body=JSON.parse(raw);
              const names=[...new Set((body.features||[]).map(f=>String(f?.attributes?.sub_nm||'')).filter(Boolean))];
              console.log(label,JSON.stringify({
                status:response.status,features:body.features?.length||0,
                sampleNames:names.filter(x=>/1|2|4|7|9|신림/.test(x)).slice(0,35),
                hasLineGeometry:Boolean((body.features||[]).some(f=>Array.isArray(f?.geometry?.paths)&&f.geometry.paths.length>0)),
                apiError:Boolean(body.error),source:body.source||null
              }));
              return {ok:response.ok&&Array.isArray(body.features)&&body.features.length>0,names};
            }catch(error){console.log(label,'request failed:',String(error?.message||error).slice(0,120));return {ok:false,names:[]};}
          };
          const prod=await check('PRODUCTION_RAIL_PROXY',process.env.PRODUCTION+'/api/rail-geometry');
          const official=await check('OFFICIAL_RAIL_DISTINCT',upstream.toString());
          if(!prod.ok || !official.ok)console.log('SOURCE_OUTAGE_CONFIRMED: running fallback probe without hiding outage');
          NODE


      - name: Identify accessible rail geometry fallback providers without modifying Production
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const urls={
           OSM_OVERPASS_KUMI:'https://overpass.kumi.systems/api/interpreter?data='+encodeURIComponent('[out:json][timeout:15];way(167732855);out geom;'),
           OSM_OVERPASS_DE:'https://overpass-api.de/api/interpreter?data='+encodeURIComponent('[out:json][timeout:15];way(167732855);out geom;'),
           OSM_CORE_WAY:'https://api.openstreetmap.org/api/0.6/way/167732855/full',
           OSM_GEOMETRY_GITHUB:'https://raw.githubusercontent.com/jebowe3/seoul_transportation/main/line_9.geojson'
          };
          await Promise.all(Object.entries(urls).map(async([name,url])=>{
           try{
            const resp=await fetch(url,{signal:AbortSignal.timeout(19000),headers:{Accept:'application/json'}});
            const body=await resp.text();
            console.log(name,JSON.stringify({status:resp.status,bytes:body.length,looksLikeGeometry:/coordinates|<node|<way|"geometry"|"elements"/.test(body),mime:resp.headers.get('content-type')}));
           }catch(e){console.log(name,'failed',String(e?.message||e).slice(0,100));}
          }));
          NODE


      - name: Check out the candidate rail-fallback code for a full live-provider integration test
        uses: actions/checkout@v4
        with:
          ref: fix/issue235-osm-rail-fallback-20261121
          persist-credentials: false
      - name: Verify exact API response from live OSM data mirror without touching Production
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {onRequestGet} from './app/functions/api/rail-geometry.js';
          import {extractOfficialPaths,mergeOfficialRail} from './app/src/rail-official-shapes.js';
          import {fixedRailCollection} from './app/src/fixed-rail-lines.js';
          const response=await onRequestGet({request:new Request('https://example.invalid/api/rail-geometry')});
          const payload=await response.json();
          const paths=payload.features?extractOfficialPaths(payload):[];
          const actual=[...new Set(paths.map(p=>p.line))].sort();
          const merged=mergeOfficialRail(fixedRailCollection(),paths);
          const verified=merged.lines.slice().sort();
          console.log('LIVE_OSM_RAIL_FALLBACK',JSON.stringify({
            httpStatus:response.status,source:payload.source||null,
            originLicense:payload.license||null,
            availableLines:actual,
            geometricPaths:paths.length,
            mergedRealRailLines:verified,
            actualGeometryFeatures:merged.collection.features.filter(f=>!f.properties?.schematic).length,
            missing:payload.missing_lines||null
          }));
          if(response.status!==200||payload.source!=='OpenStreetMap_ODbL'
             ||actual.length!==6||paths.length<6||verified.length!==6)process.exitCode=1;
          NODE


      - name: Confirm current protected Production serves six attributed rail lines
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const endpoint='https://dongjak-walk-safety-preview.pages.dev/api/rail-geometry';
          const response=await fetch(endpoint,{signal:AbortSignal.timeout(26000),headers:{Accept:'application/json'}});
          let payload={};
          try{payload=await response.json()}catch{}
          const lines=[...new Set((payload.features||[]).map(f=>f?.attributes?.sub_nm).filter(Boolean))].sort();
          const paths=(payload.features||[]).reduce((n,f)=>n+(f.geometry?.paths?.length||0),0);
          console.log('PRODUCTION_RAIL_GEOMETRY',JSON.stringify({
            status:response.status,origin:payload.source||null,
            lines,features:payload.features?.length||0,paths,
            missing:payload.missing_lines||null,
            attribution:payload.attribution||null,
            error:payload.error||null
          }));
          if(response.status!==200||payload.source!=='OpenStreetMap_ODbL'
             ||lines.length!==6||paths<10)process.exitCode=1;
          NODE
