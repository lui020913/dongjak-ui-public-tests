name: Dongjak district road corridor research
on:
  pull_request:
    paths:
      - '.github/workflows/dongjak-district-corridor-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  district-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install shapely==2.1.2 pyproj==3.7.2
      - run: python scripts/research/sangdo1_road_corridor_preview.py --test
      - run: python scripts/research/sangdo1_road_corridor_preview.py dongjak-corridor-review --district
      - uses: actions/upload-artifact@v4
        with:
          name: dongjak-district-corridor-baseline
          path: dongjak-corridor-review/
          if-no-files-found: error
          retention-days: 14
  district-joint:
    needs: district-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install shapely==2.1.2 pyproj==3.7.2
      - uses: actions/download-artifact@v4
        with:
          name: dongjak-district-corridor-baseline
          path: dongjak-corridor-review
      - run: python scripts/research/sangdo1_joint_corridor_preview.py dongjak-corridor-review dongjak-joint-review
      - uses: actions/upload-artifact@v4
        with:
          name: dongjak-district-joint-review
          path: dongjak-joint-review/
          if-no-files-found: error
          retention-days: 14
  district-refinement:
    needs: district-joint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install shapely==2.1.2 pyproj==3.7.2
      - uses: actions/download-artifact@v4
        with:
          name: dongjak-district-joint-review
          path: dongjak-joint-review
      - run: python scripts/research/sangdo1_corridor_refinement.py --test
      - run: python scripts/research/sangdo1_corridor_refinement.py dongjak-joint-review dongjak-refined-review
      - uses: actions/upload-artifact@v4
        with:
          name: dongjak-district-refined-review
          path: dongjak-refined-review/
          if-no-files-found: error
          retention-days: 14
