name: District redevelopment geometry audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/research/audit_dongjak_redevelopment.py'
      - '.github/workflows/district-redevelopment-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'shapely==2.1.2' 'pyproj==3.7.2'
      - run: python scripts/research/audit_dongjak_redevelopment.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: district-redevelopment-audit
          path: audit-redevelopment-output/
          retention-days: 14
