name: Android APK - public build
run-name: Android APK (${{ inputs.variant || 'debug' }}) - ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      variant:
        description: APK type (debug for testing; release requires signing secrets)
        type: choice
        options: [debug, release]
        default: debug
  workflow_run:
    workflows: ['Mobile-only release — Preview, phone QA and protected Production']
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: android-apk-${{ github.ref }}-${{ inputs.variant || 'debug' }}
  cancel-in-progress: true
jobs:
  apk:
    if: >-
      github.repository == 'lui020913/dongjak-ui-public-tests' && github.ref == 'refs/heads/main' &&
      github.actor == 'lui020913' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.login == 'lui020913' &&
      github.event.workflow_run.event == 'push'))
    environment: public-source-build
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      public_debug: ${{ steps.package.outputs.public_debug }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      VARIANT: ${{ inputs.variant || 'debug' }}
      PRODUCTION_URL: https://dongjak-walk-safety-preview.pages.dev
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Resolve current verified Production release (never fall back)
        id: production
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN: ${{ github.event.workflow_run.id || '' }}
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/production-marker.json"
          curl -fsSL --retry 2 --max-time 30 "$PRODUCTION_URL/release-source.json?apk=$GITHUB_RUN_ID" > "$marker"
          jq -e '.release_status=="DEPLOYED_PRODUCTION" and .source_commit==.public_ui_source_commit and (.source_commit|test("^[a-f0-9]{40}$")) and (.public_ui_overlay_sha256|test("^[a-f0-9]{64}$")) and (.application_version|test("^[0-9]+[.][0-9]+[.][0-9]+$")) and (.build_run|tostring|test("^[1-9][0-9]*$"))' "$marker" >/dev/null
          sha="$(jq -r .source_commit "$marker")"
          run="$(jq -r .build_run "$marker")"
          version="$(jq -r .application_version "$marker")"
          if [ -n "$TRIGGER_RUN" ]; then test "$TRIGGER_RUN" = "$run"; fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" | jq -e --arg sha "$sha" --arg repo "$GITHUB_REPOSITORY" '.head_sha==$sha and .head_branch=="main" and .head_repository.full_name==$repo and .event=="push" and .conclusion=="success" and .path==".github/workflows/mobile-first-overhaul-preview.yml" and .actor.login=="lui020913"' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" | jq -e '[.jobs[]|select(.name=="Promote the exact mobile-tested build to Production" and .conclusion=="success")]|length==1' >/dev/null
          curl -fsSL --max-time 30 "$PRODUCTION_URL/version.json?apk=$GITHUB_RUN_ID" | jq -e --arg version "$version" '.version==$version' >/dev/null
          printf 'sha=%s\nrun=%s\nversion=%s\n' "$sha" "$run" "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.production.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned icon image generator dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache@v4
        with:
          path: ~/.npm/_cacache
          key: ${{ runner.os }}-${{ runner.arch }}-app-npm-v1-${{ hashFiles('app/package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-app-npm-v1-
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          cache-read-only: false
      - uses: actions/download-artifact@v4
        with:
          name: mobile-first-overhaul-sealed-${{ steps.production.outputs.sha }}
          run-id: ${{ steps.production.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/apk-sealed
      - name: Extract only the web assets from the verified release artifact
        working-directory: .
        env:
          RELEASE_BUNDLE_KEY: ${{ secrets.RELEASE_BUNDLE_KEY }}
          SOURCE_SHA: ${{ steps.production.outputs.sha }}
          VERSION: ${{ steps.production.outputs.version }}
        run: |
          set -euo pipefail
          umask 077
          tarball="$RUNNER_TEMP/apk-release.tar.gz"
          trap 'rm -f "$tarball"' EXIT
          node scripts/seal-private-release.mjs open "$RUNNER_TEMP/apk-sealed/mobile-overhaul.sealed" "$tarball" "$SOURCE_SHA"
          mkdir -m 700 "$RUNNER_TEMP/apk-web"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/apk-web" dist
          cd "$RUNNER_TEMP/apk-web/dist"
          jq -e --slurpfile prod "$RUNNER_TEMP/production-marker.json" '.release_status=="CANDIDATE_PREVIEW_NOT_PRODUCTION" and .source_commit==$prod[0].source_commit and .public_ui_source_commit==$prod[0].public_ui_source_commit and .public_ui_overlay_sha256==$prod[0].public_ui_overlay_sha256 and .application_version==$prod[0].application_version and (.build_run|tostring)==($prod[0].build_run|tostring)' release-source.json >/dev/null
          jq -e --arg version "$VERSION" '.version==$version' version.json >/dev/null
          test -s index.html
          test -z "$(find . -type l -print -quit)"
          # The same public dist is shipped, not the encrypted bundle's server/source files.
          rm -rf _worker.js functions server _routes.json _headers _redirects
          find . -type f \( -name '*.map' -o -name '.env*' \) -delete
          cp "$RUNNER_TEMP/production-marker.json" release-source.json
      - name: Prepare native project and SDK in parallel; reuse exact tested web assets
        id: prepare
        env:
          VERSION: ${{ steps.production.outputs.version }}
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:?Missing Android SDK}"
          (
            set -euo pipefail
            if [ ! -f "$sdk/platforms/android-36/android.jar" ] || [ ! -x "$sdk/build-tools/36.0.0/apksigner" ]; then
              sdkmanager "platforms;android-36" "build-tools;36.0.0"
            fi
          ) &
          sdk_pid=$!
          trap 'kill "$sdk_pid" 2>/dev/null || true' EXIT
          npm ci --no-audit --no-fund --prefer-offline
          mkdir -p build
          mv "$RUNNER_TEMP/apk-web/dist" build/android
          # Capacitor loads the shared universal assets locally; its runtime detects Android.
          # Only same-origin API fetches go through the existing native HTTP plugin.
          cat > build/android/dongjak-native-api.js <<'JS'
          (() => {
            const original = window.fetch.bind(window);
            const base = 'https://dongjak-walk-safety-preview.pages.dev';
            window.fetch = async function(input, init) {
              const u = new URL(input instanceof Request ? input.url : String(input), location.href);
              if (u.origin !== location.origin || !/^\/(api|routing)\//.test(u.pathname)) return original(input, init);
              const request = new Request(input, init);
              if (request.signal.aborted) throw new DOMException('Aborted','AbortError');
              const cap = window.Capacitor;
              if (!cap || typeof cap.nativePromise !== 'function') throw new Error('Native HTTP bridge unavailable');
              const headers = Object.fromEntries(request.headers);
              const opts = {url: base + u.pathname + u.search, method:request.method, headers, responseType:'text',connectTimeout:15000,readTimeout:30000};
              if (request.method !== 'GET' && request.method !== 'HEAD') {
                const body = await request.text();
                opts.data = /application\/json/i.test(headers['content-type'] || '') && body ? JSON.parse(body) : body;
              }
              if (request.signal.aborted) throw new DOMException('Aborted','AbortError');
              let onAbort;
              try {
                const reply = await Promise.race([
                  cap.nativePromise('CapacitorHttp','request',opts),
                  new Promise((_,reject) => {
                    onAbort = () => reject(new DOMException('Aborted','AbortError'));
                    request.signal.addEventListener('abort',onAbort,{once:true});
                  })
                ]);
                const code = Number(reply.status);
                if (code < 200 || code > 599) throw new TypeError('Invalid native HTTP response');
                const body = request.method === 'HEAD' || [204,205,304].includes(code) ? null : typeof reply.data === 'string' ? reply.data : JSON.stringify(reply.data ?? null);
                return new Response(body,{status:code,headers:reply.headers || {}});
              } finally { if(onAbort) request.signal.removeEventListener('abort',onAbort); }
            };
          })();
          JS
          node --check build/android/dongjak-native-api.js
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync,appendFileSync} from 'node:fs';
          const version=process.env.VERSION;
          const index='build/android/index.html';
          const html=readFileSync(index,'utf8');
          if(!html.includes('<head>') || html.includes('dongjak-native-api.js')) throw Error('Unexpected HTML entrypoint');
          writeFileSync(index,html.replace('<head>','<head>\n    <script src="/dongjak-native-api.js"></script>'));
          const [major,minor,patch]=version.split('.').map(Number);
          const code=major*1000000+minor*1000+patch;
          if(!/^\d+\.\d+\.\d+$/.test(version)||minor>=1000||patch>=1000||code<1||code>2100000000) throw Error('Invalid Android version');
          const file='android/app/build.gradle';
          const src=readFileSync(file,'utf8');
          if(!/^\s*versionCode\s+\d+\s*$/m.test(src)||!/^\s*versionName\s+"[^"]+"\s*$/m.test(src)) throw Error('Android version fields missing');
          writeFileSync(file,src.replace(/^(\s*versionCode\s+)\d+\s*$/m,(_,p)=>p+code).replace(/^(\s*versionName\s+)"[^"]+"\s*$/m,(_,p)=>p+JSON.stringify(version)));
          appendFileSync(process.env.GITHUB_OUTPUT,'version='+version+'\ncode='+code+'\n');
          NODE
          npx --no-install cap sync android
          python scripts/generate-native-icons.py android
          wait "$sdk_pid"
          trap - EXIT
      - name: Compile selected APK with parallel Gradle workers
        working-directory: app/android
        run: |
          set -euo pipefail
          if [ "$VARIANT" = release ]; then task=assembleRelease; else task=assembleDebug; fi
          gradle ":app:$task" --parallel --build-cache --max-workers=4 --console=plain -Dorg.gradle.jvmargs=-Xmx3g
      - name: Create installable APK and verify signature and metadata
        id: package
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          VERSION_CODE: ${{ steps.prepare.outputs.code }}
          ANDROID_KEYSTORE_BASE64: ${{ inputs.variant == 'release' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ inputs.variant == 'release' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ inputs.variant == 'release' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ inputs.variant == 'release' && secrets.ANDROID_KEY_PASSWORD || '' }}
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ env.VARIANT == 'debug' && secrets.ANDROID_DEBUG_KEYSTORE_BASE64 || '' }}
          ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ env.VARIANT == 'debug' && secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD || '' }}
          ANDROID_DEBUG_CERT_SHA256: ${{ env.VARIANT == 'debug' && secrets.ANDROID_DEBUG_CERT_SHA256 || '' }}
        run: |
          set -euo pipefail
          umask 077
          tools="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p "$RUNNER_TEMP/apk-output"
          output="$RUNNER_TEMP/apk-output/Dongjak-Safety-Map-v$VERSION-$VARIANT.apk"
          if [ "$VARIANT" = release ]; then
            : "${ANDROID_KEYSTORE_BASE64:?Configure ANDROID_KEYSTORE_BASE64}"
            : "${ANDROID_KEYSTORE_PASSWORD:?Configure ANDROID_KEYSTORE_PASSWORD}"
            : "${ANDROID_KEY_ALIAS:?Configure ANDROID_KEY_ALIAS}"
            : "${ANDROID_KEY_PASSWORD:?Configure ANDROID_KEY_PASSWORD}"
            key="$RUNNER_TEMP/dongjak-release.keystore"
            trap 'rm -f "$key" "$RUNNER_TEMP/aligned.apk"' EXIT
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key"
            unset ANDROID_KEYSTORE_BASE64
            "$tools/zipalign" -f -P 16 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$tools/apksigner" sign --ks "$key" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out "$output" "$RUNNER_TEMP/aligned.apk"
          elif [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64$ANDROID_DEBUG_KEYSTORE_PASSWORD$ANDROID_DEBUG_CERT_SHA256" ]; then
            : "${ANDROID_DEBUG_KEYSTORE_BASE64:?Configure persistent debug keystore}"
            : "${ANDROID_DEBUG_KEYSTORE_PASSWORD:?Configure persistent debug password}"
            [[ "$ANDROID_DEBUG_CERT_SHA256" =~ ^[A-Fa-f0-9]{64}$ ]]
            key="$RUNNER_TEMP/dongjak-debug.p12"
            trap 'rm -f "$key" "$RUNNER_TEMP/debug-aligned.apk"' EXIT
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$key"
            unset ANDROID_DEBUG_KEYSTORE_BASE64
            "$tools/zipalign" -f -P 16 4 android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/debug-aligned.apk"
            "$tools/apksigner" sign --ks "$key" --ks-key-alias dongjak-debug --ks-pass env:ANDROID_DEBUG_KEYSTORE_PASSWORD --key-pass env:ANDROID_DEBUG_KEYSTORE_PASSWORD --out "$output" "$RUNNER_TEMP/debug-aligned.apk"
            "$tools/apksigner" verify --print-certs "$output" > "$RUNNER_TEMP/debug-cert.txt"
            cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/debug-cert.txt")"
            test "${cert,,}" = "${ANDROID_DEBUG_CERT_SHA256,,}"
            echo 'public_debug=true' >> "$GITHUB_OUTPUT"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "$output"
            echo 'public_debug=false' >> "$GITHUB_OUTPUT"
            echo 'Persistent signing key not configured; test artifact only.' >> "$GITHUB_STEP_SUMMARY"
          fi
          "$tools/apksigner" verify --verbose "$output"
          "$tools/aapt" dump badging "$output" > "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='kr.dongjak.safetyapp' versionCode='$VERSION_CODE' versionName='$VERSION'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "application-label:'동작하는 안전지도'" "$RUNNER_TEMP/apk-badging.txt"
          unzip -p "$output" assets/public/index.html | wc -c | awk '$1>0{ok=1} END{exit !ok}'
          unzip -p "$output" assets/public/version.json | jq -e --arg v "$VERSION" '.version==$v' >/dev/null
          unzip -p "$output" assets/public/release-source.json | jq -e --slurpfile prod "$RUNNER_TEMP/production-marker.json" '.==$prod[0]' >/dev/null
          # Refuse to publish a stale APK if a new Production arrives during compilation.
          curl -fsSL --max-time 30 "$PRODUCTION_URL/release-source.json?apk-final=$GITHUB_RUN_ID" | jq -e --slurpfile prod "$RUNNER_TEMP/production-marker.json" '.source_commit==$prod[0].source_commit and .application_version==$prod[0].application_version and (.build_run|tostring)==($prod[0].build_run|tostring) and .release_status=="DEPLOYED_PRODUCTION"' >/dev/null
          cp "$RUNNER_TEMP/production-marker.json" "$RUNNER_TEMP/apk-output/PRODUCTION.json"
          (cd "$RUNNER_TEMP/apk-output"; sha256sum ./*.apk > SHA256SUMS.txt)
          {
            echo "### Android APK v$VERSION ($VARIANT)"
            echo "- Production source: ${{ steps.production.outputs.sha }}"
            echo "- Production run: ${{ steps.production.outputs.run }}"
            echo "- Reused tested web bundle; no duplicate Vite build or browser QA."
            echo "- APK signature and version: verified"
            echo "- Device smoke test: not run"
            echo "- Download the APK from this run's Artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Dongjak-Safety-Map-v${{ steps.prepare.outputs.version }}-${{ env.VARIANT }}
          path: ${{ runner.temp }}/apk-output/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
      - name: Remove temporary decrypted and sealed artifacts
        if: always()
        working-directory: .
        run: rm -rf "$RUNNER_TEMP/apk-release.tar.gz" "$RUNNER_TEMP/apk-web" "$RUNNER_TEMP/apk-sealed"

  publish-debug:
    name: Publish fixed-signature debug APK for current Production
    needs: apk
    if: needs.apk.outputs.public_debug == 'true'
    environment: android-distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    concurrency:
      group: android-public-distribution
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.apk.outputs.version }}
      EXPECTED_CERT: ${{ secrets.ANDROID_DEBUG_CERT_SHA256 }}
      PRODUCTION_URL: https://dongjak-walk-safety-preview.pages.dev
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Dongjak-Safety-Map-v${{ needs.apk.outputs.version }}-debug
          path: ${{ runner.temp }}/public-debug
      - name: Verify and publish exact public download without overwriting
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ && "$EXPECTED_CERT" =~ ^[A-Fa-f0-9]{64}$ ]]
          cd "$RUNNER_TEMP/public-debug"
          apk="Dongjak-Safety-Map-v$VERSION-debug.apk"
          test -s "$apk"
          sha256sum -c SHA256SUMS.txt
          jq -e --arg v "$VERSION" '.release_status=="DEPLOYED_PRODUCTION" and .application_version==$v and .source_commit==.public_ui_source_commit and (.source_commit|test("^[a-f0-9]{40}$"))' PRODUCTION.json >/dev/null
          sha="$(jq -r .source_commit PRODUCTION.json)"
          unzip -p "$apk" assets/public/release-source.json | jq -e --slurpfile prod PRODUCTION.json '.==$prod[0]' >/dev/null
          unzip -p "$apk" assets/public/version.json | jq -e --arg v "$VERSION" '.version==$v' >/dev/null
          tools="$ANDROID_HOME/build-tools/36.0.0"
          if [ ! -x "$tools/apksigner" ]; then sdkmanager 'build-tools;36.0.0'; fi
          "$tools/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/public-cert.txt"
          cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/public-cert.txt")"
          test "${cert,,}" = "${EXPECTED_CERT,,}"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/public-badging.txt"
          grep -F "package: name='kr.dongjak.safetyapp'" "$RUNNER_TEMP/public-badging.txt"
          grep -F "application-label:'동작하는 안전지도'" "$RUNNER_TEMP/public-badging.txt"
          curl -fsSL --max-time 30 "$PRODUCTION_URL/release-source.json?android-debug-final=$GITHUB_RUN_ID" | jq -e --slurpfile prod PRODUCTION.json '.==$prod[0]' >/dev/null
          tag="android-debug-v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Version already published; refusing overwrite'; exit 1
          fi
          gh release create "$tag" "$apk" SHA256SUMS.txt PRODUCTION.json --repo "$GITHUB_REPOSITORY" --target "$sha" --title "Android v$VERSION (test APK)" --notes "Fixed-signature debug test APK from verified Production $sha. Not a Play Store release." --latest=false
          echo "Public download: https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$apk" >> "$GITHUB_STEP_SUMMARY"
