name: App film recorder — no deployment
on:
  push:
    branches: ['tools/app-film-recorder']
    paths: ['film/record.mjs', '.github/workflows/app-film-recorder.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  record:
    if: github.repository == 'lui020913/dongjak-ui-public-tests' && github.ref == 'refs/heads/tools/app-film-recorder'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: node film/record.mjs film/scenes/active.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-film-recording
          path: film-output/
          if-no-files-found: warn
          retention-days: 7
