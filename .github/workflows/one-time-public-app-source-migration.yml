name: One-time sanitized application source migration
run-name: Public app source migration from pinned snapshot
on:
  push:
    branches: [main]
    paths: [release/app-source-migration.json]
permissions:
  contents: write
concurrency:
  group: public-app-source-migration
  cancel-in-progress: false
jobs:
  migrate:
    if: github.actor == 'lui020913' && github.repository == 'lui020913/dongjak-ui-public-tests' && github.ref == 'refs/heads/main'
    environment: public-source-build
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      TARGET_BRANCH: public/app-source-migration-20261119
    steps:
      - uses: actions/checkout@v4
        with:
          ref: public/app-source-migration-20261119
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve pinned source snapshot
        env:
          PRIVATE_SOURCE_READ_TOKEN: ${{ secrets.PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$(jq -er '.source_sha' "$GITHUB_WORKSPACE/release/app-source-migration.json" 2>/dev/null || true)"
          if [ -z "$SOURCE_SHA" ]; then
            SOURCE_SHA="0c4be7f51a4052b13315294229a044cc65d175d1"
          fi
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$SOURCE_SHA" = "0c4be7f51a4052b13315294229a044cc65d175d1"
          test -n "$PRIVATE_SOURCE_READ_TOKEN"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
      - name: Fetch exact snapshot for one-time public migration
        env:
          PRIVATE_SOURCE_READ_TOKEN: ${{ secrets.PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/private-source"
          mkdir -m 700 "$source"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_SOURCE_READ_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -C "$source" init -q
          git -C "$source" remote add origin https://github.com/lui020913/dongjak-safety-map.git
          git -C "$source" -c http.extraheader="AUTHORIZATION: basic $auth" fetch --depth=1 origin "$SOURCE_SHA" >/dev/null 2>&1
          git -C "$source" checkout -q --detach FETCH_HEAD
          test "$(git -C "$source" rev-parse HEAD)" = "$SOURCE_SHA"
          echo "Exact source snapshot fetched; credentials were not written to Git config."
      - name: Copy runtime source only and omit private operational material
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/private-source"
          rm -rf app
          mkdir -p app
          for dir in src public functions server platforms android migrations supabase scripts tests; do
            test ! -d "$source/$dir" || cp -a "$source/$dir" app/
          done
          for file in .gitignore .env.example index.html package.json package-lock.json vite.config.js capacitor.config.json wrangler.toml wrangler.seoul-facilities.jsonc playwright.config.js playwright.config.mjs playwright.v910.config.mjs; do
            test ! -f "$source/$file" || cp -a "$source/$file" app/
          done
          mkdir -p app/src
          cp frontend/production/mobile-first-overhaul.css app/src/mobile-first-overhaul.css
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const path='app/src/main.js';
          const source=readFileSync(path,'utf8');
          const anchor="import './v914-mobile-ux-fixes.css';";
          if(source.split(anchor).length!==2) throw new Error('Expected exactly one v914 mobile CSS import anchor');
          if(source.includes("import './mobile-first-overhaul.css';")) throw new Error('Mobile-first CSS already imported');
          writeFileSync(path,source.replace(anchor,anchor+'\n'+"import './mobile-first-overhaul.css';"));
          NODE
          cat > app/README.md <<'EOF'
          # 동작하는 안전지도 — 공개 앱 소스
          
          이 디렉터리는 앱의 실제 실행 소스입니다. 공개 저장소에서 개발·검증·빌드·Preview 및 Production 배포를 수행합니다.
          
          API 비밀키, Cloudflare 배포 토큰, Supabase 비밀키, 로컬 환경 파일은 저장소에 포함하지 않습니다. 런타임 API 키는 Cloudflare Pages/Workers Secrets로 관리하고, 공개 빌드에 필요한 Supabase URL 및 publishable key만 Actions 환경 변수로 전달합니다.
          
          로컬 실행:
          
          ```sh
          npm ci
          npm test
          npm run build
          npm run dev
          ```
          EOF
          test -s app/src/main.js
          test -s app/index.html
          test -s app/package.json
          test -s app/package-lock.json
          test -s app/public/version.json
          test ! -e app/.github
          test ! -e app/test-evidence
          echo "Copied $(find app -type f | wc -l) runtime files ($(du -sh app | cut -f1)); private workflow/docs/evidence directories were not copied."
      - name: Reject private credentials and scan the public snapshot
        run: |
          set -euo pipefail
          if find app -type f \( -name '.env' -o -name '.env.*' ! -name '.env.example' -o -name '.dev.vars*' -o -name '*.pem' -o -name '*.p12' -o -name '*.pfx' -o -name '*.key' -o -name '*.keystore' -o -name '*.jks' -o -name 'google-services.json' -o -name 'local.properties' \) | grep -q .; then
            echo "::error::Private environment or signing material found in app snapshot."
            exit 1
          fi
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tgz"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          set +e
          "$RUNNER_TEMP/gitleaks/gitleaks" detect --source app --no-git --redact --report-format json --report-path "$RUNNER_TEMP/gitleaks.json" --exit-code 23 > "$RUNNER_TEMP/gitleaks.log" 2>&1
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            if [ -s "$RUNNER_TEMP/gitleaks.json" ]; then
              jq -r '.[] | "\(.File):\(.StartLine) [\(.RuleID)]"' "$RUNNER_TEMP/gitleaks.json" | head -50
            fi
            echo "::error::Secret scan failed. Secret values and scanner diagnostics are withheld; nothing will be committed."
            exit 1
          fi
          echo "Secret scan passed; no private key values were found in the public app snapshot."
      - name: Test and build the public application source
        working-directory: app
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test
          npm run check:release
          npm run build
          test -s dist/index.html
          rm -rf node_modules dist
      - name: Commit sanitized app source to the public migration branch
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app
          git diff --cached --quiet && { echo "No app source changes to commit."; exit 0; }
          git commit -m "feat: migrate sanitized application source into public repository"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "Public app source committed. No deployment was performed."
      - name: Remove temporary private checkout and scanner output
        if: always()
        run: rm -rf "$RUNNER_TEMP/private-source" "$RUNNER_TEMP/gitleaks" "$RUNNER_TEMP/gitleaks.tgz" "$RUNNER_TEMP/gitleaks.json" "$RUNNER_TEMP/gitleaks.log"
