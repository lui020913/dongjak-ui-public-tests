name: Public Pages uptime monitor - no secrets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/public-uptime.mjs'
      - '.github/workflows/public-uptime.yml'
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

concurrency:
  group: dongjak-public-uptime
  cancel-in-progress: true

jobs:
  public-http-check:
    name: Anonymous public Pages HTTP check
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      DONGJAK_TARGET_URL: ${{ vars.DONGJAK_TARGET_URL || 'https://dongjak-walk-safety-preview.pages.dev/' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify script syntax
        run: node --check scripts/public-uptime.mjs
      - name: Check public Cloudflare Pages HTML
        run: node scripts/public-uptime.mjs
