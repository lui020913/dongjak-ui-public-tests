name: Stage verified building display road trims once
on:
  push:
    branches: [fix/display-road-building-trims-20261126]
    paths: ['.github/workflows/stage-building-display-road-trims-once.yml']
permissions:
  contents: write
  actions: read
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/display-road-building-trims-20261126
      - uses: actions/download-artifact@v4
        with:
          name: dongjak-building-display-road-trims
          run-id: 45820623789
          github-token: ${{ github.token }}
          path: /tmp/building-trims
      - run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path('/tmp/building-trims/building-display-road-trims.json')
          b=p.read_bytes()
          assert len(b)==136162 and hashlib.sha256(b).hexdigest()=='851b128fd5f3877b513d41915495667a2eda7d9a61d2ba6d69240d9eec487d08'
          d=json.loads(b)
          assert d['schema']==1 and len(d['sheets'])==13 and sum(len(s['edits']) for s in d['sheets'].values())==185
          for s in d['sheets'].values():
              raw=(pathlib.Path('app/public')/s['source'].lstrip('/')).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==s['source_sha256']
              fs=json.loads(raw)['features']
              assert len(fs)==s['source_count']
              for e in s['edits']:assert fs[e['row']]['geometry']==e['original']
          pathlib.Path('app/public/data/building-display-road-trims.json').write_bytes(b)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/public/data/building-display-road-trims.json
          git commit -m 'Stage checksum-verified display-only trims for 185 building footprints'
          git push origin HEAD:fix/display-road-building-trims-20261126
