name: Dongjak display building road trims
on:
  push:
    branches: [audit/remaining-native-road-correspondence-20261126]
    paths:
      - 'scripts/research/dongjak_building_display_road_trim.py'
      - '.github/workflows/dongjak-building-display-road-trim.yml'
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install shapely==2.1.2 pyproj==3.7.2 mapbox-vector-tile==2.2.0
      - uses: actions/download-artifact@v4
        with:
          name: dongjak-reaudited-road-display-assets
          path: assets
          run-id: 45786891095
          github-token: ${{ github.token }}
      - run: python scripts/research/dongjak_building_display_road_trim.py assets output
      - uses: actions/upload-artifact@v4
        with:
          name: dongjak-building-display-road-trims
          path: output/
          retention-days: 14
          if-no-files-found: error
