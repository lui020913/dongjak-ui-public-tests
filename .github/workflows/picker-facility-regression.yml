name: Picker and facility route regression
on:
  pull_request:
    paths:
      - 'app/src/pilot-layer-selection.css'
      - 'app/src/map-hud-collision-guard.js'
      - 'app/tests/map-hud-collision-guard.test.mjs'
      - 'app/tests/map-hud-collision-browser.mjs'
      - 'app/src/place-details.js'
      - 'app/src/main.js'
      - 'app/src/v815-place-store.js'
      - 'app/index.html'
      - 'app/tests/global-neutral-focus-browser.mjs'
      - 'app/tests/tip-search-crossfade-browser.mjs'
      - 'app/src/map-toolbar-crossfade.js'
      - 'app/src/v854-tip-marquee.js'
      - 'app/src/map-quick-search.js'
      - 'app/tests/bus-pill-insets-browser.mjs'
      - 'app/tests/global-neutral-focus-tip-20261126.test.mjs'
      - 'app/src/route-screen-v3.css'
      - 'app/src/route-screen-v3.js'
      - 'app/tests/compact-route-recents-20261124.test.mjs'
      - 'app/src/community-report-presentation.js'
      - 'app/tests/community-report-presentation.test.mjs'
      - 'app/src/mobile-first-layout.css'
      - 'app/src/popup-close-input.js'
      - 'app/tests/popup-close-input.test.mjs'
      - 'app/tests/expanded-detail-header-browser.mjs'
      - 'app/src/transport-map.js'
      - 'app/src/route-map-pick-arbiter.js'
      - 'app/tests/route-map-pick-transit-facility-20261126.test.mjs'
      - 'app/tests/picker-layer-facility-route-20261126.test.mjs'
      - '.github/workflows/picker-facility-regression.yml'
permissions:
  contents: read
jobs:
  focused-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app/src/main.js && node --check app/src/place-details.js && node --check app/src/transport-map.js
      - run: node --test app/tests/picker-layer-facility-route-20261126.test.mjs app/tests/active-layer-dock-20261126.test.mjs app/tests/v864-facility-detail-redesign.test.mjs app/tests/map-hud-collision-guard.test.mjs app/tests/route-map-pick-transit-facility-20261126.test.mjs app/tests/popup-close-input.test.mjs app/tests/transport-click.test.mjs app/tests/community-report-presentation.test.mjs app/tests/v867-transport-window-lifecycle.test.mjs app/tests/compact-route-recents-20261124.test.mjs app/tests/requested-phone-ui-20261126.test.mjs app/tests/remove-community-map-report-link-20261126.test.mjs

  geometry-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/map-hud-collision-browser.mjs
      - run: node tests/expanded-detail-header-browser.mjs
      - run: node tests/global-neutral-focus-browser.mjs
      - run: node tests/tip-search-crossfade-browser.mjs
      - run: node tests/bus-pill-insets-browser.mjs
