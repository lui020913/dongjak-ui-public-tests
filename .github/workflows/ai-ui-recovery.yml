name: AI UI checkpoint recovery
on:
  workflow_run:
    workflows: ["Gemini UI improvement after approved Production"]
    types: [completed]
permissions:
  actions: write
  issues: write
  contents: read
jobs:
  recover:
    if: >-
      github.repository == 'lui020913/dongjak-ui-public-tests' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.run_attempt < 3 &&
      github.event.workflow_run.actor.login == 'lui020913'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
    steps:
      - name: Recover only a verified candidate with a Preview timeout
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs" > "$RUNNER_TEMP/jobs.json"
          if ! jq -e 'any(.jobs[]; .name=="improve" and any(.steps[]; .name=="Recheck Production and push tested CSS" and .conclusion=="success") and any(.steps[]; .name=="Dispatch existing full-app gate for Preview" and .conclusion=="success") and any(.steps[]; .name=="Verify the exact deployed full-app Preview" and .conclusion=="failure"))' "$RUNNER_TEMP/jobs.json" >/dev/null; then
            echo "Not an eligible recovery; preserve failure for review."
            exit 0
          fi
          gh issue comment 15 --repo "$GITHUB_REPOSITORY" --body "@lui020913 자동 복구 시작 · 미리보기 확인 재시도 $ATTEMPT/2" || true
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/rerun" || {
            gh issue comment 15 --repo "$GITHUB_REPOSITORY" --body "@lui020913 자동 재실행 요청 실패 · 수동 확인 필요" || true
            exit 1
          }
