name: Actual mobile alignment proof (NO DEPLOY)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/focused-mobile-alignment-proof.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: focused-mobile-alignment-proof
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        width: [375, 390, 430]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: '13aff9033f73b0110f714e3dc8d830a2c998b417'
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node candidate/frontend/scripts/check-production-overlay.mjs
      - run: node --test candidate/frontend/production/mobile-surface-coordinator.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Compare actual app gaps and native menu alignment
        env:
          W: ${{ matrix.width }}
          TARGET: https://dongjak-walk-safety-preview.pages.dev
        run: |
          mkdir -p alignment-proof
          node --input-type=module <<'JS'
          import {chromium,devices} from '@playwright/test';
          import {readFileSync,writeFileSync} from 'node:fs';
          const width=Number(process.env.W),site=process.env.TARGET;
          const height={375:812,390:844,430:932}[width];
          const full=readFileSync('candidate/frontend/production/dongjak-production-overlay.css','utf8');
          const at=full.indexOf('/* Mobile alignment:');
          if(at<0)throw Error('Missing alignment delta');
          const css=full.slice(at);
          const coordinator=readFileSync('candidate/frontend/production/mobile-surface-coordinator.mjs','utf8');
          const report={mode:'real app with temporary browser-only CSS and reviewed candidate presentation module; not deployed Preview',width,height,screens:[]};
          const save=()=>writeFileSync('alignment-proof/comparison.json',JSON.stringify(report,null,2));
          const marker=async()=>{
            const r=await fetch(site+'/release-source.json?audit='+Date.now(),{signal:AbortSignal.timeout(20000),cache:'no-store'});
            if(!r.ok)throw Error('Release marker HTTP '+r.status);
            const m=await r.json();
            if(m.release_status!=='DEPLOYED_PRODUCTION'||m.public_ui_source_commit!=='777d8cae655973815e694426ec560536cd116744'||m.public_ui_overlay_sha256!=='6fef095abbcfde431b26b648a2763cef3c27820548bc10b87a7e4fa2ffb833a5')throw Error('Unexpected baseline; stop');
            return m;
          };
          let browser;
          try{
            report.baseline=await marker();save();
            browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({...devices['Pixel 7'],viewport:{width,height},colorScheme:'light',locale:'ko-KR'});
            const page=await ctx.newPage();
            await page.goto(site+'/',{waitUntil:'domcontentloaded',timeout:60000});
            await page.locator('#map').waitFor({state:'visible',timeout:60000});
            await page.locator('#map-startup-overlay').waitFor({state:'hidden',timeout:60000});
            const tour=page.locator('#dj860-onboarding');
            if(await tour.isVisible()){
              await tour.locator('[data-dj860-action="skip"]').click({timeout:30000});
              await tour.waitFor({state:'hidden',timeout:15000});
            }
            const later=page.locator('#dj-browser-webapp-tip .dj-webapp-tip-later');
            if(await later.isVisible())await later.click({timeout:15000});
            if(await page.locator('#app').getAttribute('data-theme')!=='light')throw Error('Unexpected theme');
            for(const [tab,panel] of [['route','route-panel'],['participate','participation-panel'],['mine','mine-panel'],['news','news-panel']]){
              const entry={tab,panel};report.screens.push(entry);let injected;
              try{
                await page.locator('#bottom-nav .nav-tab[data-tab="'+tab+'"]').click({timeout:25000,noWaitAfter:true});
                await page.locator('#'+panel+' .dj-sheet-chrome').waitFor({state:'visible',timeout:25000});
                await page.waitForTimeout(850);
                if(await page.locator('#app').getAttribute('data-tab')!==tab)throw Error('Wrong tab');
                const measure=()=>page.evaluate(id=>{
                  const app=document.getElementById('app'),p=document.getElementById(id),nav=document.getElementById('bottom-nav');
                  const rect=e=>{if(!e)return null;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return {x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom,writingMode:s.writingMode,whiteSpace:s.whiteSpace,wordBreak:s.wordBreak,overflowWrap:s.overflowWrap,display:s.display}};
                  const panel=rect(p),dock=rect(nav);
                  return {panel,dock,gap:dock.y-panel.bottom,dockToken:getComputedStyle(app).getPropertyValue('--dj890-dock-gap').trim(),
                    measuredDockBottom:getComputedStyle(app).getPropertyValue('--dj-user-dock-bottom').trim(),
                    expanded:p.classList.contains('dj871-sheet-expanded'),docWidth:document.documentElement.scrollWidth,viewport:innerWidth,
                    rows:[...p.querySelectorAll('.dj834-settings-group > button')].filter(e=>e.getBoundingClientRect().height>0).map(e=>({action:e.dataset.dj834Action,row:rect(e),icon:rect(e.querySelector('.dj834-setting-icon')),label:rect(e.querySelector('span:nth-child(2)')),chevron:rect(e.querySelector('.dj834-chevron')),text:e.querySelector('span:nth-child(2)')?.textContent})),
                    actions:[...p.querySelectorAll('.route-select-actions > button')].filter(e=>e.getBoundingClientRect().height>0).map(e=>({id:e.id,rect:rect(e),text:e.textContent,scrollWidth:e.scrollWidth,clientWidth:e.clientWidth})),
                  };
                },panel);
                const shot=async filename=>{
                  if(width!==390)return;
                  const ready=await page.evaluate(()=>Promise.race([document.fonts.ready.then(()=>true),new Promise(r=>setTimeout(()=>r(false),25000))]));
                  if(!ready)throw Error('Fonts unavailable; no valid visual capture');
                  await page.screenshot({path:'alignment-proof/'+filename,animations:'disabled',timeout:45000});
                };
                entry.before=await measure();save();await shot(tab+'-before.png');
                injected=await page.addStyleTag({content:css});
                await page.addScriptTag({type:'module',content:coordinator+'\nwindow.__djProofDispose=installMobileSurfaceCoordinator(document,window);'});
                await page.waitForFunction(()=>document.getElementById('app').dataset.djUserSurfaceReady==='1',{timeout:15000});
                await page.waitForTimeout(850);
                entry.after=await measure();save();await shot(tab+'-after.png');
                const a=entry.after;
                if(a.expanded)throw Error('Expected resting sheet');
                if(a.docWidth>a.viewport+1)throw Error('Horizontal overflow');
                if(!a.measuredDockBottom.endsWith('px'))throw Error('Measured dock reference did not apply');
                if(tab==='mine'){
                  if(a.rows.length<4||a.rows.some(r=>!r.chevron||!r.label||r.label.w<40||r.label.writingMode!=='horizontal-tb'))throw Error('Missing or collapsed label');
                  const insets=a.rows.map(r=>r.row.right-r.chevron.right);
                  entry.chevronInsetSpread=Math.max(...insets)-Math.min(...insets);
                  if(entry.chevronInsetSpread>2)throw Error('Chevrons not aligned');
                }
                if(tab==='route'){
                  if(a.actions.length<4||a.actions.some(r=>r.rect.w<43.99||r.rect.h<43.99||r.rect.whiteSpace!=='nowrap'||r.scrollWidth>r.clientWidth+1))throw Error('Route action wraps or clips');
                }
                entry.status='measured';
              }catch(e){entry.status='failed';entry.error=String(e).slice(0,1500);}
              finally{await page.evaluate(()=>{window.__djProofDispose?.();delete window.__djProofDispose;}).catch(()=>{});if(injected)await injected.evaluate(e=>e.remove()).catch(()=>{});save();}
            }
            const measured=report.screens.filter(s=>s.status==='measured');
            report.gaps=measured.map(s=>({tab:s.tab,before:s.before.gap,after:s.after.gap}));
            const gaps=report.gaps.map(s=>s.after);
            report.gapSpread=gaps.length?Math.max(...gaps)-Math.min(...gaps):null;
            report.baselineAfter=await marker();save();
            if(JSON.stringify(report.baseline)!==JSON.stringify(report.baselineAfter))throw Error('Baseline changed');
            if(measured.length!==4||report.gapSpread>2||gaps.some(g=>Math.abs(g-8)>3))throw Error('Actual sheet gaps remain inconsistent or outside target');
          }catch(e){report.error=String(e);save();throw e;}
          finally{await browser?.close();}
          JS
      - name: Verify five screenshot-specific surfaces and More motion (390px)
        if: ${{ !cancelled() && matrix.width == 390 }}
        run: node tests/mobile-surface-audit-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-alignment-${{ matrix.width }}
          path: alignment-proof/
          retention-days: 7
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: ${{ always() && matrix.width == 390 }}
        with:
          name: actual-mobile-surface-proof
          path: mobile-surface-proof/
          retention-days: 7
          if-no-files-found: warn
