name: Acquire fixed numbered metro exits only
on:
  push:
    branches: [fix/static-metro-exits-only-20261128]
    paths: ['scripts/research/acquire-seoul-metro-exits-only.mjs','.github/workflows/acquire-seoul-metro-exits-only.yml']
permissions:
  contents: write
  actions: write
jobs:
  acquire:
    if: github.repository == 'lui020913/dongjak-ui-public-tests' && github.actor == 'lui020913'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node scripts/research/acquire-seoul-metro-exits-only.mjs
      - name: Validate exact static file
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const d=JSON.parse(readFileSync('app/public/data/transport/seoul-station-access-v1.json','utf8'));
          assert.equal(d.schema,1);
          assert.ok(d.elements.length>=500);
          assert.equal(d.counts.exit,d.elements.length);
          assert.ok(d.elements.every(e=>e.type==='node'&&Number.isFinite(e.lon)&&Number.isFinite(e.lat)&&e.tags.ref));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: seoul-fixed-numbered-exits
          path: app/public/data/transport/seoul-station-access-v1.json
      - name: Commit only validated exit data to candidate
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/fix/static-metro-exits-only-20261128"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/public/data/transport/seoul-station-access-v1.json
          git commit -m 'Pin validated numbered metro entrance coordinates'
          git push origin HEAD:refs/heads/fix/static-metro-exits-only-20261128
      - name: Request protected source CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run public-app-pr.yml --ref fix/static-metro-exits-only-20261128
