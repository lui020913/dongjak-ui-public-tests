name: Dongjak blocker source consistency review
on:
  pull_request:
    paths:
      - 'scripts/research/dongjak_blocker_source_consistency.py'
      - '.github/workflows/dongjak-blocker-source-consistency.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: dongjak-blocker-source-consistency-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'preview/road-surface-geometry-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install shapely==2.1.2 pyproj==3.7.2
      - uses: actions/download-artifact@v4
        with:
          name: dongjak-residual-source-evidence
          path: source-evidence
          run-id: 45769852219
          github-token: ${{ github.token }}
      - run: python scripts/research/dongjak_blocker_source_consistency.py source-evidence blocker-review
      - uses: actions/upload-artifact@v4
        with:
          name: dongjak-blocker-source-consistency
          path: blocker-review/
          retention-days: 14
          if-no-files-found: error
