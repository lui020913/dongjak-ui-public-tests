name: Acquire official SeoulPlan redevelopment polygons
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/research/fetch_seoulplan_redevelopment.py'
      - '.github/workflows/seoulplan-redevelopment-source.yml'
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'shapely==2.1.2' 'pyproj==3.7.2' 'pyshp==2.3.1' 'playwright==1.56.0'
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/research/fetch_seoulplan_redevelopment.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seoulplan-dongjak-official-spatial-review
          path: audit-redevelopment-output/
          retention-days: 14
