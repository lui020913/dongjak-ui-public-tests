name: Public frontend UI workbench CI (NO DEPLOY)
on:
  workflow_dispatch:
    inputs:
      device:
        description: Development-only device group (all for full public regression)
        type: choice
        options: [all, mobile, tablet, desktop, shared]
        default: all
      viewport:
        description: Optional test title width filter, e.g. 390 or 1440
        type: string
        required: false
  push:
    branches:
      - 'public/frontend-*'
    paths:
      - 'frontend/**'
      - '.github/workflows/public-frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/public-frontend-ci.yml'

permissions:
  contents: read

concurrency:
  group: public-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: UI check (${{ matrix.device }})
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.device != 'all' && format('["{0}"]', inputs.device) || '["mobile","tablet","desktop","shared"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install public dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Build public UI preview
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run responsive and interaction tests
        env:
          DEVICE_GROUP: ${{ matrix.device }}
          VIEWPORT_FILTER: ${{ inputs.viewport }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$VIEWPORT_FILTER" ]]; then
            [[ "$VIEWPORT_FILTER" =~ ^[0-9]{3,4}$ ]] || { echo "Invalid viewport"; exit 1; }
          fi
          case "$DEVICE_GROUP" in
            mobile)  pattern='mobile' ;;
            tablet)  pattern='tablet' ;;
            desktop) pattern='desktop|pc-' ;;
            shared)  pattern='mobile|tablet|desktop|pc-'; args+=(--grep-invert "$pattern"); pattern='.*' ;;
            *) exit 1 ;;
          esac
          if [[ -n "$VIEWPORT_FILTER" ]]; then
            pattern="(?=.*($pattern))(?=.*$VIEWPORT_FILTER)"
          fi
          npx playwright test --grep "$pattern" "${args[@]}"
      - name: Save anonymous UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-frontend-viewport-screenshots-${{ matrix.device }}
          path: frontend/visual-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload failure diagnostics only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-frontend-playwright-${{ matrix.device }}
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 3
