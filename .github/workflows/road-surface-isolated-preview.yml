name: Road surface isolated visual preview
on:
  pull_request:
    paths:
      - 'scripts/research/road-surface-preview.html'
      - 'scripts/research/dongjak_road_surface_preview.py'
      - 'scripts/research/package_final_road_overlays.py'
      - '.github/workflows/road-surface-isolated-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install shapely==2.1.2 pyproj==3.7.2 mapbox-vector-tile==2.2.0
      - name: Download exact completed corridor and overlay review
        uses: actions/download-artifact@v4
        with:
          name: dongjak-exact-free-space-review
          path: reviewed
          run-id: 45768516164
          github-token: ${{ github.token }}
      - name: Download exact completed visual comparison
        uses: actions/download-artifact@v4
        with:
          name: dongjak-final-isolated-visual-preview
          path: road-preview-dist
          run-id: 45763031345
          github-token: ${{ github.token }}
      - name: Download exact hybrid geometry review
        uses: actions/download-artifact@v4
        with:
          name: dongjak-hybrid-road-display-review
          path: hybrid-review
          run-id: 45771682292
          github-token: ${{ github.token }}
      - name: Download campus review
        uses: actions/download-artifact@v4
        with:
          name: dongjak-campus-road-review
          path: campus-review
          run-id: 45771337301
          github-token: ${{ github.token }}
      - name: Validate provenance and package reviewed overlay comparisons
        run: |
          set -euo pipefail
          python scripts/research/package_final_road_overlays.py reviewed/exact-review reviewed/exact-alignment road-preview-dist
          cp reviewed/exact-review/candidate-surfaces.geojson road-preview-dist/corridor-surfaces.geojson
          cp reviewed/exact-review/candidate-centers.geojson road-preview-dist/corridor-centers.geojson
          cp reviewed/exact-review/unresolved-links.geojson road-preview-dist/corridor-unresolved.geojson
          cp reviewed/exact-review/summary.json road-preview-dist/corridor-summary.json
          cp reviewed/exact-alignment/summary.json road-preview-dist/alignment-summary.json
          cp hybrid-review/hybrid-road-surfaces.geojson hybrid-review/hybrid-summary.json campus-review/campus-summary.json road-preview-dist/
          jq -e '.counts.baseline_accepted==4202 and .counts.reviewed_accepted==7852 and .unresolved_source_count==419' road-preview-dist/hybrid-summary.json >/dev/null
          jq -e '.road_links==448 and .counts.accepted_clear==401 and .counts.unresolved==47' road-preview-dist/campus-summary.json >/dev/null
          cp scripts/research/road-surface-preview.html road-preview-dist/index.html
          python - <<'PY'
          import json,os,pathlib,re
          p=pathlib.Path('road-preview-dist')
          m=json.loads((p/'manifest.json').read_text())
          assert m['preview'] and m['building_count']>0
          assert json.loads((p/'corridor-summary.json').read_text())['candidate_links']==7852
          m['review_source_commit']=m['source_commit']
          m['review_run_id']=45768516164
          m['source_commit']=os.environ['GITHUB_SHA']
          (p/'manifest.json').write_text(json.dumps(m,ensure_ascii=False))
          # Split oversized GeoJSON by whole features, preserving order and properties.
          # Keep each published file below the Pages per-asset limit with headroom.
          limit=8*1024*1024
          chunks={}
          for f in sorted(p.rglob('*.geojson')):
              if f.stat().st_size<limit:continue
              original=json.loads(f.read_text())
              assert original['type']=='FeatureCollection',f
              features=original['features']
              prefix=b'{"type":"FeatureCollection","features":['
              suffix=b']}'
              parts=[];batch=[];size=len(prefix)+len(suffix)
              def flush():
                  if not batch:return
                  target=f.with_name(f.stem+'.part-'+str(len(parts)+1).zfill(3)+'.geojson')
                  target.write_bytes(prefix+b','.join(batch)+suffix)
                  assert target.stat().st_size<limit,target
                  parts.append(target.relative_to(p).as_posix())
              for feature in features:
                  b=json.dumps(feature,ensure_ascii=False,separators=(',',':')).encode('utf-8')
                  assert len(b)+len(prefix)+len(suffix)<limit,('oversized single feature',f)
                  if size+len(b)+1>=limit:
                      flush();batch=[];size=len(prefix)+len(suffix)
                  size+=len(b)+(1 if batch else 0);batch.append(b)
              flush()
              check=[g for part in parts for g in json.loads((p/part).read_text())['features']]
              assert check==features,('geometry loss',f)
              chunks[f.relative_to(p).as_posix()]={'parts':parts,'count':len(features)}
              f.unlink()
              print('GEOJSON_SPLIT',f,len(features),len(parts))
          (p/'geojson-chunks.json').write_text(json.dumps(chunks,ensure_ascii=False))
          oversized=[(str(f),f.stat().st_size) for f in p.rglob('*') if f.is_file() and f.stat().st_size>=25*1024*1024]
          assert not oversized,oversized
          inline=re.findall(r'<script>([\s\S]*?)</script>',(p/'index.html').read_text())
          assert len(inline)==1
          pathlib.Path('/tmp/road-preview-check.js').write_text(inline[0])
          PY
          node --check /tmp/road-preview-check.js
          jq -e 'length==9' road-preview-dist/overlay-manifest.json >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: road-surface-visual-preview
          path: road-preview-dist/
          retention-days: 14
          if-no-files-found: error
