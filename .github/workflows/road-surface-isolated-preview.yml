name: Road surface isolated visual preview
on:
  pull_request:
    paths:
      - 'scripts/research/road-surface-preview.html'
      - 'scripts/research/dongjak_road_surface_preview.py'
      - 'scripts/research/package_final_road_overlays.py'
      - '.github/workflows/road-surface-isolated-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install shapely==2.1.2 pyproj==3.7.2 mapbox-vector-tile==2.2.0
      - name: Download exact completed corridor and overlay review
        uses: actions/download-artifact@v4
        with:
          name: dongjak-final-corridor-and-overlay-review
          path: reviewed
          run-id: 45763031345
          github-token: ${{ github.token }}
      - name: Download exact completed visual comparison
        uses: actions/download-artifact@v4
        with:
          name: dongjak-final-isolated-visual-preview
          path: road-preview-dist
          run-id: 45763031345
          github-token: ${{ github.token }}
      - name: Validate provenance and package reviewed overlay comparisons
        run: |
          set -euo pipefail
          python scripts/research/package_final_road_overlays.py reviewed/final-review reviewed/final-alignment road-preview-dist
          cp scripts/research/road-surface-preview.html road-preview-dist/index.html
          python - <<'PY'
          import json,os,pathlib,re
          p=pathlib.Path('road-preview-dist')
          m=json.loads((p/'manifest.json').read_text())
          assert m['preview'] and m['building_count']>0
          assert json.loads((p/'corridor-summary.json').read_text())['candidate_links']==7845
          m['review_source_commit']=m['source_commit']
          m['review_run_id']=45763031345
          m['source_commit']=os.environ['GITHUB_SHA']
          (p/'manifest.json').write_text(json.dumps(m,ensure_ascii=False))
          assert all(f.stat().st_size<25*1024*1024 for f in p.rglob('*') if f.is_file())
          inline=re.findall(r'<script>([\s\S]*?)</script>',(p/'index.html').read_text())
          assert len(inline)==1
          pathlib.Path('/tmp/road-preview-check.js').write_text(inline[0])
          PY
          node --check /tmp/road-preview-check.js
          jq -e 'length==9' road-preview-dist/overlay-manifest.json >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: road-surface-visual-preview
          path: road-preview-dist/
          retention-days: 14
          if-no-files-found: error
  deploy-preview:
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'preview/road-surface-geometry-20261126'
    runs-on: ubuntu-latest
    environment: public-cloudflare-preview
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: road-surface-visual-preview
          path: road-preview-dist
      - name: Deploy isolated branch only and verify production unchanged
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/dongjak-walk-safety-preview"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS -H "$auth" "$api" | jq -e '.success==true and .result.production_branch=="main"' >/dev/null
          before="$(curl -fsS -H "$auth" "$api/deployments?env=production&per_page=1" | jq -er '.result[0].id')"
          npx --yes wrangler@4 pages deploy road-preview-dist --project-name=dongjak-walk-safety-preview --branch=road-surface-geometry-preview --commit-hash="$GITHUB_SHA"
          after="$(curl -fsS -H "$auth" "$api/deployments?env=production&per_page=1" | jq -er '.result[0].id')"
          test "$before" = "$after"
          url="https://road-surface-geometry-preview.dongjak-walk-safety-preview.pages.dev"
          for i in 1 2 3 4 5 6; do
            if curl -fsSL "$url/manifest.json?run=$GITHUB_RUN_ID" | jq -e --arg sha "$GITHUB_SHA" '.preview==true and .source_commit==$sha and .building_count>0' >/dev/null;then
              echo "ROAD_PREVIEW_URL=$url";exit 0
            fi
            sleep 5
          done
          exit 1
