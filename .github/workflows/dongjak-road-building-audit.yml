name: Dongjak road-building geometry audit
on:
  pull_request:
    paths:
      - 'scripts/research/dongjak_road_building_audit.py'
      - 'scripts/research/dongjak_road_link_corroboration.py'
      - 'scripts/research/dongjak_native_vector_audit.py'
      - '.github/workflows/dongjak-road-building-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spatial-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install shapely==2.1.2 pyproj==3.7.2
      - name: Run geometric regression
        run: |
          python - <<'PY'
          from shapely.geometry import box
          from scripts.research.dongjak_road_building_audit import clip_candidate
          building=box(0,0,10,10)
          road=box(4,-5,6,15)
          result, overlap=clip_candidate(building,[road])
          assert abs(overlap.area-20)<1e-9
          assert abs(result.area-80)<1e-9
          assert result.intersection(road).area==0
          assert result.geom_type=='MultiPolygon'
          result, overlap=clip_candidate(building,[box(10,0,11,10)])
          assert overlap.area==0 and result.equals(building)
          PY
      - run: python scripts/research/dongjak_road_building_audit.py road-building-review
      - uses: actions/upload-artifact@v4
        with:
          name: dongjak-road-building-overlap-review
          path: road-building-review/
          retention-days: 14
          if-no-files-found: error

  independent-source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install shapely==2.1.2 pyproj==3.7.2
      - run: python scripts/research/dongjak_road_link_corroboration.py road-link-review
      - uses: actions/upload-artifact@v4
        with:
          name: dongjak-independent-road-link-review
          path: road-link-review/
          retention-days: 14
          if-no-files-found: error

  native-basemap-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install shapely==2.1.2 pyproj==3.7.2 mapbox-vector-tile==2.2.0
      - run: python scripts/research/dongjak_native_vector_audit.py native-vector-review
      - uses: actions/upload-artifact@v4
        with:
          name: dongjak-native-vector-review
          path: native-vector-review/
          retention-days: 14
          if-no-files-found: error
