name: Mobile-only release — Preview, phone QA and protected Production
run-name: Mobile-only release source=\${{ github.sha }}
on:
  push:
    branches: [main]
    paths:
      - 'release/mobile-first-overhaul-request.json'
permissions:
  contents: read
  actions: read
concurrency:
  group: mobile-only-release
  cancel-in-progress: false

jobs:
  build:
    if: github.actor == 'lui020913' && github.repository == 'lui020913/dongjak-ui-public-tests' && github.ref == 'refs/heads/main'
    name: Build exact source with mobile-only app gate
    runs-on: ubuntu-24.04
    environment: public-source-build
    timeout-minutes: 65
    outputs:
      source_sha: \${{ steps.build.outputs.source_sha }}
      app_version: \${{ steps.build.outputs.app_version }}
      public_sha: \${{ steps.build.outputs.public_sha }}
      css_sha: \${{ steps.build.outputs.css_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate mobile-only overlay and device gate
        run: |
          set -euo pipefail
          node frontend/scripts/verify-mobile-first-overhaul.mjs
          node --test frontend/production/mobile-first-overhaul.test.mjs tests/mobile-only-gate.test.mjs
          node --check scripts/apply-mobile-only-gate.mjs
          node --check scripts/run-mobile-regressions.mjs
      - name: Fetch, mobile-test, build and seal exact source
        id: build
        env:
          GH_TOKEN: \${{ secrets.PRIVATE_SOURCE_READ_TOKEN }}
          PRIVATE_SOURCE_READ_TOKEN: \${{ secrets.PRIVATE_SOURCE_READ_TOKEN }}
          RELEASE_BUNDLE_KEY: \${{ secrets.RELEASE_BUNDLE_KEY }}
          VITE_SUPABASE_URL: \${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: \${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: bash scripts/build-mobile-first-overhaul.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-first-overhaul-sealed-\${{ steps.build.outputs.source_sha }}
          path: \${{ runner.temp }}/mobile-overhaul.sealed
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Remove sealed build after upload
        if: always()
        run: rm -f "$RUNNER_TEMP/mobile-overhaul.sealed" "$RUNNER_TEMP/mobile-overhaul.tar.gz"

  preview:
    needs: build
    if: needs.build.result == 'success'
    name: Deploy isolated Preview
    runs-on: ubuntu-24.04
    environment: public-cloudflare-preview
    timeout-minutes: 30
    outputs:
      preview_url: \${{ steps.deploy.outputs.preview_url }}
    permissions:
      contents: read
    env:
      MOBILE_SOURCE_SHA: \${{ needs.build.outputs.source_sha }}
      MOBILE_APP_VERSION: \${{ needs.build.outputs.app_version }}
      MOBILE_PUBLIC_SHA: \${{ needs.build.outputs.public_sha }}
      MOBILE_CSS_SHA: \${{ needs.build.outputs.css_sha }}
      CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RELEASE_BUNDLE_KEY: \${{ secrets.RELEASE_BUNDLE_KEY }}
      GH_TOKEN: \${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: mobile-first-overhaul-sealed-\${{ needs.build.outputs.source_sha }}
          path: \${{ runner.temp }}
      - name: Deploy exact candidate to isolated Preview only
        id: deploy
        run: bash scripts/deploy-mobile-first-overhaul-preview.sh
      - name: Remove sealed artifact
        if: always()
        run: rm -f "$RUNNER_TEMP/mobile-overhaul.sealed"

  mobile-qa:
    needs: [build, preview]
    if: needs.preview.result == 'success'
    name: Phone-only browser QA — iPhone and Android widths
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 30
    env:
      DONGJAK_TARGET_URL: \${{ needs.preview.outputs.preview_url }}/
      DONGJAK_EXPECTED_SOURCE_SHA: \${{ needs.build.outputs.source_sha }}
      SOURCE_SHA: \${{ needs.build.outputs.source_sha }}
      PUBLIC_SHA: \${{ needs.build.outputs.public_sha }}
      CSS_SHA: \${{ needs.build.outputs.css_sha }}
      APP_VERSION: \${{ needs.build.outputs.app_version }}
      BUILD_RUN: \${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright test package
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-audit --no-fund
      - name: Verify exact mobile Preview provenance
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 "$DONGJAK_TARGET_URL/release-source.json?mobile-qa=$GITHUB_RUN_ID" |
            jq -e --arg source "$SOURCE_SHA" --arg public "$PUBLIC_SHA" --arg css "$CSS_SHA" --arg version "$APP_VERSION" --arg build "$BUILD_RUN" \
              '.source_commit==$source and .public_ui_source_commit==$public and .public_ui_overlay_sha256==$css and .application_version==$version and (.build_run|tostring)==$build and .release_status=="CANDIDATE_PREVIEW_NOT_PRODUCTION"' >/dev/null
          node scripts/verify-release-source.mjs
      - name: Run mobile phone viewports only (375, 390 and 430 CSS px)
        run: npx playwright test --config=playwright.v911-remote.config.mjs --project=mobile375 --project=mobile390 --project=mobile430
      - name: Confirm tested Preview still matches the exact candidate
        if: always()
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 "$DONGJAK_TARGET_URL/release-source.json?mobile-post=$GITHUB_RUN_ID" |
            jq -e --arg source "$SOURCE_SHA" --arg public "$PUBLIC_SHA" --arg css "$CSS_SHA" --arg version "$APP_VERSION" --arg build "$BUILD_RUN" \
              '.source_commit==$source and .public_ui_source_commit==$public and .public_ui_overlay_sha256==$css and .application_version==$version and (.build_run|tostring)==$build and .release_status=="CANDIDATE_PREVIEW_NOT_PRODUCTION"' >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-only-phone-qa-\${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  production:
    needs: [build, preview, mobile-qa]
    if: needs.mobile-qa.result == 'success'
    name: Promote the exact mobile-tested build to Production
    runs-on: ubuntu-24.04
    environment: public-cloudflare-production
    timeout-minutes: 35
    env:
      SOURCE_SHA: \${{ needs.build.outputs.source_sha }}
      PUBLIC_SHA: \${{ needs.build.outputs.public_sha }}
      CSS_SHA: \${{ needs.build.outputs.css_sha }}
      APP_VERSION: \${{ needs.build.outputs.app_version }}
      BUILD_RUN: \${{ github.run_id }}
      PAGES_PROJECT: dongjak-walk-safety-preview
      PRODUCTION_URL: https://dongjak-walk-safety-preview.pages.dev
      CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RELEASE_BUNDLE_KEY: \${{ secrets.RELEASE_BUNDLE_KEY }}
      PRIVATE_SOURCE_READ_TOKEN: \${{ secrets.PRIVATE_SOURCE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: mobile-first-overhaul-sealed-\${{ needs.build.outputs.source_sha }}
          path: \${{ runner.temp }}/encrypted
      - name: Decrypt the exact mobile-tested artifact
        run: |
          set -euo pipefail
          umask 077
          node scripts/seal-private-release.mjs open "$RUNNER_TEMP/encrypted/mobile-overhaul.sealed" "$RUNNER_TEMP/mobile-overhaul.tar.gz" "$SOURCE_SHA"
          mkdir -m 700 "$RUNNER_TEMP/release"
          tar -xzf "$RUNNER_TEMP/mobile-overhaul.tar.gz" -C "$RUNNER_TEMP/release"
          rm -f "$RUNNER_TEMP/mobile-overhaul.tar.gz"
          jq -e --arg source "$SOURCE_SHA" --arg public "$PUBLIC_SHA" --arg css "$CSS_SHA" --arg version "$APP_VERSION" --arg build "$BUILD_RUN" \
            '.source_commit==$source and .public_ui_source_commit==$public and .public_ui_overlay_sha256==$css and .application_version==$version and (.build_run|tostring)==$build and .release_status=="CANDIDATE_PREVIEW_NOT_PRODUCTION"' \
            "$RUNNER_TEMP/release/dist/release-source.json" >/dev/null
      - name: Reconfirm archived source ref and exact source SHA
        env:
          GH_TOKEN: \${{ secrets.PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          set -euo pipefail
          source_ref="$(jq -er '.source_ref' release/mobile-first-overhaul-source.json)"
          actual="$(gh api "repos/lui020913/dongjak-safety-map/git/ref/heads/$source_ref" --jq .object.sha)"
          test "$actual" = "$SOURCE_SHA"
      - name: Deploy exact tested artifact to Production with guarded rollback
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT"
          cf(){ curl -fsS --max-time 45 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$@"; }
          cf "$api" > "$RUNNER_TEMP/project-before.json"
          jq -e '.success==true and .result.production_branch=="main" and (.result.deployment_configs.production.d1_databases.SEOUL_FACILITIES_DB.id|type=="string") and (.result.deployment_configs.production.ai_bindings.AI!=null)' "$RUNNER_TEMP/project-before.json" >/dev/null
          jq -S -c '.result.deployment_configs.production|{d1_databases,ai_bindings,env_vars:(.env_vars|with_entries(.value={type:.value.type}))}' "$RUNNER_TEMP/project-before.json" > "$RUNNER_TEMP/bindings-before"
          previous="$(cf "$api/deployments?env=production&per_page=1" | jq -er '.result[0].id')"
          curl -fsSL --max-time 30 "$PRODUCTION_URL/release-source.json?before=$GITHUB_RUN_ID" |
            jq -e '.release_status=="DEPLOYED_PRODUCTION" and (.source_commit|test("^[a-f0-9]{40}$"))' >/dev/null
          cd "$RUNNER_TEMP/release"
          jq '.release_status="DEPLOYED_PRODUCTION"' dist/release-source.json > "$RUNNER_TEMP/release-marker.json"
          cp "$RUNNER_TEMP/release-marker.json" dist/release-source.json
          message="Mobile-only $APP_VERSION source=$SOURCE_SHA public=$PUBLIC_SHA run=$GITHUB_RUN_ID"
          rollback(){
            code=$?
            if [ "$code" -ne 0 ]; then
              current_message="$(cf "$api/deployments?env=production&per_page=1" | jq -r '.result[0].deployment_trigger.metadata.commit_message//""' || true)"
              if [ "$current_message" = "$message" ]; then
                cf -X POST "$api/deployments/$previous/rollback" | jq -e '.success==true' >/dev/null || echo '::error::Guarded rollback failed; manual Cloudflare inspection is required.'
              fi
            fi
            exit "$code"
          }
          trap rollback EXIT
          npx --yes wrangler@4 pages deploy dist --project-name="$PAGES_PROJECT" --branch=main --commit-hash="$SOURCE_SHA" --commit-message="$message" > "$RUNNER_TEMP/production-deploy.log" 2>&1
          verified=0
          for n in $(seq 1 15); do
            if curl -fsSL --max-time 25 "$PRODUCTION_URL/release-source.json?after=$GITHUB_RUN_ID-$n" |
              jq -e --arg source "$SOURCE_SHA" --arg public "$PUBLIC_SHA" --arg css "$CSS_SHA" --arg version "$APP_VERSION" --arg build "$BUILD_RUN" \
                '.source_commit==$source and .public_ui_source_commit==$public and .public_ui_overlay_sha256==$css and .application_version==$version and (.build_run|tostring)==$build and .release_status=="DEPLOYED_PRODUCTION"' >/dev/null; then
              verified=1
              break
            fi
            sleep 5
          done
          test "$verified" = 1
          curl -fsSL --max-time 30 "$PRODUCTION_URL/version.json" | jq -e --arg version "$APP_VERSION" '.version==$version' >/dev/null
          curl -fsSL --max-time 30 "$PRODUCTION_URL/api/transport/status" | jq -e '.bus==true and .subway==true' >/dev/null
          curl -fsSL --max-time 30 "$PRODUCTION_URL/api/seoul-facilities?limit=1" | jq -e '.ok==true and .configured==true and (.places|length)>0' >/dev/null
          cf "$api" | jq -S -c '.result.deployment_configs.production|{d1_databases,ai_bindings,env_vars:(.env_vars|with_entries(.value={type:.value.type}))}' > "$RUNNER_TEMP/bindings-after"
          cmp -s "$RUNNER_TEMP/bindings-before" "$RUNNER_TEMP/bindings-after"
          trap - EXIT
          echo "Mobile-only Production promotion verified for $SOURCE_SHA." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove decrypted release and private diagnostics
        if: always()
        run: rm -rf "$RUNNER_TEMP/encrypted" "$RUNNER_TEMP/release" "$RUNNER_TEMP/mobile-overhaul.tar.gz" "$RUNNER_TEMP/release-marker.json" "$RUNNER_TEMP/project-before.json" "$RUNNER_TEMP/bindings-before" "$RUNNER_TEMP/bindings-after" "$RUNNER_TEMP/production-deploy.log"
