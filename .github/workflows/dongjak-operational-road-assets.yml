name: Dongjak operational road display asset preparation
on:
  pull_request:
    paths:
      - 'scripts/research/package_operational_road_display.py'
      - '.github/workflows/dongjak-operational-road-assets.yml'
permissions:
  contents: read
  actions: read
jobs:
  package:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'preview/road-surface-geometry-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install shapely==2.1.2 pyproj==3.7.2
      - uses: actions/download-artifact@v4
        with:
          name: dongjak-exact-free-space-review
          path: reviewed
          run-id: 45768516164
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: dongjak-hybrid-road-display-review
          path: hybrid-review
          run-id: 45771682292
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: dongjak-native-id-eligibility
          path: native-id-review
          run-id: 45774343937
          github-token: ${{ github.token }}
      - run: python scripts/research/package_operational_road_display.py hybrid-review reviewed/exact-review reviewed/exact-alignment native-id-review operational-road-assets
      - uses: actions/upload-artifact@v4
        with:
          name: dongjak-operational-road-display-assets
          path: operational-road-assets/
          retention-days: 30
          if-no-files-found: error
