name: Sangdo1 bocha Preview browser smoke
on:
  push:
    branches: [main]
    paths: ['release/sangdo1-bocha-ui-request.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: sangdo1-bocha-browser-smoke
  cancel-in-progress: false
jobs:
  ui:
    if: github.repository == 'lui020913/dongjak-ui-public-tests' && github.actor == 'lui020913'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Wait for the exact isolated Preview (bounded)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync,readFileSync} from 'node:fs';
          const request=JSON.parse(readFileSync('release/sangdo1-bocha-ui-request.json','utf8'));
          const {source_sha:sha,build_run:run}=request;
          if(!/^[a-f0-9]{40}$/.test(sha)||!/^\\d+$/.test(String(run)))throw new Error('Invalid exact Preview pin');
          const url='https://sangdo1-bocha-preview.dongjak-walk-safety-preview.pages.dev/';
          let verified=false;
          for(let n=1;n<=24;n++){
            try{
              const response=await fetch(url+'release-source.json?check='+n,{signal:AbortSignal.timeout(12000)});
              if(response.ok){
                const marker=await response.json();
                if(marker.source_commit===sha&&String(marker.build_run)===String(run)&&marker.application_version==='8.9.15'&&marker.release_status==='CANDIDATE_PREVIEW_NOT_PRODUCTION'){verified=true;break;}
              }
            }catch{}
            if(n<24)await new Promise(resolve=>setTimeout(resolve,5000));
          }
          if(!verified)throw new Error('Exact Preview unavailable');
          appendFileSync(process.env.GITHUB_ENV,'DONGJAK_TARGET_URL='+url+'\\nDONGJAK_EXPECTED_SOURCE_SHA='+sha+'\\nDONGJAK_EXPECTED_BUILD_RUN='+run+'\\n');
          NODE
      - name: Install pinned public test package
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-audit --no-fund
      - name: Test only the new safety layer on mobile tablet and PC
        run: npx playwright test --config=playwright.sangdo1-bocha.config.mjs --project=mobile390 --project=tablet820 --project=pc1280
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sangdo1-bocha-browser-smoke
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3
