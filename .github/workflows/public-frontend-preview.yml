name: Public frontend LIVE preview - GitHub Pages (NO CLOUDFLARE)
run-name: Public UI preview build from ${{ github.sha }}

on:
  push:
    branches:
      - public/frontend-foundation-20261117
    paths:
      - 'frontend/**'
      - '.github/workflows/public-frontend-preview.yml'

permissions:
  contents: read

concurrency:
  group: public-frontend-github-pages-preview
  cancel-in-progress: true

jobs:
  build:
    name: Test and package public UI
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install public dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript and public safety rules
        run: npm run check
      - name: Build UI at the repository Pages subpath
        env:
          DONGJAK_PUBLIC_BASE: /dongjak-ui-public-tests/
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify public UI before publishing
        run: npm run test:e2e
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload tested static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy-preview:
    name: Publish independent public UI preview
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy UI workbench (NOT Cloudflare Production)
        id: deployment
        uses: actions/deploy-pages@v4
