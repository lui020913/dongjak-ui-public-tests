<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상도1동 제도적 보호 공백 · 2지표 연구지도</title>
<link href="https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#f4f6f8}
*{box-sizing:border-box}body{margin:0;background:#e8eced}#map{position:fixed;inset:0}
header{position:absolute;z-index:20;top:12px;left:12px;width:min(450px,calc(100% - 24px));padding:16px;background:rgba(24,28,32,.96);border-radius:17px;box-shadow:0 7px 24px #0004}
h1{font-size:17px;margin:0 0 5px;line-height:1.4;letter-spacing:-.3px}
p{margin:4px 0;font-size:12px;line-height:1.6;color:#d1d8db}
nav{display:flex;gap:5px;margin:11px 0 14px}
nav button{min-height:36px;flex:1;background:#393f43;border:1px solid #596168;color:#e1e6e8;border-radius:9px;font:inherit;font-size:12px;cursor:pointer}
nav button[aria-pressed=true]{background:#f1f4f5;color:#162327;font-weight:750}
.gradient{width:100%;height:15px;border-radius:6px;background:linear-gradient(90deg,#4C948B 0%,#82AB94 25%,#DBC576 50%,#DDA263 75%,#CB6563 100%);border:1px solid #ffffff44}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:#e1e5e6;margin:5px 0 9px}
.legend-bottom{display:flex;align-items:center;gap:7px;color:#d6dcdf;font-size:11px}
.legend-bottom i{display:inline-block;background:#A3AAB4;width:16px;height:11px;border-radius:3px}
#status{margin-top:10px;font-size:11px;color:#d2d9db}
#detail{position:absolute;z-index:20;bottom:18px;left:12px;width:min(450px,calc(100% - 24px));padding:14px;border-radius:14px;background:#171b1feF;box-shadow:0 8px 28px #0005;display:none}
#detail.visible{display:block}#detail h2{font-size:15px;line-height:1.3;margin:0 0 8px}
#detail dl{display:grid;grid-template-columns:130px 1fr;gap:6px;font-size:12px;margin:0}
#detail dt{color:#adb7bb}#detail dd{margin:0;min-width:0;overflow-wrap:anywhere}
.maplibregl-ctrl-top-right{top:auto;bottom:12px}
#detail button{position:absolute;right:12px;top:10px;border:0;border-radius:7px;background:#434b50;color:#fff;padding:3px 9px;cursor:pointer}
@media(max-width:620px){header{padding:13px}h1{font-size:15px}#detail{bottom:62px}#detail dl{grid-template-columns:100px 1fr}}
</style>
</head>
<body>
<div id="map" role="application" aria-label="상도1동 도로별 제도적 보호 공백 연구용 지도"></div>
<header>
<h1>상도1동 제도적 보호 공백 · 2지표 평가</h1>
<p>2025 등록 보호구역·시설 대표점 + 2026 초등학교 학구도 (50:50 시범, 학구도 미적용 시 거리점수만)</p>
<nav aria-label="지도 평가 종류">
<button data-type="combined" aria-pressed="true">통합 시범점수</button>
<button data-type="child" aria-pressed="false">어린이</button>
<button data-type="elderly" aria-pressed="false">노인</button>
</nav>
<div class="gradient" aria-label="0에서 100점까지 연속 그라데이션"></div>
<div class="ticks"><span>0 작은 공백</span><span>25</span><span>50</span><span>75</span><span>100 매우 큰 공백</span></div>
<div class="legend-bottom"><i></i>회색: 300m 평가 범위 밖 또는 도로형상 결측 (종합평균에서 이 지표 제외)</div>
<div id="status" role="status">도로 데이터를 불러오는 중입니다.</div>
<p>높은 위험점수는 빨간색으로 표시됩니다. 학구는 실제 통학로가 아니며 사고위험·법적 지정 누락 확정값이 아닙니다.</p>
</header>
<aside id="detail" aria-live="polite"><button id="close-detail" aria-label="도로 상세 닫기">닫기</button><h2 id="road-title"></h2><dl id="road-facts"></dl></aside>
<script src="https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.js"></script>
<script>
(()=> {
 const status=document.getElementById('status'), detail=document.getElementById('detail');
 if(!window.maplibregl){status.textContent='지도 라이브러리를 불러오지 못했습니다. 네트워크 환경을 확인해 주세요.';return;}
 const fields={combined:'combined_new_score',child:'child_new_score',elderly:'elderly_new_score'};
 let current='combined';
 const map=new maplibregl.Map({
  container:'map',style:{
   version:8,
   sources:{base:{type:'raster',tiles:['https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png','https://b.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap contributors © CARTO'}},
   layers:[{id:'basemap',type:'raster',source:'base',paint:{'raster-opacity':0.95}}]
  },
  center:[126.954,37.499],zoom:14.1,attributionControl:true
 });
 map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');
 const graded=(field)=>['case',['==',['get',field],null],'#A3AAB4',['interpolate',['linear'],['to-number',['get',field],0],0,'#4C948B',25,'#82AB94',50,'#DBC576',75,'#DDA263',100,'#CB6563']];
 const format=v=>v===null||v===undefined||v===''?'평가 제외 / 미확인':Number.isFinite(Number(v))?Number(v).toFixed(1)+'점':String(v);
 const setRow=(name,value)=>{const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=name;dd.textContent=value;document.getElementById('road-facts').append(dt,dd);};
 document.getElementById('close-detail').addEventListener('click',()=>detail.classList.remove('visible'));
 map.on('load',async()=>{
  try{
   const response=await fetch('/data/protection-zone/sangdo1_policy_gap_2factor_300m_20261122.geojson',{cache:'no-store'});
   if(!response.ok)throw Error('HTTP '+response.status);
   const geo=await response.json();
   if(geo.type!=='FeatureCollection'||geo.metadata?.score_direction!=='risk'||!Array.isArray(geo.features))throw Error('GeoJSON 형식 확인 필요');
   map.addSource('research-roads',{type:'geojson',data:geo});
   map.addLayer({id:'road-outline',type:'line',source:'research-roads',paint:{'line-color':'#ffffff','line-opacity':0.88,'line-width':['interpolate',['linear'],['zoom'],12,3,17,9]}});
   map.addLayer({id:'road-gap',type:'line',source:'research-roads',paint:{'line-color':graded(fields[current]),'line-opacity':0.96,'line-width':['interpolate',['linear'],['zoom'],12,1.6,17,5.5]}});
   map.on('click','road-gap',event=>{
    const p=event.features?.[0]?.properties;if(!p)return;
    document.getElementById('road-title').textContent=(p.road_name||'이름 없는 도로')+' · '+p.segment_id;
    const facts=document.getElementById('road-facts');facts.replaceChildren();
    setRow('선택한 지도 점수',format(p[fields[current]]));
    setRow('어린이',format(p.child_new_score));
    setRow('노인',format(p.elderly_new_score));
    setRow('초등학교 학구도 점수 적용',String(p.school_applied_child)==='true'?'예':'아니요');
    setRow('학교 학구',p.catchment_names||'교차 없음');
    setRow('같은 학교 학구',p.child_school_match_pct===null?'해당 없음':Number(p.child_school_match_pct).toFixed(1)+'%');
    setRow('종합평가 지표 수',String(p.team_average_divisor)+'개');
    detail.classList.add('visible');
   });
   map.on('mouseenter','road-gap',()=>map.getCanvas().style.cursor='pointer');
   map.on('mouseleave','road-gap',()=>map.getCanvas().style.cursor='');
   status.textContent=geo.features.length.toLocaleString('ko-KR')+'개 유효 도로 표시 · 300m 밖은 회색 · 25m 구간 단위';
  }catch(error){status.textContent='지도 자료를 불러오지 못했습니다: '+error.message}
 });
 for(const button of document.querySelectorAll('nav button')){
  button.addEventListener('click',()=>{
   current=button.dataset.type;
   document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
   if(map.getLayer('road-gap'))map.setPaintProperty('road-gap','line-color',graded(fields[current]));
   detail.classList.remove('visible');
  });
 }
})();
</script>
</body></html>
