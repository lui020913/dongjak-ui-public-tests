<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/src/v806-unified-ui.css"><link rel="stylesheet" href="/src/v807-ui-refine.css"><link rel="stylesheet" href="/src/v809-precision-polish.css"><style>html,body,#app{height:100%;margin:0}#app{position:relative;min-height:100vh}.page-panel,#transport-sheet{position:fixed;bottom:84px;left:14px;width:calc(100% - 28px);max-width:640px;border-radius:20px;background:white;padding:15px;box-sizing:border-box;box-shadow:0 10px 40px #0002}[hidden]{display:none!important}#bottom-nav{position:fixed;bottom:0;width:100%;height:72px;background:white;display:flex;justify-content:space-around}.nav-tab{min-width:55px}</style></head><body><div id="app" data-tab="map"><button id="open-route">길찾기 열기</button><button id="open-transport">교통 열기</button><section id="route-panel" class="page-panel" hidden><h2>도보 길찾기</h2><button class="page-dismiss">닫기</button></section><section id="transport-sheet" hidden><h2>지하철역 정보</h2><button id="transport-close">닫기</button></section><nav id="bottom-nav"><button class="nav-tab active" data-tab="map"><span class="nav-icon">▦</span><span>안전지도</span></button><button class="nav-tab" data-tab="route"><span class="nav-icon">↗</span><span>길찾기</span></button></nav></div><script>document.getElementById('open-route').addEventListener('click',()=>document.getElementById('route-panel').hidden=false);document.querySelector('.page-dismiss').addEventListener('click',()=>document.getElementById('route-panel').hidden=true);document.getElementById('open-transport').addEventListener('click',()=>document.getElementById('transport-sheet').hidden=false);document.getElementById('transport-close').addEventListener('click',()=>document.getElementById('transport-sheet').hidden=true);</script><script type="module" src="/src/v806-unified-ui.js"></script><script type="module" src="/src/v809-precision-polish.js"></script></body></html>
