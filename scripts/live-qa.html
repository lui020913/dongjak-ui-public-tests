<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>동작하는 안전지도 · Live QA</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111815;color:#e8f0eb;font:14px system-ui,sans-serif}header{padding:20px 24px;border-bottom:1px solid #354139;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:19px;margin:0;flex:1}main{display:grid;grid-template-columns:minmax(220px,1fr) minmax(240px,1.2fr) minmax(220px,1fr);gap:16px;padding:16px;max-width:1500px;margin:auto}section{background:#1a231e;border:1px solid #354139;border-radius:14px;padding:14px;min-width:0}h2{font-size:15px;margin:0 0 14px}button{color:inherit;background:#28382f;border:1px solid #526359;border-radius:8px;padding:8px 12px;cursor:pointer}button:hover{background:#354b3d}#list{display:grid;gap:8px;max-height:78vh;overflow:auto}#list button{text-align:left;font-size:12px;display:block;line-height:1.4;width:100%}#list button.active{border-color:#6ac291}small{color:#a5b7aa}#screen{position:relative;width:min(100%,390px);margin:auto;background:#101612;min-height:240px;display:grid;place-items:center;border-radius:12px;overflow:hidden}img{display:block;max-width:100%;height:auto;cursor:crosshair}#pin{display:none;position:absolute;width:18px;height:18px;margin:-9px;border:2px solid #fa766d;border-radius:100%;pointer-events:none}input[type=range]{width:100%;accent-color:#6ac291}textarea{width:100%;background:#101612;color:#eee;padding:8px;border:1px solid #526359;border-radius:8px;resize:vertical}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:30vh;overflow:auto;font-size:11px} .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.good{color:#7bda9e}.bad{color:#ff8f86}#timeline{width:100%;height:80px;background:#101612} @media(max-width:800px){main{grid-template-columns:1fr}#list{max-height:35vh}}
</style><header><h1>동작하는 안전지도 · Live QA</h1><span id="state">연결 중</span><button id="pause">다음 장면에서 일시정지</button><button id="resume">재개</button></header>
<main><section><h2>검증 장면</h2><small id="target"></small><p id="progress"></p><div id="list"></div></section>
<section><h2 id="sceneTitle">실시간 화면</h2><div id="screen"><img id="frame" alt="캡처 대기"><span id="pin"></span></div><p class="row"><button id="live">LIVE</button><button id="play">재생</button><label>배속 <select id="speed"><option value=".25">0.25×</option><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option><option value="4">4×</option></select></label><button id="prev">이전</button><button id="next">다음</button><small id="frameNumber"></small></p><input id="seek" type="range" min="1" max="1" value="1"><small>영상 샘플 간격 약 90ms · 브라우저 프레임 측정은 별도</small><p><textarea id="note" rows="3" placeholder="화면을 클릭해 위치를 선택하고 결함을 기록하세요."></textarea></p><button id="report">결함 기록</button><small id="feedback"></small></section>
<section><h2>프레임 타이밍 및 좌표</h2><canvas id="timeline" width="420" height="80"></canvas><p id="stats"></p><pre id="metrics"></pre><h2>오류 및 로그</h2><pre id="errors"></pre></section></main>
<script>
const $=id=>document.getElementById(id),token='__CONTROL_TOKEN__';
let selected=null,follow=true,index=1,snapshot=[],mark=null,lastData=0,times=[],samples=[],playing=false,currentImageId='',currentImageIndex=0;
const get=async url=>{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error(r.status);return r.json()};
const post=async(path,body={})=>{const r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json','X-QA-Token':token},body:JSON.stringify(body)});if(!r.ok)throw Error(r.status);return r.json()};
const lines=async path=>{try{const r=await fetch(path,{cache:'no-store'});if(!r.ok)return [];return (await r.text()).split('\n').flatMap(l=>{try{return [JSON.parse(l)]}catch{return []}})}catch{return []}};
function scene(){return snapshot.find(x=>x.id===selected)}
function drawFrame(){const s=scene();if(!s)return;$('sceneTitle').textContent=s.project+' · '+s.title;$('seek').max=Math.max(1,s.frames);if(follow)index=Math.max(1,s.frames);index=Math.max(1,Math.min(index,Math.max(1,s.frames)));$('seek').value=index;$('frameNumber').textContent=index+' / '+s.frames;
if(s.frames){const url='/frame/'+s.id+'/'+String(index).padStart(6,'0')+'.jpg';if($('frame').getAttribute('src')!==url){$('frame').src=url;currentImageId=s.id;currentImageIndex=index;mark=null;$('pin').style.display='none'}}else{$('frame').removeAttribute('src');currentImageId='';$('frame').alt='영상 캡처 없음 (WebKit은 좌표 기록만 지원)';}
const ft=times[index-1]?.t;const m=ft?samples.find(x=>x.t>=ft):samples.at(-1);$('metrics').textContent=m?JSON.stringify({viewport:m.viewport,frameMs:m.dt,elements:m.nodes.map(n=>({element:n.selector,x:Math.round(n.x),y:Math.round(n.y),w:Math.round(n.w),h:Math.round(n.h),opacity:n.opacity,scroll:n.scroll}))},null,2):'데이터 수집 중';}
async function refresh(){
try{const d=await get('/api/state');snapshot=d.scenes;$('target').textContent=d.target;$('state').textContent=d.result===null?(d.paused?'장면 단위 정지 예약':'검증 중'):(d.result===0?'검증 완료':'실패 또는 중단');$('progress').textContent='완료 '+snapshot.filter(s=>s.status==='passed').length+' · 실패 '+snapshot.filter(s=>['failed','timedOut','interrupted'].includes(s.status)).length+' · 수집 '+snapshot.length;
if(follow||!selected)selected=snapshot.findLast(s=>s.status==='running')?.id||snapshot.at(-1)?.id;
const list=$('list');list.replaceChildren(...snapshot.map(s=>{const b=document.createElement('button');b.textContent=s.status+' · '+s.project+' · '+s.title;b.className=(s.id===selected?'active ':'')+(s.status==='passed'?'good':s.status==='failed'?'bad':'');b.onclick=()=>{selected=s.id;follow=false;playing=false;index=Math.max(1,s.frames);samples=[];times=[];lastData=0;drawFrame()};return b}));
const s=scene();if(!s)return;if(Date.now()-lastData>1800){lastData=Date.now();const id=s.id;const [ms,ts,ev]=await Promise.all(['metrics.ndjson','frame-times.ndjson','events.ndjson'].map(f=>lines('/data/'+id+'/'+f)));if(id===selected){samples=ms;times=ts;$('errors').textContent=[...(s.errors||[]),...ev.slice(-15).map(e=>e.kind+' '+e.value)].join('\n');const dt=ms.map(x=>x.dt).filter(x=>x>0);const slow=dt.filter(x=>x>34).length;$('stats').textContent='rAF '+dt.length+'개 · 34ms 초과 '+slow+'개 (진단용)';const c=$('timeline'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);const tail=dt.slice(-140);tail.forEach((v,i)=>{ctx.fillStyle=v>34?'#ef7468':'#71c69b';ctx.fillRect(i*3,c.height-Math.min(80,v),2,Math.min(80,v));});}}drawFrame();
}catch(e){$('state').textContent='연결 확인 필요'}}
$('live').onclick=()=>{follow=true;playing=false;refresh()};$('play').onclick=()=>{follow=false;playing=!playing;};$('prev').onclick=()=>{follow=false;playing=false;index--;drawFrame()};$('next').onclick=()=>{follow=false;playing=false;index++;drawFrame()};$('seek').oninput=e=>{follow=false;playing=false;index=+e.target.value;drawFrame()};$('pause').onclick=()=>post('pause').then(refresh);$('resume').onclick=()=>post('resume').then(refresh);
$('frame').onclick=e=>{if(!$('frame').naturalWidth)return;follow=false;playing=false;const r=e.currentTarget.getBoundingClientRect(),q=$('screen').getBoundingClientRect();mark={id:currentImageId,frame:currentImageIndex,x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};$('pin').style.left=e.clientX-q.left+'px';$('pin').style.top=e.clientY-q.top+'px';$('pin').style.display='block'};
$('report').onclick=async()=>{if(!mark||!$('note').value.trim()){ $('feedback').textContent='위치와 설명을 입력하세요.';return;}try{await post('report',{...mark,note:$('note').value});$('feedback').textContent='로컬 결함 기록 저장됨';$('note').value=''}catch{$('feedback').textContent='저장 실패'}};
let playbackTimer;function playback(){const speed=Number($('speed').value)||1;const gap=Math.max(16,(times[index]?.t-times[index-1]?.t||90)/speed);if(playing){if(index<(scene()?.frames||0)){index++;drawFrame()}else playing=false;}playbackTimer=setTimeout(playback,gap);}playback();
async function loop(){await refresh();setTimeout(loop,550)}loop();
</script></html>
