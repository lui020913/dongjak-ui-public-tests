<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>동작(動作)하는 안전지도 · 도로 프리뷰</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css"><style>
*{box-sizing:border-box}body{margin:0;background:#edf3ef;color:#203d36;font:15px system-ui,sans-serif}#map{position:absolute;inset:0}.top{position:absolute;top:env(safe-area-inset-top,0px);left:12px;right:12px;padding-top:12px;pointer-events:none}.panel{pointer-events:auto;background:rgba(255,255,255,.95);border:1px solid #d3e0da;border-radius:22px;box-shadow:0 4px 20px #1f463520;padding:12px}.brand{font-weight:800;letter-spacing:-.7px}.badge{font-size:11px;color:#59736a;margin-left:6px}.controls{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}button{font:inherit;font-size:13px;font-weight:650;color:#244b41;background:#edf3ef;border:1px solid #d1ded7;border-radius:18px;padding:9px 12px;cursor:pointer}button[aria-pressed=true]{background:#167f70;color:white;border-color:#167f70}.note{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:12px;line-height:1.5}.legend{display:flex;gap:12px;flex-wrap:wrap}.swatch{display:inline-block;width:12px;height:12px;border:1px solid #aaa;vertical-align:middle;margin-right:4px}.status{color:#59736a;margin-top:7px}.maplibregl-ctrl-bottom-right{bottom:105px}.maplibregl-ctrl-top-right{top:135px}button:focus-visible{outline:2px solid #176e5e}
</style></head><body><div id="map"></div><div class="top"><div class="panel"><div class="brand">동작(動作)하는 안전지도 <span class="badge">도로 표현 실험 · 운영 미반영</span></div><div class="controls"><button id="old" aria-pressed="true">기존 지도</button><button id="raw" aria-pressed="false">실폭도로 원본</button><button id="new" aria-pressed="false">개선 시안</button><button id="conflict" aria-pressed="false">중첩 보기</button><button id="pitch" aria-pressed="false">3D</button></div><div class="status" id="status" role="status">지도 데이터 불러오는 중…</div></div></div><div class="note panel"><div class="legend"><span><i class="swatch" style="background:#D2DCDB"></i>건물</span><span><i class="swatch" style="background:#fff"></i>도로</span><span><i class="swatch" style="background:#e57b58"></i>중첩·검토 대상</span></div><div>표시용 공간 보정안입니다. 도로가 끊기는 구간은 실측 확인이 필요하며 길찾기에는 적용하지 않습니다.</div></div><script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script><script>
(async()=>{const status=document.getElementById('status');try{
 const manifest=await fetch('./manifest.json').then(r=>{if(!r.ok)throw Error('manifest');return r.json()});
 const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/bright',center:[126.949,37.502],zoom:16.2,maxZoom:19,pitch:0});
 map.addControl(new maplibregl.NavigationControl({showCompass:true}),'top-right');
 const buttons=['old','raw','new'];let mode='old',showConflict=false,is3d=false;const nativeRoads=[],buildingIds=[];
 const set=(id,v)=>{if(map.getLayer(id))map.setLayoutProperty(id,'visibility',v?'visible':'none')};
 function update(){for(const id of nativeRoads)set(id,mode==='old');set('preview-raw',mode==='raw');set('preview-clean',mode==='new');set('preview-conflict',showConflict);
 for(const id of buildingIds){set(id+'-2d',!is3d);set(id+'-3d',is3d)}
 for(const id of buttons)document.getElementById(id).setAttribute('aria-pressed',String(id===mode));
 document.getElementById('conflict').setAttribute('aria-pressed',String(showConflict));document.getElementById('pitch').setAttribute('aria-pressed',String(is3d));
 status.textContent='건물 '+manifest.building_count.toLocaleString()+'개 · 중첩 검토 '+manifest.conflict_count.toLocaleString()+'건';}
 await new Promise((resolve,reject)=>{map.once('load',resolve);setTimeout(()=>reject(Error('지도 연결 지연')),45000)});
 const layers=map.getStyle().layers;const symbol=layers.find(l=>l.type==='symbol')?.id;
 for(const l of layers){const id=l.id,sl=l['source-layer'];if(sl==='building'&&['fill','fill-extrusion','line'].includes(l.type))set(id,false);
 if(sl==='transportation'&&['line','fill'].includes(l.type)&&!/rail|tram|subway|ferry|aerial|tunnel|bridge/i.test(id))nativeRoads.push(id);
 if(l.type==='background')map.setPaintProperty(id,'background-color','#e1e4dc');
 if(l.type==='fill'&&/landuse|landcover/.test(id)&&!/park|wood|forest|grass|water/.test(id))map.setPaintProperty(id,'fill-color','#e1e4dc');
 if(l.type==='line'&&nativeRoads.includes(id)&&!/casing|outline/.test(id))map.setPaintProperty(id,'line-color','#ffffff');}
 for(const [id,file,color] of [['preview-raw','road-original.geojson','#ffffff'],['preview-clean','road-display.geojson','#ffffff'],['preview-conflict','conflicts.geojson','#e57b58']]){
 map.addSource(id,{type:'geojson',data:'./'+file,tolerance:0,maxzoom:19});map.addLayer({id,type:'fill',source:id,layout:{visibility:'none'},paint:{'fill-color':color,'fill-opacity':id==='preview-conflict'?.8:1,'fill-antialias':true}},symbol);}
 const loaded=new Set(),pending=new Set();async function loadBuildings(){const b=map.getBounds();for(const f of manifest.building_files){if(loaded.has(f.file)||pending.has(f.file)||f.bbox[2]<b.getWest()||f.bbox[0]>b.getEast()||f.bbox[3]<b.getSouth()||f.bbox[1]>b.getNorth())continue;pending.add(f.file);
 try{const data=await fetch('./'+f.file).then(r=>{if(!r.ok)throw Error(f.file);return r.json()});const id='preview-'+f.file.replace('.geojson','');map.addSource(id,{type:'geojson',data,tolerance:0,maxzoom:19});map.addLayer({id:id+'-2d',type:'fill',source:id,paint:{'fill-color':'#D2DCDB','fill-opacity':1,'fill-antialias':false}},symbol);map.addLayer({id:id+'-3d',type:'fill-extrusion',source:id,paint:{'fill-extrusion-color':'#D2DCDB','fill-extrusion-height':['get','h'],'fill-extrusion-base':0,'fill-extrusion-opacity':1}},symbol);buildingIds.push(id);loaded.add(f.file);update()}catch(e){status.textContent='건물 로딩 실패: '+e.message}finally{pending.delete(f.file)}}}
 for(const id of buttons)document.getElementById(id).onclick=()=>{mode=id;update()};document.getElementById('conflict').onclick=()=>{showConflict=!showConflict;update()};document.getElementById('pitch').onclick=()=>{is3d=!is3d;map.easeTo({pitch:is3d?45:0,duration:450});update()};map.on('moveend',loadBuildings);await loadBuildings();update();
 // Put conflict diagnostics above building fills only when explicitly selected.
 const orig=update;document.getElementById('conflict').onclick=()=>{showConflict=!showConflict;orig();if(showConflict)map.moveLayer('preview-conflict',symbol)};
 window.__roadPreview={map,manifest};
 }catch(e){status.textContent='프리뷰 연결 실패: '+e.message}})();
</script></body></html>
